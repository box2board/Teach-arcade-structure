<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Teach Arcade Flagship World — PlayCanvas Spike</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #09141d; }
    #application { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .topbar { position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
    .panel { background: rgba(7, 18, 26, .82); border: 1px solid rgba(255,255,255,.16); border-radius: 14px; box-shadow: 0 12px 38px rgba(0,0,0,.25); backdrop-filter: blur(8px); }
    .brand { padding: 10px 13px; max-width: 470px; }
    .brand strong { display: block; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #f4d06f; }
    .brand span { display: block; margin-top: 3px; color: #dce7ee; font-size: 12px; line-height: 1.35; }
    .stats { padding: 9px 12px; min-width: 120px; text-align: right; font-size: 12px; line-height: 1.55; color: #dce7ee; }
    .status { position: absolute; left: 50%; top: max(86px, calc(env(safe-area-inset-top) + 72px)); transform: translateX(-50%); padding: 8px 12px; font-weight: 700; font-size: 12px; letter-spacing: .03em; color: #fff; opacity: 0; transition: opacity .2s ease; }
    .status.show { opacity: 1; }
    .crosshair { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; transform: translate(-50%,-50%); border: 2px solid rgba(255,255,255,.8); border-radius: 50%; box-shadow: 0 0 0 3px rgba(0,0,0,.22); }
    .controls-note { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); padding: 9px 11px; font-size: 11px; line-height: 1.5; color: #dce7ee; max-width: 440px; }
    .touch-controls { display: none; position: absolute; inset: 0; pointer-events: none; }
    .touch-pad, .touch-actions { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); pointer-events: auto; }
    .touch-pad { left: max(18px, env(safe-area-inset-left)); width: 162px; height: 162px; }
    .touch-pad button, .touch-actions button { position: absolute; border: 1px solid rgba(255,255,255,.24); background: rgba(7,18,26,.72); color: white; border-radius: 18px; font: 700 16px/1 system-ui; backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,.18); touch-action: none; }
    .touch-pad button { width: 52px; height: 52px; }
    .touch-pad .up { left: 55px; top: 0; }
    .touch-pad .down { left: 55px; bottom: 0; }
    .touch-pad .left { left: 0; top: 55px; }
    .touch-pad .right { right: 0; top: 55px; }
    .touch-actions { right: max(18px, env(safe-area-inset-right)); width: 190px; height: 164px; }
    .touch-actions button { min-width: 72px; height: 46px; padding: 0 12px; font-size: 12px; }
    .touch-actions .jump { right: 0; bottom: 0; }
    .touch-actions .sprint { right: 82px; bottom: 0; }
    .touch-actions .build { right: 0; bottom: 56px; }
    .touch-actions .place { right: 82px; bottom: 56px; }
    .touch-actions .rotate { right: 0; bottom: 112px; }
    @media (pointer: coarse), (max-width: 900px) {
      .touch-controls { display: block; }
      .controls-note { display: none; }
      .brand { max-width: min(58vw, 420px); }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.22.2/build/playcanvas.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="application" aria-label="Teach Arcade 3D world prototype"></canvas>
  <div class="hud">
    <div class="topbar">
      <div class="panel brand">
        <strong>Flagship World — Technical Spike</strong>
        <span>Systems test only. Primitive art is intentional; this is not the visual target.</span>
      </div>
      <div class="panel stats"><div id="fps">FPS: --</div><div id="mode">Mode: Explore</div><div id="objects">Builds: 0</div></div>
    </div>
    <div id="status" class="panel status">Build mode enabled</div>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="panel controls-note">WASD move · Shift sprint · Space jump · drag mouse to orbit · B build mode · E place · R rotate · Backspace remove last build</div>
    <div class="touch-controls">
      <div class="touch-pad">
        <button class="up" data-hold="forward">▲</button>
        <button class="down" data-hold="back">▼</button>
        <button class="left" data-hold="left">◀</button>
        <button class="right" data-hold="right">▶</button>
      </div>
      <div class="touch-actions">
        <button class="rotate" data-action="rotate">Rotate</button>
        <button class="build" data-action="build">Build</button>
        <button class="place" data-action="place">Place</button>
        <button class="sprint" data-hold="sprint">Sprint</button>
        <button class="jump" data-action="jump">Jump</button>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
