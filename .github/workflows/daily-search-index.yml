name: Daily Search Index

on:
  schedule:
    - cron: "17 9 * * *" # daily at 09:17 UTC (~4:17 AM ET)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Build unified search index
        run: node scripts/build-search-index.mjs

      - name: Commit changes if any
        run: |
          git config user.name "teach-arcade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/sitemap.xml public/search-index.json
          git diff --cached --quiet || (git commit -m "Daily: refresh sitemap + search index" && git push)
