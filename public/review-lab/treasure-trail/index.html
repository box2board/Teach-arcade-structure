<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore a woodland, answer your chosen review topic, and dig for rare jewels in Treasure Trail."><title>Treasure Trail · Teach Arcade Review Lab</title><link rel="stylesheet" href="./styles.css"><link rel="icon" href="/favicon.ico"><script type="module" src="./game.js"></script></head><body><div id="app"><header><strong>Treasure Trail</strong><a href="/review-lab/">Review Lab</a><div id="hud"><span title="Juice">⚡ <b id="juice">0</b></span><span title="Treasure value">◆ <b id="score">0</b></span><span title="Time remaining">◷ <b id="clock">2:00</b></span></div><button id="pause" disabled>Pause</button><button id="full" aria-label="Fullscreen">⛶</button></header><div id="world"><canvas id="canvas" aria-label="Treasure Trail woodland map. Move with arrows or WASD. Press E or Space to open chests and dig." tabindex="0"></canvas><div id="topic-name">Choose a review topic</div><div id="hint" role="status" aria-live="polite"></div><div id="touch" aria-label="Movement"><div></div><button data-dir="up" aria-label="Move up">▲</button><div></div><button data-dir="left" aria-label="Move left">◀</button><button data-dir="down" aria-label="Move down">▼</button><button data-dir="right" aria-label="Move right">▶</button></div><button id="action" disabled>Open / dig</button><div id="overlay"><div id="card" role="dialog" aria-modal="true" aria-label="Game setup and questions"></div></div></div></div><noscript>This game requires JavaScript.</noscript></body></html>
