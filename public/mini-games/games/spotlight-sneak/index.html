<script>
(()=>{'use strict';const root=document.getElementById('spotlight-fixed'),q=s=>root.querySelector(s),c=q('canvas'),ctx=c.getContext('2d'),overlay=q('#sn-overlay');const bounds={left:22,right:578,top:92,bottom:632};const booths=[{x:110,y:180,w:100,h:64,name:'POPCORN',color:'#ca707c'},{x:390,y:180,w:100,h:64,name:'PRIZES',color:'#5baca5'},{x:245,y:310,w:110,h:68,name:'TICKETS',color:'#d5a14b'},{x:105,y:440,w:105,h:68,name:'SWEETS',color:'#8e83bb'},{x:390,y:440,w:105,h:68,name:'TOY BOX',color:'#5994af'}];let s,keys=new Set(),held=new Map(),last=0;
function reset(){s={x:300,y:585,vx:0,vy:0,t:0,score:0,caught:0,exposure:0,immune:0,stun:0,phase:'ready',walk:0,face:1,target:null,tickets:[],effects:[],lights:[{x:36,y:110,base:.9,rate:.65,phase:Math.random()*6.28},{x:564,y:110,base:2.2,rate:.8,phase:Math.random()*6.28},{x:300,y:625,base:-1.57,rate:.55,phase:Math.random()*6.28}]};for(let i=0;i<8;i++)s.tickets.push(ticket())}const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function clear(x,y,r=15){return !booths.some(b=>x>b.x-r&&x<b.x+b.w+r&&y>b.y-r&&y<b.y+b.h+r)}function ticket(){let x,y;do{x=40+Math.random()*520;y=120+Math.random()*470}while(!clear(x,y,24)||Math.hypot(x-s.x,y-s.y)<55);return{x,y,gold:Math.random()<.18}}
function angle(l){return l.base+Math.sin(s.t*l.rate*(1+s.t/85)+l.phase)*1.05+Math.sin(s.t*1.7+l.phase)*.12}function blocked(l,x,y){return booths.some(b=>{let lo=0,hi=1;for(const [p,d,min,max]of[[l.x,x-l.x,b.x,b.x+b.w],[l.y,y-l.y,b.y,b.y+b.h]]){if(Math.abs(d)<1e-9){if(p<min||p>max)return false}else{let a=(min-p)/d,z=(max-p)/d;lo=Math.max(lo,Math.min(a,z));hi=Math.min(hi,Math.max(a,z));if(lo>hi)return false}}return hi>0&&lo<1})}
// All emitters are inside the same field used by beam clipping. Shared occlusion matches detection.
function rayEnd(l,a){for(let d=2;d<=570;d+=2){const x=l.x+Math.cos(a)*d,y=l.y+Math.sin(a)*d;if(x<bounds.left||x>bounds.right||y<bounds.top||y>bounds.bottom||blocked(l,x,y))return d}return 570}
function active(){return s.lights.slice(0,s.t<12?2:3)}function update(dt){if(s.phase!=='playing')return;s.t=Math.min(35,s.t+dt);const oldX=s.x,oldY=s.y;s.immune=Math.max(0,s.immune-dt);s.stun=Math.max(0,s.stun-dt);let dx=Number(keys.has('arrowright')||keys.has('d'))-Number(keys.has('arrowleft')||keys.has('a')),dy=Number(keys.has('arrowdown')||keys.has('s'))-Number(keys.has('arrowup')||keys.has('w'));for(const v of held.values()){dx+=v[0];dy+=v[1]}if(s.target&&!dx&&!dy){dx=s.target.x-s.x;dy=s.target.y-s.y;if(Math.hypot(dx,dy)<4){dx=dy=0;s.target=null}}let n=Math.hypot(dx,dy);if(n){dx/=n;dy/=n}if(s.stun)dx=dy=0;s.vx+=(dx*205-s.vx)*Math.min(1,dt*16);s.vy+=(dy*205-s.vy)*Math.min(1,dt*16);let x=clamp(s.x+s.vx*dt,37,563),y=clamp(s.y+s.vy*dt,107,610);if(clear(x,s.y))s.x=x;else s.vx=0;if(clear(s.x,y))s.y=y;else s.vy=0;const traveled=Math.hypot(s.x-oldX,s.y-oldY);s.gaitSpeed=traveled/dt;s.walk=(s.walk||0)+traveled*Math.PI*2/96;let seen=false,cover=false;for(const l of active()){let diff=Math.atan2(Math.sin(Math.atan2(s.y-l.y,s.x-l.x)-angle(l)),Math.cos(Math.atan2(s.y-l.y,s.x-l.x)-angle(l)));if(Math.hypot(s.x-l.x,s.y-l.y)<570&&Math.abs(diff)<.24+s.t/350){if(blocked(l,s.x,s.y))cover=true;else seen=true}}s.seen=seen;s.cover=cover&&!seen;s.exposure=clamp(s.exposure+dt*(seen&&!s.immune?2.4:-3),0,1);if(s.exposure>=1){s.caught++;s.score=Math.max(0,s.score-25);s.immune=1.8;s.stun=.7;s.exposure=0;s.effects.push({x:s.x,y:s.y,text:'SPOTTED −25',age:0})}if(!s.stun)for(let i=0;i<s.tickets.length;i++){const t=s.tickets[i];if(Math.hypot(t.x-s.x,t.y-s.y)<25){const points=(t.gold?30:10)*(s.t>=25?2:1);s.score+=points;s.effects.push({x:t.x,y:t.y,text:'+'+points,age:0});s.tickets[i]=ticket()}}s.effects.forEach(e=>e.age+=dt);s.effects=s.effects.filter(e=>e.age<.8);if(s.t>=35){s.phase='finishing';setTimeout(()=>{if(s.phase!=='finishing')return;s.phase='done';overlay.hidden=false;q('#sn-overlay h2').textContent=s.score+' tickets collected';q('#sn-overlay p').textContent=s.caught+' times spotted · Play again to beat your score';q('#sn-start').textContent='Play again';root.dispatchEvent(new CustomEvent('sparks:minigame-complete',{bubbles:true,detail:{gameId:'spotlight-sneak',score:s.score,time:35}}))},800)}}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function text(t,x,y,size,color='#f8ebcb'){ctx.fillStyle=color;ctx.font=`700 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}

const scenery=document.createElement('canvas');scenery.width=1200;scenery.height=1400;let sceneryReady=false;

// Distant Ferris wheel and tent silhouettes establish a real carnival beyond the fence.
ctx.strokeStyle='#698083';ctx.lineWidth=2;ctx.beginPath();ctx.arc(72,63,47,0,7);ctx.stroke();for(let i=0;i<10;i++){let a=i*6.28/10,x=72+47*Math.cos(a),y=63+47*Math.sin(a);line([[72,63],[x,y]],'#4f6875',1);rounded(x-5,y-2,10,9,3,'#bd8d5c');ellipse(x,y-4,2,2,'#f3cd8c')}line([[72,63],[49,111]],'#607781',4);line([[72,63],[94,111]],'#607781',4);path([[397,104],[440,40],[483,104]],'#775e76');path([[409,104],[440,40],[450,104]],'#bc8e8a');line([[440,40],[440,23]],'#bda77a');path([[440,23],[460,29],[440,33]],'#e6b56c');
rounded(18,91,564,548,20,'#15383b');rounded(25,96,550,535,17,'#425052');
// Staggered irregular pavers, scuffed edges and subtle stone grain, cached once.
for(let row=0;row<30;row++)for(let col=0;col<19;col++){let x=26+col*31-(row%2)*15,y=97+row*18;if(x<25||x+29>576||y+16>631)continue;let n=Math.sin(row*91+col*17)*.5+.5;rounded(x,y,29,16,3,['#485657','#4b5857','#435354','#505b58'][Math.floor(n*3.99)]);line([[x+3,y+2],[x+24,y+2]],'#74807828',1);if(n>.7)line([[x+6,y+10],[x+12,y+11]],'#243f4338',1)}
for(let y=125;y<625;y+=32){for(const x of[10,590]){rounded(x-5,y,10,29,3,'#243e3c');path([[x-5,y],[x,y-5],[x+5,y]],'#52675b')}}for(const x of[8,587]){rounded(x,116,5,514,2,'#637366')}
for(let i=0;i<18;i++){let x=28+i*32,y=90+Math.sin(i/17*Math.PI)*20;line([[x,y],[x+32,90+Math.sin((i+1)/17*Math.PI)*20]],'#18242a',2);glow(x,y+4,11,'#ffd28f24');ellipse(x,y+4,2.3,3.5,i%3?'#ffd99b':'#a5e5ce')}
rounded(184,22,232,48,13,'#0d202d');ctx.strokeStyle='#c8a367';ctx.lineWidth=2;ctx.strokeRect(197,30,206,31);text('MOONLIT MIDWAY',300,51,18,'#ffe2a1');for(let x=190;x<=410;x+=20)ellipse(x,26,1.8,1.8,'#edca83');
for(let i=0;i<14;i++){const x=42+i*40,y=647+Math.sin(i*.9)*4;line([[x,y],[x+40,647+Math.sin((i+1)*.9)*4]],'#091b26',2);path([[x,y],[x+15,y+20],[x+28,y]],i%2?'#bb7875':'#4e9e96')}
}
function booth(b,index){const{x,y,w,h,color}=b;ctx.save();ellipse(x+w/2+5,y+h+5,w*.57,12,'#071e2870');rounded(x,y,w,h,5,'#5f463e');let wood=ctx.createLinearGradient(x,y,x+w,y);wood.addColorStop(0,'#875d45');wood.addColorStop(.5,'#ab7955');wood.addColorStop(1,'#68463c');rounded(x+3,y+7,w-6,h-8,3,wood);for(let i=8;i<w;i+=13)line([[x+i,y+17],[x+i,y+h-3]],'#3a302b60',1);rounded(x+9,y+19,w-18,29,3,'#162c35');glow(x+w/2,y+35,45,'#e9b56027');

rounded(x-2,y+h-17,w+4,8,2,'#cf9d68');rounded(x+7,y+h-8,w-14,7,2,'#68473e');
// Curved striped canvas canopy with scalloped valance, within the collision footprint.
for(let i=0;i<8;i++){let left=x+i*w/8,right=x+(i+1)*w/8;path([[x+w/2+(left-x-w/2)*.8,y-1],[x+w/2+(right-x-w/2)*.8,y-1],[right,y+17],[left,y+17]],i%2?'#f1d9ac':color);ellipse((left+right)/2,y+17,w/16,4,i%2?'#e7c995':color)}line([[x+9,y-2],[x+w-9,y-2]],'#f5dda9',2);for(let i=0;i<=8;i++){let px=x+i*w/8;ellipse(px,y+23,1.6,1.6,'#ffe9ac')}
rounded(x+w*.16,y-16,w*.68,16,5,'#18333d');text(b.name,x+w/2,y-4,10,'#ffdf9d');line([[x+3,y+25],[x+3,y+h-14]],'#deb485',3);line([[x+w-3,y+25],[x+w-3,y+h-14]],'#deb485',3);ctx.restore()}
function lamp(l,on){ctx.save();ctx.translate(l.x,l.y);ellipse(2,8,20,9,'#0b202cb0');line([[-13,12],[0,-1],[13,12]],'#72848c',4);ellipse(0,0,8,8,'#465861');ellipse(0,0,4,4,'#b4bdb0');ctx.rotate(angle(l));rounded(-14,-12,30,24,7,'#243c4a');rounded(-10,-10,22,20,5,'#697e83');line([[-8,-7],[8,-7]],'#c3cfbd',2);for(let i=-5;i<8;i+=4)line([[-12,i],[-5,i]],'#2a4350',2);path([[10,-10],[20,-15],[23,-10],[18,-6],[18,6],[23,10],[20,15],[10,10]],'#344b56');ellipse(17,0,3,9,on?'#fff5ce':'#3d5965');if(on)glow(19,0,20,'#fff0ad70');ellipse(-4,0,2,2,on?'#99edb1':'#a96554');ctx.restore()}
function player(){const speed=Math.min(1,(s.gaitSpeed||0)/180);const step=Math.sin(s.walk||0),bob=(1-Math.cos((s.walk||0)*2))*.35*speed,facing=s.vx>10?1:s.vx< -10?-1:(s.face||1);s.face=facing;ctx.save();ctx.translate(s.x,s.y);ellipse(0,11,15,5,'#081e2b90');if(!s.immune||Math.floor(s.immune*12)%2){ctx.translate(0,-bob);ctx.scale(facing,1);for(const side of[-1,1]){const phase=(s.walk||0)+(side===1?Math.PI:0),swing=Math.sin(phase)*speed,lift=Math.max(0,Math.cos(phase))*2.5*speed;const norm=Math.hypot(s.vx,s.vy)||1,ax=side*5,ay=-1,fx=ax+swing*4*s.vx/norm*facing,fy=12+bob+swing*2*s.vy/norm-lift;const dx=fx-ax,dy=fy-ay,d=Math.max(.001,Math.hypot(dx,dy)),half=d/2,bend=Math.sqrt(Math.max(0,8.5*8.5-half*half)),kx=ax+dx/2+dy/d*bend,ky=ay+dy/2-dx/d*bend;line([[ax,ay],[kx,ky],[fx,fy]],side<0?'#203348':'#2c4258',5);ellipse(fx+1,fy+1,4.5,2.5,'#e1d7bf');line([[fx-2,fy+2],[fx+4,fy+2]],'#9caca7',1)}line([[-10,-15],[-13,-4-step*4*speed]],'#4e9f9b',6);ellipse(-13,-2-step*4*speed,3,3,'#e5b78e');rounded(-10,-21,20,24,7,'#57b6a8');path([[-7,-19],[-2,-9],[1,-19]],'#a5dbbd');line([[1,-9],[1,1]],'#2f817f',1);rounded(-9,-5,18,5,2,'#396c6c');line([[10,-15],[13,-5+step*4*speed]],'#75cbb7',6);ellipse(13,-3+step*4*speed,3,3,'#edc096');ellipse(1,-27,10,11,'#edbf96');ellipse(-7,-26,3,4,'#c98f71');path([[-8,-32],[-7,-24],[-5,-26],[-4,-34],[8,-31],[9,-35],[0,-39]],'#624334');ellipse(7,-27,1.1,1.5,'#233540');path([[10,-26],[13,-23],[9,-22]],'#edbf96');line([[5,-19],[9,-20]],'#ac7661',1);ellipse(0,-36,12,5,'#daaa55');path([[-9,-36],[-7,-44],[7,-44],[9,-36]],'#edc373');line([[-9,-37],[9,-37]],'#9b6b3f',2);ellipse(9,-35,6,2,'#f3cf84');rounded(-10,-14,6,13,3,'#c18c54');}ctx.restore();if(s.exposure){ctx.strokeStyle='#ffad7a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y-14,27,-Math.PI/2,-Math.PI/2+s.exposure*6.28);ctx.stroke()}}
function draw(){ctx.clearRect(0,0,600,700);if(!sceneryReady){background();scenery.getContext('2d').drawImage(c,0,0,1200,1400);sceneryReady=true}else ctx.drawImage(scenery,0,0,600,700);
for(const l of active()){let a=angle(l),half=.24+s.t/350;ctx.save();ctx.beginPath();ctx.moveTo(l.x,l.y);for(let i=0;i<=90;i++){let b=a-half+2*half*i/90,d=rayEnd(l,b);ctx.lineTo(l.x+Math.cos(b)*d,l.y+Math.sin(b)*d)}ctx.closePath();ctx.clip();let beam=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,570);beam.addColorStop(0,'#fff4b89a');beam.addColorStop(.5,'#ffdf7e43');beam.addColorStop(1,'#ffeaa00a');ctx.fillStyle=beam;ctx.fillRect(0,0,600,700);for(let i=0;i<20;i++){let d=50+(i*71+s.t*8)%480,b=a+Math.sin(i*4)*half;ellipse(l.x+Math.cos(b)*d,l.y+Math.sin(b)*d,.8,.8,'#fff8d940')}ctx.restore()}
for(const t of s.tickets){let bob=Math.sin(s.t*3+t.x)*2;ellipse(t.x,t.y+9,10,3,'#102d3655');glow(t.x,t.y,18,t.gold?'#ffcd6238':'#7bdcbb18');ctx.save();ctx.translate(t.x,t.y+bob);ctx.rotate(-.25+Math.sin(t.x+s.t*2)*.08);rounded(-12,-8,24,16,3,t.gold?'#eab85e':'#6bbda6');rounded(-10,-6,20,12,2,t.gold?'#ffdf8c':'#b0ead0');line([[-5,-5],[-5,5]],'#4c8067',1);text(t.gold?'★':'10',3,3,9,'#315945');for(const edge of[-12,12]){ellipse(edge,0,2.2,2.2,'#39585b')}for(let i=-4;i<=4;i+=3)ellipse(-5,i,.5,.5,'#37695e');if(t.gold){ctx.rotate(s.t*.7);line([[-17,0],[-13,0]],'#ffe4a2',1.5);line([[0,-16],[0,-12]],'#ffe4a2',1.5);line([[14,0],[18,0]],'#ffe4a2',1.5)}ctx.restore()}
