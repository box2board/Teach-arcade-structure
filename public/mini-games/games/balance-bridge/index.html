<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mini-game Library</title><link rel="stylesheet" href="../arcade-five/style.css"></head><body data-game="balance-bridge"><main><header><div><a href="/mini-games/">← Library</a><h1 id="name"></h1></div><button id="pause" disabled>Pause</button></header><section class="stats" aria-label="Round status"><div><small>SECONDS LEFT</small><b id="time">45.0</b></div><div><small>SCORE</small><b id="score">0</b></div><div><small>STATUS</small><b id="extra">READY</b></div></section><section class="stage"><canvas id="canvas" aria-label="balance bridge game screen"></canvas><div class="message" id="message"></div><div class="overlay" id="overlay"><section class="panel"><h2 id="title"></h2><p id="description"></p><p>45 seconds. Build your best score.</p><button class="gold" id="start">Start round →</button></section></div></section><section class="controls"><div class="steer" id="steer-wrap"><label for="steer">LEFT / RIGHT</label><input id="steer" type="range" min="-1" max="1" step=".01" value="0" aria-label="Steer or aim left and right"></div><button class="gold action" id="action" disabled></button></section><p class="hint" id="hint"></p></main><script type="module" src="../arcade-five/view.js"></script></body></html>
