<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,follow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess Engine Tests</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
      color: #0f172a;
      background: #f8fafc;
    }
    #test-results {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #e2e8f0;
    }
    .pass {
      color: #15803d;
    }
    .fail {
      color: #b91c1c;
    }
  </style>
  <script src="/brain-arcade/chess/script.js" defer></script>
  <script src="/brain-arcade/chess/tests.js" defer></script>

  <meta name="description" content="Internal test harness for the Brain Arcade chess implementation." />
  <link rel="canonical" href="https://teacharcade.com/brain-arcade/chess/tests.html" />
  <meta property="og:title" content="Brain Arcade Chess Tests | Teach Arcade" />
  <meta property="og:description" content="Internal chess test page for Teach Arcade QA checks." />

</head>
<body>
  <h1>Chess Regression Tests</h1>
  <p>Open the console for detailed logs.</p>

  <div id="test-results" aria-live="polite"></div>

  <div class="controls" hidden>
    <select id="mode"><option value="2p">2 Player</option></select>
    <select id="side"><option value="white">Play as White</option></select>
    <select id="difficulty"><option value="easy">Easy</option></select>
    <button id="new-game" type="button">New Game</button>
  </div>
  <div id="turn"></div>
  <div class="board-wrapper">
    <div id="debug-status" class="debug-status" hidden></div>
    <div id="board"></div>
  </div>
</body>
</html>
