<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Play free browser chess on Teach Arcade with two-player mode or a computer opponent." />
  <title>Brain Arcade · Chess</title>
  <link rel="canonical" href="https://teacharcade.com/brain-arcade/chess/" />

  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/brain-arcade/chess/style.css" />
  <script src="/assets/scripts/nav.js?v=5" defer></script>
  <script src="/brain-arcade/chess/script.js" defer></script>

  <meta property="og:title" content="Brain Arcade Chess | Teach Arcade" />
  <meta property="og:description" content="Play browser-based chess against another player or a computer opponent on Teach Arcade Brain Arcade." />

</head>
<body>
  <div id="site-header"></div>
  <main class="chess-page">
    <header class="chess-hero">
      <h1>♟️ Brain Arcade Chess</h1>
      <p class="subtitle">Classic strategy. Two players or a quick game against the computer.</p>
    </header>

    <section class="chess-board" aria-label="Chess game">
      <div class="controls" role="group" aria-label="Game settings">
        <label class="control">
          <span>Mode</span>
          <select id="mode">
            <option value="2p">2 Player</option>
            <option value="cpu">Vs Computer</option>
          </select>
        </label>
        <label class="control">
          <span>Side</span>
          <select id="side">
            <option value="white">Play as White</option>
            <option value="black">Play as Black</option>
          </select>
        </label>
        <button class="reset" type="button" id="new-game">New Game</button>
      </div>

      <div id="turn" class="turn" role="status" aria-live="polite"></div>
      <div class="board-wrapper">
        <div id="debug-status" class="debug-status" role="status" aria-live="polite" hidden></div>
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
      </div>
    </section>
</main>
</body>
</html>
