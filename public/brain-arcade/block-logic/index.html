<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Logic</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description" content="Explore Block Logic resources, games, and teaching tools from Teach Arcade." />
  <link rel="canonical" href="https://teacharcade.com/brain-arcade/block-logic/" />
  <meta property="og:title" content="Block Logic" />
  <meta property="og:description" content="Explore Block Logic resources, games, and teaching tools from Teach Arcade." />
  <meta property="og:url" content="https://teacharcade.com/brain-arcade/block-logic/" />
  <meta property="og:image" content="https://teacharcade.com/assets/images/social/ta-social-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Block Logic" />
  <meta name="twitter:description" content="Explore Block Logic resources, games, and teaching tools from Teach Arcade." />
  <meta name="twitter:image" content="https://teacharcade.com/assets/images/social/ta-social-card.png" />

</head>
<body>
  <div class="game-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-left">
        <div class="crown">★</div>
        <span id="best-score">0</span>
      </div>
      <div class="score" id="current-score">0</div>
      <div class="top-right">
        <div class="gear-wrapper" title="Settings">
          <div class="gear-icon"></div>
        </div>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid-wrapper">
      <div id="grid" class="grid"></div>
    </div>

    <!-- Floating bonus text -->
    <div id="floating-text-container"></div>

    <!-- Game Over -->
    <div id="game-over" class="game-over hidden" aria-live="polite">
      <div class="game-over-card">
        <h2>Game Over</h2>
        <p>Your score: <span id="final-score">0</span></p>
        <div class="game-over-actions">
          <button type="button" id="play-again">Play Again</button>
          <a href="/brain-arcade/" class="menu-link">Game Menu</a>
        </div>
      </div>
    </div>

    <!-- Pieces -->
    <div class="pieces-container">
      <div class="piece" data-piece-index="0"></div>
      <div class="piece" data-piece-index="1"></div>
      <div class="piece" data-piece-index="2"></div>
    </div>
  </div>

  <!-- Game Script -->
  <script src="game.js"></script>
</body>
</html>
