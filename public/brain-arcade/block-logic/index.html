<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Logic</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description" content="Play Block Logic, a free block-placement puzzle. Drag shapes onto the grid, clear rows and columns, build streaks, and chase a new high score." />
  <link rel="canonical" href="https://teacharcade.com/brain-arcade/block-logic/" />
  <meta property="og:title" content="Block Logic" />
  <meta property="og:description" content="Drag shapes onto the grid, clear lines, and chase a high score in Block Logic." />
  <meta property="og:url" content="https://teacharcade.com/brain-arcade/block-logic/" />
  <meta property="og:image" content="https://teacharcade.com/assets/images/social/ta-social-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Block Logic" />
  <meta name="twitter:description" content="Drag shapes, clear lines, and chase your high score in Block Logic." />
  <meta name="twitter:image" content="https://teacharcade.com/assets/images/social/ta-social-card.png" />

</head>
<body>
  <h1 class="sr-only">Block Logic</h1>
  <div class="game-container">
    <div class="game-label">
      <span>Brain Arcade</span>
      <strong>Block Logic</strong>
      <small>Drag a shape onto the board. Fill a full row or column to clear it.</small>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-left" aria-label="Best score">
        <div class="crown">★</div>
        <span class="best-stack"><small>Best</small><strong id="best-score">0</strong></span>
      </div>
      <div class="score-stack" aria-label="Current score"><small>Score</small><div class="score" id="current-score">0</div></div>
      <div class="top-right">
        <button type="button" id="new-game" class="icon-button" aria-label="Start a new Block Logic game" title="New Game">↻</button>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid-wrapper">
      <div id="grid" class="grid"></div>
    </div>

    <!-- Floating bonus text -->
    <div id="floating-text-container"></div>

    <!-- Game Over -->
    <div id="game-over" class="game-over hidden" aria-live="polite">
      <div class="game-over-card">
        <h2>Game Over</h2>
        <p>Your score: <span id="final-score">0</span></p>
        <div class="game-over-actions">
          <button type="button" id="play-again">Play Again</button>
          <a href="/brain-arcade/" class="menu-link">Game Menu</a>
        </div>
      </div>
    </div>

    <!-- Pieces -->
    <div class="pieces-container">
      <div class="piece" data-piece-index="0"></div>
      <div class="piece" data-piece-index="1"></div>
      <div class="piece" data-piece-index="2"></div>
    </div>
    <a class="back-link" href="/brain-arcade/">← Brain Arcade</a>
  </div>

  <!-- Game Script -->
  <script src="game.js"></script>
</body>
</html>
