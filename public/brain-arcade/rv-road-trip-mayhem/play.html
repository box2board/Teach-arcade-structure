<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RV Road Trip Mayhem</title><style>*{box-sizing:border-box}body{margin:0;background:#0c131a;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.w{width:min(1120px,100%);padding:8px}.c{background:#15202b;border:1px solid #334454;border-radius:16px;overflow:hidden}.hud{display:flex;gap:8px;flex-wrap:wrap;padding:8px;background:#101820}.p{background:#24313d;border-radius:999px;padding:6px 10px;font-size:12px}canvas{width:100%;height:auto;display:block;background:#87bfe3;touch-action:none}.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.bar{height:10px;background:#293743;border-radius:999px;overflow:hidden}.fill{height:100%}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}.controls button{min-height:52px;border:1px solid #46596a;border-radius:12px;background:#2b3946;color:white;font-weight:800}.jump{background:#3769a8!important}.nit{background:#9a6328!important}.msg{text-align:center;padding:8px;font-weight:800;font-size:13px}.stunt{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-weight:1000;font-size:clamp(20px,4vw,42px);text-shadow:0 3px 10px #000;pointer-events:none;opacity:0;transition:opacity .15s}.stage{position:relative}@media(max-width:700px){.bars{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="c"><div class="hud"><span class="p">Score <b id="score">0</b></span><span class="p">Cargo <b id="cargo">5</b>/5</span><span class="p">Speed <b id="speed">0</b></span><span class="p">Combo <b id="combo">x1</b></span></div><div class="stage"><canvas id="g" width="1000" height="560"></canvas><div id="stunt" class="stunt"></div></div><div class="bars"><div><small>NITRO</small><div class="bar"><div id="nb" class="fill" style="background:#f39b38;width:45%"></div></div></div><div><small>STORM</small><div class="bar"><div id="sb" class="fill" style="background:#8057c7;width:10%"></div></div></div><div><small>DAMAGE</small><div class="bar"><div id="db" class="fill" style="background:#d85848;width:0%"></div></div></div></div><div class="controls"><button id="br">◀ BRAKE</button><button id="ju" class="jump">⬆ JUMP</button><button id="ga">GAS ▶</button><button id="ni" class="nit">⚡ NITRO</button></div><div class="msg" id="msg">Continuous stunt run — hit the giant ramps, ride the loop, outrun the storm.</div></div></div><script>(()=>{const c=document.getElementById('g'),ctx=c.getContext('2d'),W=c.width,H=c.height,$=i=>document.getElementById(i),K={g:0,b:0};const msg=$('msg'),stunt=$('stunt');const cargo=[-34,-16,4,23,39].map((o,i)=>({o,a:1,y:0,vy:0}));const gaps=[[1540,2310],[4070,4540],[6280,7030],[8360,9280],[10420,11440]];const boosts=[[1050,1540],[3470,4060],[5750,6270],[7850,8350],[9760,10410]];const pts=[[0,395],[650,395],[950,370],[1220,285],[1450,155],[1540,115],[2310,175],[2600,330],[2920,410],[3260,505],[3600,410],[3900,275],[4070,205],[4540,440],[4700,440],[5450,440],[5700,440],[6040,280],[6280,125],[7030,205],[7380,365],[7700,430],[8050,300],[8360,105],[9280,185],[9550,360],[9800,430],[10160,300],[10420,105],[11440,250],[11800,385],[12400,385]];const loop={cx:5070,cy:275,r:165,start:4680,end:5500,active:false,theta:0,done:false};const obs=[{x:2820,t:'barrels'},{x:7540,t:'hay'},{x:9470,t:'crates'},{x:11900,t:'table'}];const gates=[{x:5660,used:false},{x:9700,used:false}];let last=performance.now(),cam=0,flash=0;const R={x:120,y:350,vx:0,vy:0,a:0,on:1,jb:0,co:.18,n:45,s:10,d:0,sc:0,combo:1,finish:0};function inGap(q){return gaps.some(z=>q>z[0]&&q<z[1])}function ground(q){if(inGap(q))return null;let i=0;while(i<pts.length-2&&q>pts[i+1][0])i++;const a=pts[i],b=pts[i+1];let t=Math.max(0,Math.min(1,(q-a[0])/(b[0]-a[0])));t=t*t*(3-2*t);return a[1]+(b[1]-a[1])*t}function slope(q){const a=ground(q-8),b=ground(q+8);return a==null||b==null?0:(b-a)/16}function onBoost(q){return boosts.some(z=>q>z[0]&&q<z[1])}function callout(t){stunt.textContent=t;stunt.style.opacity=1;flash=.9}function jump(){R.jb=.22}function nit(){if(R.n<7||loop.active)return;R.n-=7;R.vx=Math.min(980,R.vx+185);R.sc+=40;msg.textContent='NITRO! Keep it pinned.'}function lose(force=.7){const a=cargo.filter(i=>i.a);if(!a.length||Math.random()>.5*force)return;const it=a[Math.floor(Math.random()*a.length)];it.a=0;it.y=R.y-50;it.vy=-190;R.sc=Math.max(0,R.sc-80);msg.textContent='Cargo flew off — keep driving!'}function hit(text){R.d=Math.min(100,R.d+8);R.vx*=.65;R.vy=-80;R.s=Math.min(100,R.s+6);R.combo=1;lose(.85);msg.textContent=text+' — keep moving!'}function reset(){Object.assign(R,{x:120,y:350,vx:0,vy:0,a:0,on:1,jb:0,co:.18,n:45,s:10,d:0,sc:0,combo:1,finish:0});obs.forEach(o=>o.dead=0);cargo.forEach(i=>{i.a=1;i.vy=0});gates.forEach(g=>g.used=false);loop.active=false;loop.theta=0;loop.done=false;cam=0}function enterLoop(){loop.active=true;loop.theta=0;R.vx=Math.max(520,R.vx);R.on=0;callout('FULL RV LOOP!');msg.textContent='Stay on the gas!'}function updateLoop(dt){const speed=Math.max(540,R.vx);loop.theta+=speed/loop.r*dt;R.x=loop.cx+loop.r*Math.sin(loop.theta);R.y=loop.cy+loop.r*Math.cos(loop.theta)-38;R.a=loop.theta;R.vx=Math.min(900,R.vx+K.g*120*dt);R.sc+=90*dt*R.combo;if(loop.theta>=Math.PI*2){loop.active=false;loop.done=true;R.x=loop.cx+105;R.y=ground(R.x)-38;R.vx=Math.max(650,R.vx);R.vy=0;R.a=0;R.on=1;R.sc+=700*R.combo;R.combo=Math.min(6,R.combo+.8);callout('LOOP CLEARED +700');msg.textContent='Loop cleared — next mega jump!'}}function upd(dt){if(R.finish)return;if(flash>0){flash-=dt;if(flash<=0)stunt.style.opacity=0}if(loop.active){updateLoop(dt);hud();cam+=(loop.cx-430-cam)*Math.min(1,dt*5);return}R.jb=Math.max(0,R.jb-dt);if(R.on)R.co=.18;else R.co=Math.max(0,R.co-dt);if(R.jb>0&&(R.on||R.co>0)){R.vy=-(620+Math.min(130,R.vx*.16));R.vx+=28;R.on=0;R.jb=0}const wasOn=R.on;const oldX=R.x;const oldSlope=slope(R.x);if(R.on){if(K.g)R.vx+=920*dt;if(K.b)R.vx-=940*dt;if(onBoost(R.x)){R.vx+=1450*dt;R.n=Math.min(100,R.n+15*dt)}R.vx*=Math.pow(.996,dt*60)}else{if(K.g)R.vx+=65*dt;R.vy+=1120*dt}R.vx=Math.max(-90,Math.min(930,R.vx));R.x+=R.vx*dt;R.y+=R.vy*dt;let gy=ground(R.x);if(wasOn&&gy==null&&ground(oldX)!=null){R.on=0;R.vy=Math.min(R.vy,-Math.max(260,Math.min(710,180+R.vx*.66+Math.max(0,-oldSlope)*260)));R.sc+=100*R.combo;callout('MEGA LAUNCH!')}else if(gy!=null&&R.y+38>=gy){const hard=R.vy>590;R.y=gy-38;R.vy=0;R.on=1;R.a*=.55;if(hard){R.d=Math.min(100,R.d+4);lose(.55)}else if(Math.abs(R.vx)>360){R.sc+=30*R.combo;R.combo=Math.min(6,R.combo+.18)}}else R.on=0;if(!loop.done&&R.x>loop.start&&R.x<loop.cx+30&&R.on&&R.vx>260)enterLoop();for(const g of gates){if(!g.used&&R.x>g.x){g.used=true;R.n=Math.min(100,R.n+38);R.d=Math.max(0,R.d-12);R.vx=Math.max(R.vx,480);callout('SERVICE BOOST!');msg.textContent='Automatic pit boost — no stopping.'}}for(const o of obs){if(o.dead)continue;const og=ground(o.x);if(!o.dead&&Math.abs(R.x-o.x)<56&&og!=null&&Math.abs(R.y-(og-35))<72){if(R.vx>330||!R.on){o.dead=1;R.sc+=220*R.combo;R.combo=Math.min(6,R.combo+.45);callout('SMASH!')}else hit('Obstacle hit')}}for(const it of cargo)if(!it.a){it.vy+=900*dt;it.y+=it.vy*dt}R.s+=dt*(2.2+Math.max(0,(330-R.vx)/95));if(R.vx>520)R.s-=dt*3.4;R.s=Math.max(0,Math.min(100,R.s));if(R.s>=100){R.s=72;hit('The storm clipped the RV')}if(R.d>=100){R.d=66;R.vx*=.5;lose(1.2)}if(R.y>680){R.x=Math.max(120,R.x-220);while(inGap(R.x))R.x-=80;R.y=(ground(R.x)||400)-95;R.vx=260;R.vy=-80;R.d=Math.min(100,R.d+7);R.s=Math.min(100,R.s+8);msg.textContent='Recovered — keep moving!'}if(R.x>12150){R.finish=1;R.sc+=cargo.filter(i=>i.a).length*500+(100-R.d)*10;callout('CAMPGROUND ESCAPE!');msg.textContent='Run complete! Score '+Math.round(R.sc)}cam+=(Math.max(0,R.x-(245-Math.min(70,R.vx/12)))-cam)*Math.min(1,dt*5);hud()}function hud(){$('score').textContent=Math.round(R.sc);$('cargo').textContent=cargo.filter(i=>i.a).length;$('speed').textContent=Math.round(Math.abs(R.vx));$('combo').textContent='x'+R.combo.toFixed(1);$('nb').style.width=R.n+'%';$('sb').style.width=R.s+'%';$('db').style.width=R.d+'%'}function drawLoop(){const sx=loop.cx-cam,sy=loop.cy;ctx.save();ctx.strokeStyle='#252b31';ctx.lineWidth=28;ctx.beginPath();ctx.arc(sx,sy,loop.r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#f0b14d';ctx.lineWidth=7;ctx.setLineDash([20,15]);ctx.beginPath();ctx.arc(sx,sy,loop.r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='900 18px system-ui';ctx.textAlign='center';ctx.fillText('RV LOOP',sx,sy+6);ctx.restore()}function drawRV(){ctx.save();ctx.translate(R.x-cam,R.y);if(loop.active)ctx.rotate(-loop.theta);else ctx.rotate(Math.max(-.22,Math.min(.22,slope(R.x)*.45)));ctx.fillStyle='#f1eee7';ctx.strokeStyle='#202a31';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-60,-34,118,55,9);ctx.fill();ctx.stroke();ctx.fillStyle='#d56f3e';ctx.fillRect(-60,-3,118,13);ctx.fillStyle='#9fd1dd';ctx.fillRect(-48,-27,31,18);ctx.fillRect(-7,-27,27,18);ctx.fillStyle='#1e252a';ctx.beginPath();ctx.arc(-40,24,17,0,Math.PI*2);ctx.arc(39,24,17,0,Math.PI*2);ctx.fill();for(let i=0;i<cargo.length;i++)if(cargo[i].a){ctx.fillStyle=['#4baac7','#d17450','#e0b94a','#65ad76','#db8b3c'][i];ctx.fillRect(-38+i*18,-52-(i%2)*7,14,10)}ctx.restore()}function draw(){const st=R.s/100,gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,`rgb(${120-55*st},${190-80*st},${225-70*st})`);gr.addColorStop(1,'#dce5d7');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.fillStyle='#718b66';ctx.beginPath();ctx.moveTo(0,H);for(let q=0;q<=W;q+=7){const y=ground(q+cam);ctx.lineTo(q,y==null?H:y)}ctx.lineTo(W,H);ctx.fill();ctx.strokeStyle='#293c2d';ctx.lineWidth=7;ctx.beginPath();let open=0;for(let q=0;q<=W;q+=7){const y=ground(q+cam);if(y==null){open=0;continue}if(!open){ctx.moveTo(q,y);open=1}else ctx.lineTo(q,y)}ctx.stroke();for(const b of boosts){const mid=(b[0]+b[1])/2,y=ground(mid);if(y==null)continue;ctx.fillStyle='#e89531';ctx.fillRect(b[0]-cam,y-12,b[1]-b[0],14)}drawLoop();for(let t=500;t<12400;t+=700){if(Math.abs(t-loop.cx)<600)continue;const y=ground(t);if(y==null)continue;ctx.fillStyle='#31563b';ctx.beginPath();ctx.moveTo(t-cam,y-105);ctx.lineTo(t-cam-34,y-20);ctx.lineTo(t-cam+34,y-20);ctx.fill();ctx.fillStyle='#674a34';ctx.fillRect(t-cam-5,y-20,10,20)}for(const o of obs){if(o.dead)continue;const y=ground(o.x);if(y==null)continue;const s=o.x-cam;ctx.fillStyle=o.t==='hay'?'#d4ad55':'#8b623e';if(o.t==='hay'){ctx.beginPath();ctx.arc(s,y-28,28,0,Math.PI*2);ctx.fill()}else ctx.fillRect(s-28,y-45,56,45)}for(const g of gates){const y=ground(g.x);if(y==null)continue;ctx.strokeStyle=g.used?'#708070':'#65e3ff';ctx.lineWidth=6;ctx.strokeRect(g.x-cam-22,y-110,44,110);ctx.fillStyle='#fff';ctx.font='800 12px system-ui';ctx.fillText('AUTO BOOST',g.x-cam-38,y-122)}for(const it of cargo)if(!it.a){ctx.fillStyle='#f0a44c';ctx.fillRect(R.x+it.o-cam,it.y,12,10)}drawRV();const edge=Math.min(710,80+R.s*6.3),sg=ctx.createLinearGradient(0,0,edge,0);sg.addColorStop(0,'rgba(45,39,71,.94)');sg.addColorStop(1,'rgba(80,59,110,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,edge,H);if(R.finish){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 44px system-ui';ctx.fillText('CAMPGROUND ESCAPE!',W/2,245);ctx.font='700 18px system-ui';ctx.fillText('Score '+Math.round(R.sc)+' • Cargo '+cargo.filter(i=>i.a).length+'/5',W/2,280);ctx.textAlign='start'}}function loopFrame(n){const dt=Math.min(.033,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loopFrame)}function hold(id,k){const b=$(id),on=e=>{e.preventDefault();K[k]=1},off=e=>{e.preventDefault();K[k]=0};b.onpointerdown=on;b.onpointerup=off;b.onpointercancel=off;b.onpointerleave=off}hold('ga','g');hold('br','b');$('ju').onpointerdown=e=>{e.preventDefault();jump()};$('ni').onpointerdown=e=>{e.preventDefault();nit()};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='d'||k==='arrowright')K.g=1;if(k==='a'||k==='arrowleft')K.b=1;if(k===' ')jump();if(k==='shift')nit();if(k==='r')reset()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='d'||k==='arrowright')K.g=0;if(k==='a'||k==='arrowleft')K.b=0});reset();hud();requestAnimationFrame(loopFrame)})();</script></body></html>
