<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RV Road Trip Mayhem</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c131a;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.w{width:min(1120px,100%);padding:8px}.c{background:#15202b;border:1px solid #334454;border-radius:16px;overflow:hidden}.hud{display:flex;gap:8px;flex-wrap:wrap;padding:8px;background:#101820}.p{background:#24313d;border-radius:999px;padding:6px 10px;font-size:12px}canvas{width:100%;height:auto;display:block;background:#87bfe3;touch-action:none}.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.bar{height:10px;background:#293743;border-radius:999px;overflow:hidden}.fill{height:100%}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}.controls button{min-height:52px;border:1px solid #46596a;border-radius:12px;background:#2b3946;color:white;font-weight:800}.jump{background:#3769a8!important}.nit{background:#9a6328!important}.msg{text-align:center;padding:8px;font-weight:800;font-size:13px}.stage{position:relative}.call{position:absolute;left:50%;top:72px;transform:translateX(-50%);font-weight:1000;font-size:clamp(20px,4vw,40px);text-shadow:0 3px 10px #000;pointer-events:none;opacity:0;transition:opacity .16s;text-align:center;white-space:nowrap}@media(max-width:700px){.bars{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="w"><div class="c">
<div class="hud"><span class="p">Score <b id="score">0</b></span><span class="p">Cargo <b id="cargo">5</b>/5</span><span class="p">Speed <b id="speed">0</b></span><span class="p">Combo <b id="combo">x1</b></span><span class="p">Section <b id="section">OPEN ROAD</b></span></div>
<div class="stage"><canvas id="g" width="1000" height="560"></canvas><div id="call" class="call"></div></div>
<div class="bars"><div><small>NITRO</small><div class="bar"><div id="nb" class="fill" style="background:#f39b38;width:45%"></div></div></div><div><small>STORM</small><div class="bar"><div id="sb" class="fill" style="background:#8057c7;width:10%"></div></div></div><div><small>DAMAGE</small><div class="bar"><div id="db" class="fill" style="background:#d85848;width:0%"></div></div></div></div>
<div class="controls"><button id="br">◀ BRAKE</button><button id="ju" class="jump">⬆ JUMP</button><button id="ga">GAS ▶</button><button id="ni" class="nit">⚡ NITRO</button></div>
<div class="msg" id="msg">Drive smart. Some sections reward speed; others punish it.</div>
</div></div>
<script>
(()=>{
const c=document.getElementById('g'),ctx=c.getContext('2d'),W=c.width,H=c.height,$=i=>document.getElementById(i),K={g:0,b:0};
const msg=$('msg'),call=$('call');
const cargo=[-34,-16,4,23,39].map((o,i)=>({o,a:1,y:0,vy:0}));
const pts=[[0,390],[700,390],[1050,370],[1450,395],[1850,350],[2300,390],[2700,360],[3100,390],[3500,350],[3900,390],[4300,390],[5000,390],[5350,350],[5600,390],[6200,390],[6500,360],[7100,360],[7550,390],[8050,375],[8500,390],[9000,360],[9450,390],[9800,340],[10120,250],[10340,125],[11040,220],[11450,390],[12200,390]];
const tinyGaps=[[6740,6810],[7030,7110]],bigGap=[[10340,11040]];
const mud=[[2500,3150]],rough=[[1650,2250],[7300,7850]],wind=[[8050,9300]],boosts=[[9600,10320]];
const sections=[
{x:0,n:'OPEN ROAD'},{x:1500,n:'CARGO RATTLE'},{x:2450,n:'MUD RUN'},{x:3350,n:'CONSTRUCTION GAUNTLET'},{x:5200,n:'LOOP'},{x:6350,n:'BROKEN BRIDGE'},{x:7900,n:'STORM SPRINT'},{x:9500,n:'FINAL LAUNCH'}];
const loop={cx:5750,cy:278,r:168,start:5400,end:6100,active:false,theta:0,done:false};
const obs=[
{x:3420,t:'barrels',breakable:1},{x:3650,t:'barrels',breakable:1},{x:3920,t:'gate'},{x:4250,t:'crusher'},{x:4550,t:'barrels',breakable:1},{x:4820,t:'gate'},
{x:7480,t:'pothole'},{x:7700,t:'pothole'},{x:8300,t:'debris',move:1},{x:8650,t:'debris',move:1},{x:9050,t:'debris',move:1},{x:9350,t:'barrels',breakable:1}
];
const gates=[{x:3260,used:false},{x:9400,used:false}];
let last=performance.now(),cam=0,flash=0,sectionName='OPEN ROAD',windClock=0;
const R={x:120,y:350,vx:0,vy:0,a:0,on:1,jb:0,co:.18,n:45,s:10,d:0,sc:0,combo:1,finish:0};
function anyRange(q,arr){return arr.some(z=>q>z[0]&&q<z[1])}
function inGap(q){return anyRange(q,tinyGaps)||anyRange(q,bigGap)}
function ground(q){if(inGap(q))return null;let i=0;while(i<pts.length-2&&q>pts[i+1][0])i++;const a=pts[i],b=pts[i+1];let t=Math.max(0,Math.min(1,(q-a[0])/(b[0]-a[0])));t=t*t*(3-2*t);return a[1]+(b[1]-a[1])*t}
function slope(q){const a=ground(q-8),b=ground(q+8);return a==null||b==null?0:(b-a)/16}
function currentSection(){let s=sections[0];for(const z of sections)if(R.x>=z.x)s=z;return s.n}
function callout(t){call.textContent=t;call.style.opacity=1;flash=.9}
function jump(){R.jb=.22}
function nit(){if(R.n<7||loop.active)return;R.n-=7;R.vx=Math.min(900,R.vx+180);R.sc+=40;msg.textContent='NITRO!'}
function lose(force=.7){const a=cargo.filter(i=>i.a);if(!a.length||Math.random()>.46*force)return;const it=a[Math.floor(Math.random()*a.length)];it.a=0;it.y=R.y-50;it.vy=-190;R.sc=Math.max(0,R.sc-80);msg.textContent='Cargo flew off!'}
function hit(text,amt=8){R.d=Math.min(100,R.d+amt);R.vx*=.58;R.vy=-80;R.s=Math.min(100,R.s+5);R.combo=1;lose(.85);msg.textContent=text}
function enterLoop(){loop.active=true;loop.theta=0;R.vx=Math.max(540,R.vx);R.on=0;callout('FULL RV LOOP');msg.textContent='Stay on the gas through the loop.'}
function updateLoop(dt){const speed=Math.max(560,R.vx);loop.theta+=speed/loop.r*dt;R.x=loop.cx+loop.r*Math.sin(loop.theta);R.y=loop.cy+loop.r*Math.cos(loop.theta)-38;R.a=loop.theta;R.vx=Math.min(880,R.vx+K.g*120*dt);R.sc+=90*dt*R.combo;if(loop.theta>=Math.PI*2){loop.active=false;loop.done=true;R.x=loop.cx+110;R.y=ground(R.x)-38;R.vx=Math.max(610,R.vx);R.vy=0;R.a=0;R.on=1;R.sc+=700*R.combo;R.combo=Math.min(6,R.combo+.8);callout('LOOP CLEARED');msg.textContent='Loop cleared. Back to road driving.'}}
function obstacleY(o){const gy=ground(o.x)||390;if(o.t==='gate')return gy-75-Math.sin(performance.now()/430+o.x)*48;if(o.t==='crusher')return gy-80-Math.sin(performance.now()/520)*82;if(o.t==='debris')return gy-34+Math.sin(performance.now()/320+o.x)*18;return gy-30}
function obstacleHit(o){if(o.dead)return false;const oy=obstacleY(o);return Math.abs(R.x-o.x)<55&&Math.abs(R.y-oy)<62}
function reset(){Object.assign(R,{x:120,y:350,vx:0,vy:0,a:0,on:1,jb:0,co:.18,n:45,s:10,d:0,sc:0,combo:1,finish:0});obs.forEach(o=>o.dead=0);cargo.forEach(i=>{i.a=1;i.vy=0});gates.forEach(g=>g.used=false);loop.active=false;loop.theta=0;loop.done=false;cam=0;sectionName='OPEN ROAD'}
function upd(dt){
 if(R.finish)return;
 if(flash>0){flash-=dt;if(flash<=0)call.style.opacity=0}
 const newSection=currentSection();if(newSection!==sectionName){sectionName=newSection;callout(sectionName);msg.textContent=sectionName==='MUD RUN'?'Momentum matters here. Save nitro or get bogged down.':sectionName==='CONSTRUCTION GAUNTLET'?'Now timing matters. Brake, jump, or smash through.':sectionName==='BROKEN BRIDGE'?'Short gaps and rough boards: precision, not raw speed.':sectionName==='STORM SPRINT'?'Wind and debris are coming. Keep the RV under control.':sectionName==='FINAL LAUNCH'?'One big jump. Build speed now.':'Keep moving.'}
 if(loop.active){updateLoop(dt);hud();cam+=(loop.cx-430-cam)*Math.min(1,dt*5);return}
 R.jb=Math.max(0,R.jb-dt);if(R.on)R.co=.18;else R.co=Math.max(0,R.co-dt);
 if(R.jb>0&&(R.on||R.co>0)){R.vy=-(570+Math.min(110,R.vx*.12));R.vx+=20;R.on=0;R.jb=0}
 const wasOn=R.on,oldX=R.x,oldSlope=slope(R.x);
 if(R.on){
   if(K.g)R.vx+=880*dt;if(K.b)R.vx-=1020*dt;
   if(anyRange(R.x,mud)){R.vx*=Math.pow(.976,dt*60);if(K.g)R.vx+=250*dt}
   else R.vx*=Math.pow(.996,dt*60);
   if(anyRange(R.x,rough)){R.vx*=Math.pow(.989,dt*60);if(Math.random()<dt*.85&&R.vx>420)lose(.32)}
 }else{if(K.g)R.vx+=55*dt;R.vy+=1120*dt}
 if(anyRange(R.x,wind)){windClock+=dt*5;R.vx+=Math.sin(windClock)*90*dt;if(!R.on)R.vy+=Math.sin(windClock*1.7)*80*dt}
 if(anyRange(R.x,boosts)){R.vx+=1250*dt;R.n=Math.min(100,R.n+10*dt)}
 R.vx=Math.max(-90,Math.min(900,R.vx));R.x+=R.vx*dt;R.y+=R.vy*dt;
 let gy=ground(R.x);
 if(wasOn&&gy==null&&ground(oldX)!=null){R.on=0;const isBig=anyRange(R.x,bigGap);R.vy=Math.min(R.vy,-(isBig?Math.max(400,180+R.vx*.55):220));if(isBig){R.sc+=150*R.combo;callout('FINAL MEGA JUMP')}else{R.sc+=35*R.combo}}
 else if(gy!=null&&R.y+38>=gy){const hard=R.vy>600;R.y=gy-38;R.vy=0;R.on=1;R.a*=.55;if(hard){R.d=Math.min(100,R.d+4);lose(.5)}else if(Math.abs(R.vx)>330){R.sc+=24*R.combo;R.combo=Math.min(6,R.combo+.12)}}else R.on=0;
 if(!loop.done&&R.x>loop.start&&R.x<loop.cx+20&&R.on&&R.vx>250)enterLoop();
 for(const g of gates){if(!g.used&&R.x>g.x){g.used=true;R.n=Math.min(100,R.n+25);R.d=Math.max(0,R.d-8);callout('SERVICE GATE');msg.textContent='Quick service: a little repair and nitro. No stopping.'}}
 for(const o of obs){if(o.dead||!obstacleHit(o))continue;
   if(o.breakable&&R.vx>360){o.dead=1;R.sc+=180*R.combo;R.combo=Math.min(6,R.combo+.35);callout('SMASH')}else if(o.t==='pothole'){o.dead=1;R.vy=-180;R.vx*=.82;R.d=Math.min(100,R.d+4);lose(.45);msg.textContent='Pothole! Small jump would have cleared it.'}else hit(o.t==='crusher'?'CRUSHER HIT — time the opening!':o.t==='gate'?'GATE HIT — brake or time it!':'DEBRIS HIT — storm is getting rough!')
 }
 for(const it of cargo)if(!it.a){it.vy+=900*dt;it.y+=it.vy*dt}
 let stormRate=2.0+Math.max(0,(310-R.vx)/105);if(anyRange(R.x,wind))stormRate+=2.2;R.s+=dt*stormRate;if(R.vx>520)R.s-=dt*3.2;R.s=Math.max(0,Math.min(100,R.s));
 if(R.s>=100){R.s=70;hit('The storm caught the RV — big setback!',10)}
 if(R.d>=100){R.d=65;R.vx*=.5;lose(1.2);msg.textContent='The RV barely holds together. Keep going.'}
 if(R.y>690){R.x=Math.max(120,R.x-170);while(inGap(R.x))R.x-=60;R.y=(ground(R.x)||390)-95;R.vx=220;R.vy=-60;R.d=Math.min(100,R.d+6);R.s=Math.min(100,R.s+6);msg.textContent='Recovered. No game over — keep moving.'}
 if(R.x>11950){R.finish=1;R.sc+=cargo.filter(i=>i.a).length*500+(100-R.d)*10;callout('CAMPGROUND ESCAPE');msg.textContent='Run complete! Score '+Math.round(R.sc)}
 cam+=(Math.max(0,R.x-(245-Math.min(65,R.vx/13)))-cam)*Math.min(1,dt*5);hud()
}
function hud(){$('score').textContent=Math.round(R.sc);$('cargo').textContent=cargo.filter(i=>i.a).length;$('speed').textContent=Math.round(Math.abs(R.vx));$('combo').textContent='x'+R.combo.toFixed(1);$('section').textContent=sectionName;$('nb').style.width=R.n+'%';$('sb').style.width=R.s+'%';$('db').style.width=R.d+'%'}
function drawLoop(){const sx=loop.cx-cam,sy=loop.cy;ctx.save();ctx.strokeStyle='#252b31';ctx.lineWidth=28;ctx.beginPath();ctx.arc(sx,sy,loop.r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#f0b14d';ctx.lineWidth=7;ctx.setLineDash([20,15]);ctx.beginPath();ctx.arc(sx,sy,loop.r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='900 18px system-ui';ctx.textAlign='center';ctx.fillText('RV LOOP',sx,sy+6);ctx.restore()}
function drawRV(){ctx.save();ctx.translate(R.x-cam,R.y);if(loop.active)ctx.rotate(-loop.theta);else ctx.rotate(Math.max(-.22,Math.min(.22,slope(R.x)*.45)));ctx.fillStyle='#f1eee7';ctx.strokeStyle='#202a31';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-60,-34,118,55,9);ctx.fill();ctx.stroke();ctx.fillStyle='#d56f3e';ctx.fillRect(-60,-3,118,13);ctx.fillStyle='#9fd1dd';ctx.fillRect(-48,-27,31,18);ctx.fillRect(-7,-27,27,18);ctx.fillStyle='#1e252a';ctx.beginPath();ctx.arc(-40,24,17,0,Math.PI*2);ctx.arc(39,24,17,0,Math.PI*2);ctx.fill();for(let i=0;i<cargo.length;i++)if(cargo[i].a){ctx.fillStyle=['#4baac7','#d17450','#e0b94a','#65ad76','#db8b3c'][i];ctx.fillRect(-38+i*18,-52-(i%2)*7,14,10)}ctx.restore()}
function drawTerrain(){ctx.fillStyle='#718b66';ctx.beginPath();ctx.moveTo(0,H);for(let q=0;q<=W;q+=7){const y=ground(q+cam);ctx.lineTo(q,y==null?H:y)}ctx.lineTo(W,H);ctx.fill();ctx.strokeStyle='#293c2d';ctx.lineWidth=7;ctx.beginPath();let open=0;for(let q=0;q<=W;q+=7){const y=ground(q+cam);if(y==null){open=0;continue}if(!open){ctx.moveTo(q,y);open=1}else ctx.lineTo(q,y)}ctx.stroke()}
function zoneRect(arr,color,label){ctx.save();ctx.fillStyle=color;ctx.font='800 12px system-ui';for(const z of arr){const a=z[0]-cam,b=z[1]-cam;if(b<0||a>W)continue;const y=ground((z[0]+z[1])/2)||390;ctx.fillRect(a,y-8,z[1]-z[0],10);ctx.fillText(label,a+12,y-18)}ctx.restore()}
function drawObs(){for(const o of obs){if(o.dead)continue;const gy=ground(o.x);if(gy==null)continue;const s=o.x-cam,oy=obstacleY(o);if(o.t==='barrels'){ctx.fillStyle='#a85d34';ctx.fillRect(s-24,gy-40,22,40);ctx.fillRect(s+4,gy-40,22,40)}else if(o.t==='pothole'){ctx.fillStyle='#24292d';ctx.beginPath();ctx.ellipse(s,gy-3,32,10,0,0,Math.PI*2);ctx.fill()}else if(o.t==='gate'){ctx.fillStyle='#d7a33f';ctx.fillRect(s-9,oy-45,18,90);ctx.fillStyle='#31373d';ctx.fillRect(s-42,oy-9,84,18)}else if(o.t==='crusher'){ctx.fillStyle='#555d64';ctx.fillRect(s-42,oy-52,84,65);ctx.fillStyle='#a8b0b5';ctx.fillRect(s-50,oy+13,100,14)}else if(o.t==='debris'){ctx.fillStyle='#7d654e';ctx.beginPath();ctx.arc(s,oy,23,0,Math.PI*2);ctx.fill()}}
}
function draw(){const st=R.s/100,gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,`rgb(${120-55*st},${190-80*st},${225-70*st})`);gr.addColorStop(1,'#dce5d7');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);drawTerrain();zoneRect(mud,'#72583c','MUD');zoneRect(rough,'#95744d','ROUGH ROAD');zoneRect(boosts,'#e89531','BOOST');drawLoop();drawObs();for(const g of gates){const y=ground(g.x);if(y==null)continue;ctx.strokeStyle=g.used?'#708070':'#65e3ff';ctx.lineWidth=5;ctx.strokeRect(g.x-cam-20,y-100,40,100)}for(let t=500;t<12200;t+=780){if(Math.abs(t-loop.cx)<600)continue;const y=ground(t);if(y==null)continue;ctx.fillStyle='#31563b';ctx.beginPath();ctx.moveTo(t-cam,y-95);ctx.lineTo(t-cam-30,y-20);ctx.lineTo(t-cam+30,y-20);ctx.fill();ctx.fillStyle='#674a34';ctx.fillRect(t-cam-5,y-20,10,20)}for(const it of cargo)if(!it.a){ctx.fillStyle='#f0a44c';ctx.fillRect(R.x+it.o-cam,it.y,12,10)}drawRV();const edge=Math.min(720,70+R.s*6.4),sg=ctx.createLinearGradient(0,0,edge,0);sg.addColorStop(0,'rgba(45,39,71,.94)');sg.addColorStop(1,'rgba(80,59,110,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,edge,H);if(anyRange(R.x,wind)){ctx.strokeStyle='rgba(255,255,255,.24)';ctx.lineWidth=3;for(let i=0;i<12;i++){const yy=(i*53+performance.now()/8)%H;ctx.beginPath();ctx.moveTo(80+(i%3)*100,yy);ctx.lineTo(180+(i%3)*100,yy-25);ctx.stroke()}}if(R.finish){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 42px system-ui';ctx.fillText('CAMPGROUND ESCAPE!',W/2,230);ctx.font='700 18px system-ui';ctx.fillText('Score '+Math.round(R.sc)+' • Cargo '+cargo.filter(i=>i.a).length+'/5',W/2,265);ctx.textAlign='start'}}
function loopFrame(n){const dt=Math.min(.033,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loopFrame)}
function hold(id,k){const b=$(id),on=e=>{e.preventDefault();K[k]=1},off=e=>{e.preventDefault();K[k]=0};b.onpointerdown=on;b.onpointerup=off;b.onpointercancel=off;b.onpointerleave=off}
hold('ga','g');hold('br','b');$('ju').onpointerdown=e=>{e.preventDefault();jump()};$('ni').onpointerdown=e=>{e.preventDefault();nit()};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='d'||k==='arrowright')K.g=1;if(k==='a'||k==='arrowleft')K.b=1;if(k===' ')jump();if(k==='shift')nit()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='d'||k==='arrowright')K.g=0;if(k==='a'||k==='arrowleft')K.b=0});reset();requestAnimationFrame(loopFrame)
})();
</script>
</body>
</html>
