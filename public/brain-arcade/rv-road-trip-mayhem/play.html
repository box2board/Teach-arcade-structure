<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RV Road Trip Mayhem</title><style>*{box-sizing:border-box}body{margin:0;background:#0c131a;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.w{width:min(1100px,100%);padding:8px}.c{background:#15202b;border:1px solid #334454;border-radius:16px;overflow:hidden}.hud{display:flex;gap:8px;flex-wrap:wrap;padding:8px;background:#101820}.p{background:#24313d;border-radius:999px;padding:6px 10px;font-size:12px}canvas{width:100%;height:auto;display:block;background:#87bfe3;touch-action:none}.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.bar{height:10px;background:#293743;border-radius:999px;overflow:hidden}.fill{height:100%}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}.controls button,.choice button{min-height:52px;border:1px solid #46596a;border-radius:12px;background:#2b3946;color:white;font-weight:800}.jump{background:#3769a8!important}.nit{background:#9a6328!important}.msg{text-align:center;padding:8px;font-weight:700;font-size:13px}.overlay{position:fixed;inset:0;background:#081018dd;display:none;place-items:center;padding:18px}.choice{max-width:720px;background:#17232d;border:1px solid #405466;border-radius:16px;padding:16px}.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice button{padding:12px;text-align:left}@media(max-width:700px){.bars{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.choicegrid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="c"><div class="hud"><span class="p">Score <b id="score">0</b></span><span class="p">Cargo <b id="cargo">5</b>/5</span><span class="p">Speed <b id="speed">0</b></span><span class="p">Combo <b id="combo">x1</b></span></div><canvas id="g" width="1000" height="520"></canvas><div class="bars"><div><small>NITRO</small><div class="bar"><div id="nb" class="fill" style="background:#f39b38;width:35%"></div></div></div><div><small>STORM</small><div class="bar"><div id="sb" class="fill" style="background:#8057c7;width:16%"></div></div></div><div><small>DAMAGE</small><div class="bar"><div id="db" class="fill" style="background:#d85848;width:0%"></div></div></div></div><div class="controls"><button id="br">◀ BRAKE</button><button id="ju" class="jump">⬆ JUMP</button><button id="ga">GAS ▶</button><button id="ni" class="nit">⚡ NITRO</button></div><div class="msg" id="msg">Outrun the storm. Keep the cargo. Smash through trouble.</div></div></div><div class="overlay" id="ov"><div class="choice"><h2>Roadside Rescue</h2><p>Choose one before the storm catches up.</p><div class="choicegrid"><button data-c="repair"><b>🔧 Patch RV</b><br>Remove 35 damage.</button><button data-c="cargo"><b>🧳 Strap Cargo</b><br>Recover one item and reduce cargo loss.</button><button data-c="nitro"><b>⚡ Nitro Overfill</b><br>Full tank + stronger boost.</button></div></div></div><script>(()=>{const c=document.getElementById('g'),x=c.getContext('2d'),W=c.width,H=c.height,$=i=>document.getElementById(i),K={g:0,b:0},obs=[{x:1550,t:'table'},{x:2200,t:'barrels'},{x:3150,t:'hay',move:1},{x:4300,t:'fence'},{x:7350,t:'sign'},{x:9300,t:'crates'}],cargo=[-34,-16,4,23,39].map((o,i)=>({o,a:1,y:0,vy:0})),gaps=[[1250,1500],[3900,4250],[8200,8620],[10100,10600]],boosts=[[760,940],[3650,3840],[7800,8000],[9700,9920]],pts=[[0,375],[650,375],[1000,300],[1200,235],[1550,375],[2500,350],[3300,380],[3900,340],[4400,370],[5200,360],[6100,355],[7000,370],[7800,330],[8150,250],[8700,370],[9500,345],[9900,260],[10100,220],[10700,375],[11500,320]];let paused=0,choice=0,last=performance.now(),cam=0;const R={x:120,y:300,vx:0,vy:0,a:0,on:1,jb:0,co:.16,n:35,s:16,d:0,sc:0,combo:1,arm:0,np:1,finish:0};function gap(q){return gaps.some(z=>q>z[0]&&q<z[1])}function ground(q){if(gap(q))return null;let i=0;while(i<pts.length-2&&q>pts[i+1][0])i++;let a=pts[i],b=pts[i+1],t=Math.max(0,Math.min(1,(q-a[0])/(b[0]-a[0])));t=t*t*(3-2*t);return a[1]+(b[1]-a[1])*t}function boost(q){return boosts.some(z=>q>z[0]&&q<z[1])}function jump(){R.jb=.2}function nit(){if(R.n<7)return;R.n-=7;R.vx=Math.min(900,R.vx+170*R.np);R.sc+=40;msg.textContent='NITRO!'}function lose(force=.7){let a=cargo.filter(i=>i.a);if(!a.length||Math.random()>.55*force*(1-R.arm*.55))return;let it=a[Math.floor(Math.random()*a.length)];it.a=0;it.y=R.y-50;it.vy=-180;R.sc=Math.max(0,R.sc-80);msg.textContent='Cargo flew off!'}function hit(text){R.d=Math.min(100,R.d+9);R.vx*=.55;R.vy=-90;R.s=Math.min(100,R.s+7);R.combo=1;lose(1);msg.textContent=text+' — keep moving!'}function reset(){Object.assign(R,{x:120,y:300,vx:0,vy:0,a:0,on:1,jb:0,co:.16,n:35,s:16,d:0,sc:0,combo:1,arm:0,np:1,finish:0});obs.forEach(o=>o.dead=0);cargo.forEach(i=>{i.a=1;i.vy=0});cam=0;choice=0;ov.style.display='none';paused=0}function upd(dt){if(paused||R.finish)return;R.jb=Math.max(0,R.jb-dt);if(R.on)R.co=.16;else R.co=Math.max(0,R.co-dt);if(R.jb>0&&(R.on||R.co>0)){R.vy=-(600+Math.min(110,R.vx*.15));R.vx+=22;R.on=0;R.jb=0}let gy=ground(R.x);if(R.on){if(K.g)R.vx+=860*dt;if(K.b)R.vx-=900*dt;if(boost(R.x)){R.vx+=1200*dt;R.n=Math.min(100,R.n+12*dt)}R.vx*=Math.pow(.996,dt*60)}else{if(K.g)R.vx+=60*dt;R.vy+=1120*dt}R.vx=Math.max(-90,Math.min(850,R.vx));R.x+=R.vx*dt;R.y+=R.vy*dt;gy=ground(R.x);if(gy!=null&&R.y+38>=gy){let hard=R.vy>520;R.y=gy-38;R.vy=0;R.on=1;if(hard){R.d=Math.min(100,R.d+5);lose(.8)}else if(Math.abs(R.vx)>350){R.sc+=30*R.combo;R.combo=Math.min(6,R.combo+.2)}}else R.on=0;for(const o of obs){if(o.move&&!o.dead)o.x+=Math.sin(performance.now()/600)*.5;if(!o.dead&&Math.abs(R.x-o.x)<52&&gy!=null&&Math.abs(R.y-(ground(o.x)-35))<70){if(R.vx>300||!R.on){o.dead=1;R.sc+=180*R.combo;R.combo=Math.min(6,R.combo+.5);msg.textContent='SMASH! +'+Math.round(180*R.combo)}else hit('Obstacle hit')}}for(const it of cargo){if(!it.a){it.vy+=900*dt;it.y+=it.vy*dt}}R.s+=dt*(2.4+Math.max(0,(320-R.vx)/85));if(R.vx>500)R.s-=dt*3;R.s=Math.max(0,Math.min(100,R.s));if(R.s>=100){R.s=72;hit('The storm slammed the RV')}if(R.d>=100){R.d=68;R.vx*=.4;lose(1.4)}if(R.y>650){R.x=Math.max(120,R.x-250);R.y=(ground(R.x)||370)-80;R.vx=140;R.vy=-70;R.d=Math.min(100,R.d+8);R.s=Math.min(100,R.s+10)}if(!choice&&R.x>5050){choice=1;paused=1;ov.style.display='grid'}if(R.x>11200){R.finish=1;R.sc+=cargo.filter(i=>i.a).length*500+(100-R.d)*10;msg.textContent='CAMPGROUND ESCAPE! Score '+Math.round(R.sc)}cam+=(Math.max(0,R.x-(220-Math.min(60,R.vx/12)))-cam)*Math.min(1,dt*5);$('score').textContent=Math.round(R.sc);$('cargo').textContent=cargo.filter(i=>i.a).length;$('speed').textContent=Math.round(Math.abs(R.vx));$('combo').textContent='x'+R.combo.toFixed(1);$('nb').style.width=R.n+'%';$('sb').style.width=R.s+'%';$('db').style.width=R.d+'%'}function draw(){let st=R.s/100,gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,`rgb(${120-55*st},${190-80*st},${225-70*st})`);gr.addColorStop(1,'#dce5d7');x.fillStyle=gr;x.fillRect(0,0,W,H);x.fillStyle='#819573';x.beginPath();x.moveTo(0,H);for(let q=0;q<=W;q+=8){let y=ground(q+cam);if(y==null){x.lineTo(q,H)}else x.lineTo(q,y)}x.lineTo(W,H);x.fill();x.strokeStyle='#324633';x.lineWidth=6;x.beginPath();let open=0;for(let q=0;q<=W;q+=8){let y=ground(q+cam);if(y==null){open=0;continue}if(!open){x.moveTo(q,y);open=1}else x.lineTo(q,y)}x.stroke();for(const b of boosts){let y=ground((b[0]+b[1])/2)||360;x.fillStyle='#d98a32';x.fillRect(b[0]-cam,y-10,b[1]-b[0],12)}for(let t=350;t<11200;t+=420){let y=ground(t);if(y==null)continue;x.fillStyle='#3f5c43';x.beginPath();x.moveTo(t-cam,y-95);x.lineTo(t-cam-30,y-20);x.lineTo(t-cam+30,y-20);x.fill();x.fillStyle='#654a35';x.fillRect(t-cam-4,y-20,8,20)}for(const o of obs){if(o.dead)continue;let y=ground(o.x)||360,s=o.x-cam;x.fillStyle=o.t==='hay'?'#d4ad55':'#8b623e';if(o.t==='hay'){x.beginPath();x.arc(s,y-28,28,0,Math.PI*2);x.fill()}else x.fillRect(s-28,y-45,56,45)}for(const it of cargo){if(it.a)continue;x.fillStyle='#f0a44c';x.fillRect(R.x+it.o-cam,it.y,12,10)}x.save();x.translate(R.x-cam,R.y);x.fillStyle='#f1eee7';x.strokeStyle='#202a31';x.lineWidth=3;x.beginPath();x.roundRect(-60,-34,118,55,9);x.fill();x.stroke();x.fillStyle='#d56f3e';x.fillRect(-60,-3,118,13);x.fillStyle='#9fd1dd';x.fillRect(-48,-27,31,18);x.fillRect(-7,-27,27,18);x.fillStyle='#1e252a';x.beginPath();x.arc(-40,24,17,0,Math.PI*2);x.arc(39,24,17,0,Math.PI*2);x.fill();for(let i=0;i<cargo.length;i++)if(cargo[i].a){x.fillStyle=['#4baac7','#d17450','#e0b94a','#65ad76','#db8b3c'][i];x.fillRect(-38+i*18,-52-(i%2)*7,14,10)}x.restore();let edge=Math.min(710,80+R.s*6.3),sg=x.createLinearGradient(0,0,edge,0);sg.addColorStop(0,'rgba(45,39,71,.94)');sg.addColorStop(1,'rgba(80,59,110,0)');x.fillStyle=sg;x.fillRect(0,0,edge,H);if(R.finish){x.fillStyle='#0009';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='900 42px system-ui';x.fillText('CAMPGROUND ESCAPE!',W/2,230);x.font='700 18px system-ui';x.fillText('Score '+Math.round(R.sc)+' • Cargo '+cargo.filter(i=>i.a).length+'/5',W/2,265);x.textAlign='start'}}function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)}function hold(id,k){let b=$(id),on=e=>{e.preventDefault();K[k]=1},off=e=>{e.preventDefault();K[k]=0};b.onpointerdown=on;b.onpointerup=off;b.onpointercancel=off;b.onpointerleave=off}hold('ga','g');hold('br','b');$('ju').onpointerdown=e=>{e.preventDefault();jump()};$('ni').onpointerdown=e=>{e.preventDefault();nit()};document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{let z=b.dataset.c;if(z==='repair')R.d=Math.max(0,R.d-35);if(z==='cargo'){let it=cargo.find(i=>!i.a);if(it)it.a=1;R.arm=1}if(z==='nitro'){R.n=100;R.np=1.35}paused=0;ov.style.display='none';msg.textContent='Back on the road!'});addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='d'||k==='arrowright')K.g=1;if(k==='a'||k==='arrowleft')K.b=1;if(k===' ')jump();if(k==='shift')nit()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='d'||k==='arrowright')K.g=0;if(k==='a'||k==='arrowleft')K.b=0});reset();requestAnimationFrame(loop)})();</script></body></html>
