<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RV Rolling Hills</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1218;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}body{display:grid;place-items:center;min-height:100vh}.wrap{width:min(1120px,100%);padding:8px}.shell{background:#111b23;border:1px solid #304552;border-radius:18px;overflow:hidden;box-shadow:0 18px 55px #0008}.top{display:flex;gap:8px;flex-wrap:wrap;padding:8px;background:#0c151b}.pill{background:#21303b;border:1px solid #314653;border-radius:999px;padding:6px 10px;font-size:12px}.stage{position:relative}.call{position:absolute;left:50%;top:64px;transform:translateX(-50%);font-weight:1000;font-size:clamp(22px,4vw,44px);text-shadow:0 4px 12px #000;opacity:0;pointer-events:none;transition:.12s;white-space:nowrap}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#101a22}.barWrap small{display:block;font-size:10px;font-weight:900;letter-spacing:.08em;color:#c3d2dc;margin-bottom:4px}.bar{height:10px;background:#263742;border-radius:999px;overflow:hidden}.fill{height:100%}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;background:#101a22}.controls button{min-height:54px;border:1px solid #405764;border-radius:12px;background:#2a3a45;color:white;font-weight:1000;touch-action:none}.jump{background:#376a9f!important}.nitro{background:#9b6328!important}.msg{padding:8px;text-align:center;font-size:12px;font-weight:800;background:#0c151b;border-top:1px solid #263844}canvas{display:block;width:100%;height:auto;touch-action:none}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.bars{grid-template-columns:1fr 1fr}.pill{font-size:11px}}
</style></head>
<body><div class="wrap"><div class="shell">
<div class="top"><span class="pill">Distance <b id="distance">0</b>m</span><span class="pill">Speed <b id="speed">0</b></span><span class="pill">Junk Cleared <b id="cleared">0</b></span><span class="pill">Best Air <b id="air">0.0</b>s</span></div>
<div class="stage"><canvas id="game" width="1000" height="560"></canvas><div id="call" class="call"></div></div>
<div class="bars"><div class="barWrap"><small>NITRO</small><div class="bar"><div id="nitroBar" class="fill" style="background:#f19a3b;width:55%"></div></div></div><div class="barWrap"><small>RV CONDITION</small><div class="bar"><div id="healthBar" class="fill" style="background:#56bd7d;width:100%"></div></div></div></div>
<div class="controls"><button id="brake">◀ BRAKE</button><button id="jump" class="jump">⬆ JUMP</button><button id="gas">GAS ▶</button><button id="nitro" class="nitro">⚡ NITRO</button></div>
<div class="msg" id="msg">Build speed on the hills. Jump the junk. Keep the RV moving.</div>
</div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,$=id=>document.getElementById(id);
const ui={distance:$('distance'),speed:$('speed'),cleared:$('cleared'),air:$('air'),nitro:$('nitroBar'),health:$('healthBar'),msg:$('msg'),call:$('call')};
const K={gas:0,brake:0};
const WORLD=15000;
const ramps=[{x:1900,w:240,h:90},{x:4300,w:190,h:70},{x:6900,w:260,h:105},{x:10100,w:210,h:80},{x:13200,w:300,h:125}];
const obstacles=[
 {x:900,t:'cart'},{x:1300,t:'tire'},{x:1650,t:'cones'},{x:2450,t:'car'},{x:2820,t:'junk'},{x:3300,t:'tire'},{x:3650,t:'cart'},
 {x:4700,t:'barrier'},{x:5020,t:'junk'},{x:5350,t:'car'},{x:5800,t:'tire'},{x:6220,t:'cones'},
 {x:7400,t:'cart'},{x:7750,t:'car'},{x:8150,t:'tire'},{x:8450,t:'junk'},{x:8850,t:'barrier'},{x:9300,t:'tire'},
 {x:10600,t:'car'},{x:11050,t:'cones'},{x:11420,t:'cart'},{x:11850,t:'junk'},{x:12300,t:'tire'},{x:12680,t:'barrier'},
 {x:13750,t:'car'},{x:14100,t:'cart'},{x:14400,t:'tire'}
];
const signs=[{x:1750,text:'RAMP'},{x:4150,text:'SHORT RAMP'},{x:6700,text:'BIG RAMP'},{x:9900,text:'RAMP'},{x:12950,text:'FINAL HILL'}];
const R={x:120,y:0,vx:0,vy:0,on:1,jb:0,coyote:.15,nitro:55,health:100,inv:0,air:0,bestAir:0,cleared:0,finish:0};
let cam=0,last=performance.now(),callT=0;
function hill(x){return 392 + Math.sin(x/410)*55 + Math.sin(x/1250)*30 + Math.sin(x/180)*8;}
function rampLift(x){let lift=0;for(const r of ramps){if(x>=r.x&&x<=r.x+r.w){const t=(x-r.x)/r.w;lift-=Math.sin(t*Math.PI)*r.h;}}return lift;}
function ground(x){return hill(x)+rampLift(x);}
function slope(x){return (ground(x+8)-ground(x-8))/16;}
function popup(t){ui.call.textContent=t;ui.call.style.opacity=1;callT=.7;}
function jump(){R.jb=.18;}
function useNitro(){if(R.nitro<10)return;R.nitro-=10;R.vx=Math.min(900,R.vx+145);popup('NITRO');}
function damage(n,text){if(R.inv>0)return;R.health=Math.max(0,R.health-n);R.vx*=.56;R.vy=-95;R.inv=.65;ui.msg.textContent=text;if(R.health<=0){R.health=55;R.vx=180;R.x=Math.max(120,R.x-240);popup('RV RECOVERY');}}
function obsSize(t){if(t==='car')return [100,50];if(t==='cart')return [48,45];if(t==='tire')return [42,42];if(t==='barrier')return [78,42];if(t==='junk')return [66,38];return [60,30];}
function obsY(o){return ground(o.x);}
function collide(o){if(o.dead||R.inv>0)return false;const [w,h]=obsSize(o.t),oy=obsY(o);return Math.abs(R.x-o.x)<(55+w*.45)&&R.y+30>oy-h&&R.y-35<oy;}
function clearObs(o){if(o.dead)return;o.dead=1;R.cleared++;R.nitro=Math.min(100,R.nitro+3);popup('CLEARED');}
function update(dt){if(R.finish)return;if(callT>0){callT-=dt;if(callT<=0)ui.call.style.opacity=0}R.inv=Math.max(0,R.inv-dt);R.jb=Math.max(0,R.jb-dt);if(R.on)R.coyote=.15;else R.coyote=Math.max(0,R.coyote-dt);
 if(R.jb>0&&(R.on||R.coyote>0)){R.vy=-(500+Math.min(105,R.vx*.12));R.on=0;R.jb=0;R.air=0;}
 const oldX=R.x,wasOn=R.on;
 if(R.on){if(K.gas)R.vx+=760*dt;if(K.brake)R.vx-=980*dt;const sl=slope(R.x);R.vx+=Math.max(-160,Math.min(220,sl*R.vx*.9))*dt;R.vx*=Math.pow(.996,dt*60);} else {if(K.gas)R.vx+=35*dt;R.vy+=1080*dt;R.air+=dt;}
 R.vx=Math.max(-70,Math.min(760,R.vx));R.x+=R.vx*dt;R.y+=R.vy*dt;
 const gy=ground(R.x);
 if(wasOn&&R.y+38<gy-3){R.on=0;R.vy+=40;}
 if(R.y+38>=gy&&R.vy>=0){if(!R.on&&R.air>.25){R.bestAir=Math.max(R.bestAir,R.air);if(R.air>.65){popup(R.air>1.2?'BIG AIR':'AIRTIME');R.nitro=Math.min(100,R.nitro+Math.min(8,R.air*3));}}R.y=gy-38;R.vy=0;R.on=1;R.air=0;}
 for(const o of obstacles){if(o.dead)continue;if(R.x>o.x+120&&!o.dead){o.dead=1;continue}if(collide(o)){if(!R.on&&R.y<obsY(o)-55){clearObs(o);}else if(o.t==='tire'&&R.vx>520){clearObs(o);R.vx*=.88;ui.msg.textContent='Truck tire smashed aside!';}else{damage(o.t==='car'?18:o.t==='barrier'?13:9,(o.t==='car'?'Broken-down car!':o.t==='cart'?'Shopping cart hit!':o.t==='tire'?'Truck tire hit!':o.t==='barrier'?'Barrier hit!':'Roadside junk hit!'));o.dead=1;}}}
 if(R.x>WORLD){R.finish=1;popup('CAMPGROUND');ui.msg.textContent='Run complete — '+R.cleared+' obstacles cleared, best air '+R.bestAir.toFixed(1)+'s.';}
 cam+=(Math.max(0,R.x-245)-cam)*Math.min(1,dt*5);
 ui.distance.textContent=Math.round(R.x/10);ui.speed.textContent=Math.round(Math.abs(R.vx));ui.cleared.textContent=R.cleared;ui.air.textContent=R.bestAir.toFixed(1);ui.nitro.style.width=R.nitro+'%';ui.health.style.width=R.health+'%';}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#78b9dc');g.addColorStop(1,'#e1e7d3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffffaa';for(let i=0;i<5;i++){const x=((i*290-cam*.12)%1300+1300)%1300-100,y=85+(i%2)*55;ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.arc(x+32,y-8,36,0,Math.PI*2);ctx.arc(x+65,y,25,0,Math.PI*2);ctx.fill();}}
function drawTerrain(){ctx.fillStyle='#769c59';ctx.beginPath();ctx.moveTo(0,H);for(let sx=0;sx<=W;sx+=5)ctx.lineTo(sx,ground(sx+cam));ctx.lineTo(W,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#374832';ctx.lineWidth=7;ctx.beginPath();for(let sx=0;sx<=W;sx+=5){const y=ground(sx+cam);sx===0?ctx.moveTo(sx,y):ctx.lineTo(sx,y)}ctx.stroke();ctx.strokeStyle='#bca47a';ctx.lineWidth=3;ctx.setLineDash([18,18]);ctx.beginPath();for(let sx=0;sx<=W;sx+=8){const y=ground(sx+cam)-5;sx===0?ctx.moveTo(sx,y):ctx.lineTo(sx,y)}ctx.stroke();ctx.setLineDash([]);}
function drawSign(s){const x=s.x-cam,y=ground(s.x);if(x<-80||x>W+80)return;ctx.fillStyle='#6a4a31';ctx.fillRect(x-4,y-78,8,78);ctx.fillStyle='#f0c54f';ctx.fillRect(x-42,y-105,84,34);ctx.fillStyle='#1d2830';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText(s.text,x,y-83);}
function drawObstacle(o){if(o.dead)return;const x=o.x-cam,y=obsY(o);if(x<-120||x>W+120)return;ctx.save();if(o.t==='car'){ctx.fillStyle='#9a3e39';ctx.fillRect(x-48,y-40,96,35);ctx.fillStyle='#6ea7c0';ctx.fillRect(x-18,y-61,42,23);ctx.fillStyle='#20262a';ctx.beginPath();ctx.arc(x-30,y-3,14,0,Math.PI*2);ctx.arc(x+30,y-3,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd36b';ctx.fillRect(x-50,y-34,8,8)}else if(o.t==='cart'){ctx.strokeStyle='#6d7377';ctx.lineWidth=4;ctx.strokeRect(x-22,y-42,44,28);ctx.beginPath();ctx.moveTo(x+18,y-42);ctx.lineTo(x+32,y-53);ctx.stroke();ctx.fillStyle='#252b2f';ctx.beginPath();ctx.arc(x-15,y-8,7,0,Math.PI*2);ctx.arc(x+18,y-8,7,0,Math.PI*2);ctx.fill()}else if(o.t==='tire'){ctx.strokeStyle='#202326';ctx.lineWidth=10;ctx.beginPath();ctx.arc(x,y-21,17,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#747b80';ctx.beginPath();ctx.arc(x,y-21,5,0,Math.PI*2);ctx.fill()}else if(o.t==='barrier'){ctx.fillStyle='#d8d8d8';ctx.fillRect(x-38,y-32,76,24);ctx.fillStyle='#e8892f';for(let i=-30;i<35;i+=22)ctx.fillRect(x+i,y-32,11,24)}else if(o.t==='cones'){ctx.fillStyle='#ef7f2d';for(let i=-22;i<=22;i+=22){ctx.beginPath();ctx.moveTo(x+i,y-34);ctx.lineTo(x+i-9,y-7);ctx.lineTo(x+i+9,y-7);ctx.fill()}}else{ctx.fillStyle='#725f4c';ctx.fillRect(x-30,y-28,60,23);ctx.fillStyle='#4a5960';ctx.fillRect(x-10,y-42,25,14);ctx.fillStyle='#bd814b';ctx.fillRect(x+10,y-18,18,12)}ctx.restore();}
function drawRV(){const y=R.y,x=R.x-cam;ctx.save();ctx.translate(x,y);ctx.rotate(Math.max(-.22,Math.min(.22,slope(R.x)*.38)));ctx.fillStyle='#f0eee8';ctx.strokeStyle='#1d272e';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-62,-35,122,57,10);ctx.fill();ctx.stroke();ctx.fillStyle='#d4673c';ctx.fillRect(-62,-2,122,13);ctx.fillStyle='#8fc4da';ctx.fillRect(-49,-28,31,19);ctx.fillRect(-6,-28,28,19);ctx.fillStyle='#20262a';ctx.beginPath();ctx.arc(-41,25,17,0,Math.PI*2);ctx.arc(39,25,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f6c453';ctx.fillRect(51,-18,8,10);ctx.restore();}
function draw(){drawSky();drawTerrain();for(const s of signs)drawSign(s);for(const o of obstacles)drawObstacle(o);drawRV();if(R.finish){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='1000 42px system-ui';ctx.fillText('ROLLING HILLS COMPLETE',W/2,235);ctx.font='800 18px system-ui';ctx.fillText('Obstacles cleared '+R.cleared+' • Best air '+R.bestAir.toFixed(1)+'s',W/2,270);ctx.textAlign='left';}}
function frame(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}
function hold(id,k){const b=$(id),on=e=>{e.preventDefault();K[k]=1},off=e=>{e.preventDefault();K[k]=0};b.onpointerdown=on;b.onpointerup=off;b.onpointercancel=off;b.onpointerleave=off}hold('gas','gas');hold('brake','brake');$('jump').onpointerdown=e=>{e.preventDefault();jump()};$('nitro').onpointerdown=e=>{e.preventDefault();useNitro()};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='d'||k==='arrowright')K.gas=1;if(k==='a'||k==='arrowleft')K.brake=1;if(k===' ')jump();if(k==='shift')useNitro()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='d'||k==='arrowright')K.gas=0;if(k==='a'||k==='arrowleft')K.brake=0});R.y=ground(R.x)-38;requestAnimationFrame(frame);
})();
</script></body></html>
