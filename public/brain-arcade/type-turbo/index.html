  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Type Turbo",
    "genre": "Typing game",
    "url": "https://teacharcade.com/brain-arcade/type-turbo/",

<body>
  <div id="site-header"></div>

  <main>
    <div class="page-wrap">
      <div class="breadcrumbs"><a href="/brain-arcade/">← Brain Arcade</a></div>
      <header class="hero">
        <h1>Type Turbo</h1>
        <p>Race your fingers. Build speed. Stay accurate.</p>
      </header>

      <section class="game-shell" aria-label="Type Turbo game panel">
        <div class="control-grid">
          <div>
            <label for="difficultySelect">Difficulty</label>
            <select id="difficultySelect">
              <option value="easy">Easy</option>
              <option value="normal">Normal</option>
              <option value="hard">Hard</option>
              <option value="pro">Pro</option>
            </select>
          </div>
          <div>
            <label for="modeSelect">Mode</label>
            <select id="modeSelect">
              <option value="sprint">Sprint (60s)</option>
              <option value="endless">Endless (5 lives)</option>
              <option value="accuracy">Accuracy (50 items)</option>
              <option value="zen">Zen</option>
            </select>
          </div>
          <div>
            <label for="visualModeSelect">Visual Mode</label>
            <select id="visualModeSelect">
              <option value="rocket">Rocket Launch</option>
              <option value="city">City Builder</option>
            </select>
          </div>
        </div>

        <div class="row">
          <button id="startBtn" type="button">Start</button>
          <button id="pauseBtn" class="secondary" type="button">Pause</button>
          <button id="restartBtn" class="ghost" type="button">Restart</button>
        </div>

        <div class="hud-grid" role="status" aria-live="polite">
          <div class="hud-item"><span class="k">Timer</span><span class="v" id="timerDisplay">60.0s</span></div>
          <div class="hud-item"><span class="k">Lives</span><span class="v" id="livesDisplay">5</span></div>
          <div class="hud-item"><span class="k">WPM</span><span class="v" id="wpmDisplay">0</span></div>
          <div class="hud-item"><span class="k">Accuracy</span><span class="v" id="accuracyDisplay">100%</span></div>
          <div class="hud-item"><span class="k">Combo</span><span class="v" id="comboDisplay">0</span></div>
          <div class="hud-item"><span class="k">Streak</span><span class="v" id="streakDisplay">0</span></div>
        </div>

        <div class="game-layout">
          <section class="typing-panel">
            <div class="target" id="targetWrap">
              <p id="targetText">Press Start to begin.</p>
            </div>
            <input id="typingInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Type the target text" placeholder="Type here..." />
            <p class="feedback" id="feedbackLine" aria-live="polite">Ready.</p>
          </section>

          <section class="visual-panel" aria-label="Visual mode preview">
            <div id="visualModePanel" class="visual-mode-host"></div>
          </section>
        </div>

        <section class="results" id="resultsPanel" hidden>
          <h2>Results</h2>
          <div class="result-grid">
            <div class="result-card">Final WPM: <strong id="finalWpm">0</strong></div>
            <div class="result-card">Accuracy: <strong id="finalAccuracy">0%</strong></div>
            <div class="result-card">Correct: <strong id="finalCorrect">0</strong></div>
            <div class="result-card">Best streak: <strong id="finalStreak">0</strong></div>
            <div class="result-card">PB: <strong id="pbStats">—</strong></div>
          </div>
          <div class="row">
            <button id="copyResultBtn" type="button">Copy result</button>
            <button id="playAgainBtn" class="secondary" type="button">Play again</button>
            <a class="btn ghost" href="/brain-arcade/">Back to Brain Arcade</a>
          </div>
        </section>
      </section>

      <div class="ad-slot" aria-label="Advertisement">
        <ins class="adsbygoogle"
          style="display:block"
          data-ad-client="ca-pub-7899890641544647"
          data-ad-slot="1234567890"
          data-ad-format="auto"
          data-full-width-responsive="true"></ins>
      </div>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
