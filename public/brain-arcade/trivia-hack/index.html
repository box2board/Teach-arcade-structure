function count(p){return p.progress.filter(x=>x===3).length}function total(p){return p.progress.reduce((a,b)=>a+b,0)}
function hud(){$('mode-label').textContent=mode==='solo'?'Solo practice · online rooms planned':'CPU race · online rooms planned';$('rivals').className=mode==='race'?'rivals':'';$('rivals').innerHTML=mode==='race'?state.players.map((p,i)=>`<div class="player"><b>${p.name}${i?' <small>CPU</small>':''}</b><div class="mini-progress">${p.progress.map((v,j)=>`<span title="${CATEGORIES[j].name}: ${v}/3" style="background:${v===3?CATEGORIES[j].color:'#31435d'};opacity:${v===3?1:.5+v*.15}"></span>`).join('')}</div><small>${count(p)} / 6 hacked · ${total(p)} / 18 segments</small></div>`).join(''):''}
function hub(notice=''){stop();state.phase='hub';selected=-1;const p=state.players[0];const done=count(p);$('surface').innerHTML=`${notice?`<div class="notice" aria-live="polite">${esc(notice)}</div>`:''}<div class="hub-top"><div><div class="meta" style="color:var(--green)">SYSTEM ACCESS</div><h1>Hack all six.</h1><p>Three correct answers complete a category.<br>Your progress stays when you miss.</p></div><div class="core"><img class="core-art" src="assets/core.webp" alt="" width="160" height="160"><div class="core-data"><div class="core-number">${done}/6</div><b>${done===6?'ACCESS GRANTED':'HACKED'}</b><div class="core-pips">${p.progress.map((v,j)=>`<span style="--port:${CATEGORIES[j].color}" class="${v===3?'lit':''}"></span>`).join('')}</div></div></div></div><div class="modules">${CATEGORIES.map((c,i)=>`<button class="module ${p.progress[i]===3?'hacked':''} ${state.lastHack===i?'just-hacked':''}" data-cat="${i}" style="--c:${c.color}" ${p.progress[i]===3?'disabled':''}><div class="module-head"><span>${i+1} / ${c.code}</span><span class="module-status">${icon(p.progress[i]===3?'Check':'LockKeyhole')}${p.progress[i]===3?'HACKED':'LOCKED'}</span></div><div class="module-title"><span class="category-icon">${icon(CATEGORY_ICONS[i])}</span><h2>${c.name}</h2><span class="module-arrow">${icon(p.progress[i]===3?'Check':'ArrowUpRight')}</span></div><div class="segments">${[0,1,2].map(j=>`<span class="segment ${j<p.progress[i]?'filled':''}"></span>`).join('')}</div><div class="module-label">${p.progress[i]===3?'Category complete':p.progress[i]+' / 3 correct · Tap to hack'}</div></button>`).join('')}</div><div class="power-summary">${['fifty','time','double'].map(k=>`<span class="${state.powerups[k]||k==='double'&&state.doubleArmed?'ready':''}">${k==='fifty'?'50/50':k==='time'?'+10 seconds':'Double Hack'} · ${k==='double'&&state.doubleArmed?'armed':state.powerups[k]?'ready':'used'}</span>`).join('')}</div>${state.attempts===0?`<div class="mode-row"><span class="hint">Play:</span><button class="quiet ${mode==='solo'?'active':''}" id="solo">Solo hack</button><button class="quiet ${mode==='race'?'active':''}" id="race">Race CPUs</button></div>`:''}`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.cat)));if($('solo'))$('solo').onclick=()=>{mode='solo';hud();hub()};if($('race'))$('race').onclick=()=>{mode='race';hud();hub()};$('keyboard').textContent='Choose a category · keys 1–6';hud();state.lastHack=null}
function choose(i){if(state.phase!=='hub'||i<0||i>5||state.players[0].progress[i]>=3)return;state.category=i;question()}
function question(){stop();state.phase='question';selected=-1;const i=state.category,c=CATEGORIES[i];if(!state.decks[i].length)state.decks[i]=shuffle(BANK.filter(q=>q.category===c.name));state.q=state.decks[i].pop();state.choices=shuffle(state.q.choices);state.removed=[];state.duration=20000;state.deadline=performance.now()+state.duration;$('surface').style.setProperty('--c',c.color);$('surface').innerHTML=`<div class="question-top"><div><div class="question-category"><span class="small-icon">${icon(CATEGORY_ICONS[i])}</span><div><div class="category">${c.name}</div><div class="hint">${state.players[0].progress[i]} / 3 correct</div></div></div><div class="question-segments">${[0,1,2].map(j=>`<span class="segment ${j<state.players[0].progress[i]?'filled':''}"></span>`).join('')}</div><button class="quiet" id="categories" style="margin-top:8px">Categories</button></div><div class="timer" id="seconds">20s</div></div><div class="timebar"><div id="clock" style="width:100%"></div></div><h2 class="question">${esc(state.q.text)}</h2><div class="answers">${state.choices.map((x,j)=>`<button class="answer" data-answer="${j}"><span class="key">${j+1}</span>${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite">Answer correctly to fill the next segment.</div><div class="powerups" id="powerups"></div>`;document.querySelectorAll('[data-answer]').forEach(b=>{b.onclick=()=>answer(Number(b.dataset.answer));b.onfocus=()=>{selected=Number(b.dataset.answer)}});$('categories').onclick=()=>hub();renderPowerups();$('keyboard').textContent='1–4 answer · Z 50/50 · X +10s · C Double';hud();timer=setInterval(tick,100)}

function renderPowerups(){const items=[{key:'fifty',name:'Z · 50/50',desc:'Remove two wrong answers'},{key:'time',name:'X · +10 seconds',desc:'More time on this question'},{key:'double',name:'C · Double Hack',desc:'Next correct: +2 segments'}];$('powerups').innerHTML=items.map(x=>{const armed=x.key==='double'&&state.doubleArmed;const used=!state.powerups[x.key];return `<button class="powerup ${armed?'armed':''}" data-power="${x.key}" ${state.phase!=='question'||used?'disabled':''}><span class="power-icon">${icon(x.key==='fifty'?'Scissors':x.key==='time'?'Timer':'Zap')}</span><b>${armed?'Double Hack armed':x.name}</b><small>${armed?'Ready for your next correct answer':used?'Used this game':x.desc}</small></button>`}).join('');document.querySelectorAll('[data-power]').forEach(b=>b.onclick=()=>usePowerup(b.dataset.power))}
function usePowerup(key){if(state.phase!=='question'||!state.powerups[key])return;tick();if(state.phase!=='question')return;state.powerups[key]--;if(key==='fifty'){state.removed=shuffle(state.choices.map((v,i)=>v!==state.q.correct?i:-1).filter(i=>i>=0)).slice(0,2);document.querySelectorAll('[data-answer]').forEach(b=>{const removed=state.removed.includes(Number(b.dataset.answer));if(removed){b.disabled=true;b.classList.add('removed');b.setAttribute('aria-label',state.choices[Number(b.dataset.answer)]+' — removed as incorrect')}});if(state.removed.includes(selected))selected=-1;$('feedback').textContent='50/50 used. Choose from the two remaining answers.'}else if(key==='time'){state.duration+=10000;state.deadline+=10000;tick();$('feedback').textContent='10 seconds added.'}else{state.doubleArmed=true;$('feedback').textContent='Double Hack armed. Your next correct answer fills up to two segments.'}renderPowerups()}

function tick(){if(state.phase!=='question')return;const left=Math.max(0,state.deadline-performance.now());$('seconds').textContent=Math.ceil(left/1000)+'s';$('clock').style.width=100*left/state.duration+'%';if(left===0)answer(null)}
function simulateCPUs(){if(mode!=='race')return;for(const p of state.players.slice(1)){const options=p.progress.map((v,i)=>v<3?i:-1).filter(i=>i>=0);if(!options.length)continue;const category=options[Math.floor(Math.random()*options.length)];if(Math.random()<.63)p.progress[category]++}}
function winner(){const active=mode==='race'?state.players:state.players.slice(0,1);return active.filter(p=>count(p)===6)}
function answer(i){if(state.phase!=='question')return;if(performance.now()>=state.deadline)i=null;else if(i!==null&&(i<0||i>3||state.removed.includes(i)))return;stop();state.phase='reveal';state.attempts++;const ok=i!==null&&state.choices[i]===state.q.correct;const c=state.category;if(ok){state.players[0].progress[c]=Math.min(3,state.players[0].progress[c]+(state.doubleArmed?2:1));state.doubleArmed=false;state.correct++}state.completed=ok&&state.players[0].progress[c]===3;if(state.completed)state.lastHack=c;simulateCPUs();document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const j=Number(b.dataset.answer);if(state.choices[j]===state.q.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=state.completed?CATEGORIES[c].name+' HACKED! '+count(state.players[0])+' of 6 complete.':ok?'Access gained. '+state.players[0].progress[c]+' / 3 correct.':(i===null?'Time expired. ':'')+'Correct answer: '+state.q.correct+'. Your progress is safe.';$('seconds').textContent=ok?'✓':'×';renderPowerups();hud();$('keyboard').textContent='Enter to continue';nextTimer=setTimeout(advance,state.completed?1800:2200)}
function advance(){if(state.phase!=='reveal')return;stop();if(winner().length){finish();return}if(state.completed){hub(CATEGORIES[state.category].name+' hacked. Choose your next category.');return}question()}
function finish(){stop();state.phase='results';const winners=winner();const human=winners.some(p=>p.name==='You');$('surface').innerHTML=`<div class="results">${human?'<img class="success-core" src="assets/core.webp" alt="" width="180" height="180">':''}<div class="meta" style="color:var(--green)">${human?'SYSTEM UNLOCKED':'MATCH COMPLETE'}</div><h1>${human?(winners.length>1?'Shared system access.':'All six hacked.'):'The system was cracked.'}</h1><p>${human?'You completed every category.':esc(winners.map(p=>p.name).join(' & '))+' completed all six first.'}<br>${state.correct} correct from ${state.attempts} questions.</p><div class="results-grid">${CATEGORIES.map((c,i)=>`<span class="chip" style="--c:${c.color}">${state.players[0].progress[i]===3?'✓ ':''}${c.name} ${state.players[0].progress[i]}/3</span>`).join('')}</div><button class="primary" id="again">Hack again</button>${!human?'<button class="quiet" id="continue" style="margin-left:10px">Finish my hack solo</button>':''}</div>`;$('again').onclick=fresh;if($('continue'))$('continue').onclick=()=>{mode='solo';hub()};$('keyboard').textContent='Six categories. One complete hack.';hud()}
$('new').onclick=()=>{if(state.attempts>0&&state.phase!=='results'){if(!window.confirm('Start a new game and clear this hack’s progress?'))return}fresh()};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('button')&&!e.target.disabled&&!e.target.matches('.answer'))return;if(state.phase==='hub'&&/^[1-6]$/.test(e.key)){e.preventDefault();choose(Number(e.key)-1);return}if(state.phase==='reveal'&&e.key==='Enter'){e.preventDefault();advance();return}if(state.phase!=='question')return;if(['z','x','c'].includes(e.key.toLowerCase())){e.preventDefault();usePowerup({z:'fifty',x:'time',c:'double'}[e.key.toLowerCase()]);return}if(/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1)}else if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();const d=['ArrowRight','ArrowDown'].includes(e.key)?1:-1;const available=[0,1,2,3].filter(i=>!state.removed.includes(i));const at=available.indexOf(selected);selected=available[at<0?(d===1?0:available.length-1):(at+d+available.length)%available.length];document.querySelectorAll('[data-answer]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.answer)===selected))}else if(e.key==='Enter'&&selected>=0){e.preventDefault();answer(selected)}});fresh();
</script><script src="/assets/scripts/nav.js?v=5" defer></script></body></html>
