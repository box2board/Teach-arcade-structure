<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>American Revolution: The Breaking Point | Teach Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="icon" href="/assets/images/teach-arcade-logo.png" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
      font-family: Nunito, system-ui, sans-serif;
      margin: 0;
    }

    .sim-wrap {
      max-width: 980px;
      margin: 96px auto 48px;
      padding: 0 16px;
    }

    .card {
      background: rgba(2,6,23,.85);
      border: 1px solid rgba(148,163,184,.15);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    h1 {
      font: 700 30px/1.2 Poppins, sans-serif;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 18px;
    }

    h2 {
      font: 700 18px/1.2 Poppins, sans-serif;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.6;
      color: #cbd5f5;
      margin: 0 0 10px;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice-btn {
      background: linear-gradient(180deg, #020617, #020617);
      border: 1px solid rgba(148,163,184,.2);
      border-radius: 14px;
      padding: 14px;
      text-align: left;
      color: #e5e7eb;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease;
    }

    .choice-btn:hover {
      transform: translateY(-2px);
      border-color: #60a5fa;
    }

    .choice-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .choice-desc {
      font-size: 14px;
      color: #cbd5e1;
    }

    .reveal {
      border-left: 4px solid #38bdf8;
    }

    .delta-row {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .delta-pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(148,163,184,.25);
    }

    .delta-pill.pos { color: #86efac; }
    .delta-pill.neg { color: #fca5a5; }

    .footer-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button.secondary {
      background: transparent;
      border: 1px solid rgba(148,163,184,.3);
      color: #cbd5e1;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="site-header"></div>
<script src="/assets/scripts/nav.js" defer></script>

<main class="sim-wrap">

  <div class="card">
    <h1>American Revolution: The Breaking Point</h1>
    <div class="subtitle">
      Infer consequences from context. Outcomes are revealed only after you commit.
    </div>
  </div>

  <!-- DECISION CARD -->
  <div class="card">
    <h2 id="nodeTitle">Situation</h2>
    <p id="nodePrompt">Loading…</p>
    <div id="nodeContext"></div>
  </div>

  <!-- CHOICES -->
  <div class="card">
    <h2>Choose a response</h2>
    <div id="choicesList" class="choices"></div>
  </div>

  <!-- REVEAL (HIDDEN UNTIL CHOICE) -->
  <div id="revealCard" class="card reveal" hidden>
    <h2>Outcome</h2>
    <p id="revealNarrative"></p>
    <p id="revealWhy"></p>
    <div id="deltaRow" class="delta-row"></div>
    <p id="reflectPrompt" style="margin-top:12px;font-style:italic;"></p>

    <div class="footer-controls">
      <button id="btn-next" class="secondary">Continue</button>
      <button id="btn-restart" class="secondary">Restart</button>
    </div>
  </div>

</main>

<script src="engine.js" defer></script>
</body>
</html>
