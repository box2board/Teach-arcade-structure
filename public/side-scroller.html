<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Teach Arcade · WWI Review Run</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --sky: #3b4c8b;
      --horizon: #1e2438;
      --trench-dirt: #463428;
      --trench-wood: #7b5a38;
      --barbed: #9da2b1;
      --player: #f4c542;
      --player-accent: #ffb300;
      --ui-bg: rgba(0, 0, 0, 0.55);
      --accent: #ffb300;
      --text: #f9f9ff;
      --pit-shadow: #17131b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0b0f1e 0%, #020308 65%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px;
      gap: 10px;
    }

    h1 {
      font-family: "Press Start 2P", system-ui, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #000;
      text-align: center;
    }

    .subtitle {
      font-size: 0.75rem;
      opacity: 0.9;
      text-align: center;
      max-width: 900px;
    }

    #modeBar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.75rem;
    }

    .pill-btn {
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 4px 10px;
      background: rgba(0,0,0,0.55);
      color: var(--text);
      cursor: pointer;
      font-size: 0.7rem;
      font-family: "Press Start 2P", system-ui, sans-serif;
      text-transform: uppercase;
    }

    .pill-btn.active {
      background: var(--accent);
      color: #111;
    }

    #gameContainer {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      border: 2px solid rgba(255,255,255,0.18);
      background: #000;
    }

    canvas {
      display: block;
      background: var(--sky);
      image-rendering: pixelated;
    }

    #hud {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      background: var(--ui-bg);
      padding: 4px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      font-family: "Press Start 2P", system-ui, sans-serif;
      z-index: 5;
    }

    #hud span {
      white-space: nowrap;
    }

    #questionOverlay,
    #endOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(0,0,0,0.94), rgba(0,0,0,0.98));
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    .panel {
      background: #171b29;
      border-radius: 14px;
      padding: 18px 18px 14px;
      max-width: 480px;
      width: 92%;
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: 0 12px 36px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .panel h2 {
      font-family: "Press Start 2P", system-ui, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .choice-btn {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      background: #232842;
      color: var(--text);
      transition: background 0.08s, transform 0.08s, box-shadow 0.1s;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .choice-btn:hover {
      background: #2f3557;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.6);
    }

    .choice-btn.correct {
      background: #2e7d32 !important;
    }

    .choice-btn.wrong {
      background: #c62828 !important;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .primary-btn {
      border-radius: 999px;
      border: none;
      padding: 6px 12px;
      background: var(--accent);
      color: #111;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: "Press Start 2P", system-ui, sans-serif;
      text-transform: uppercase;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #touchControls {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      padding: 4px 10px;
      background: var(--ui-bg);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
      z-index: 6;
    }

    .ctrl-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      background: #181b2e;
      color: var(--text);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: "Press Start 2P", system-ui, sans-serif;
      transition: transform 0.08s, box-shadow 0.08s, background 0.08s;
    }

    .ctrl-btn:active {
      transform: translateY(1px);
      background: #222641;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6) inset;
    }

    @media (min-width: 900px) {
      #touchControls {
        display: none;
      }
    }

    @media (max-width: 900px) {
      canvas {
        width: 100vw;
        height: auto;
      }
      h1 {
        font-size: 0.8rem;
      }
      .subtitle {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <h1>Teach Arcade · WWI Trench Run</h1>
  <p class="subtitle">
    Explore the trenches, find all 20 question markers, and test your World War I knowledge.
  </p>

  <div id="modeBar">
    <span>Question Mode:</span>
    <button id="modePreloaded" class="pill-btn active">Preloaded WWI Bank</button>
    <!-- For now, custom mode is code-edited only; button included for future expansion -->
    <button id="modeCustom" class="pill-btn">Custom (if configured)</button>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="360"></canvas>

    <div id="hud">
      <span id="hudScore">Score: 0</span>
      <span id="hudQuestions">Questions: 0 / 20</span>
      <span id="hudStatus">Status: Running</span>
    </div>

    <div id="touchControls">
      <button id="btnLeft" class="ctrl-btn" aria-label="Move left">◀</button>
      <button id="btnJump" class="ctrl-btn" aria-label="Jump">▲</button>
      <button id="btnRight" class="ctrl-btn" aria-label="Move right">▶</button>
    </div>

    <div id="questionOverlay" class="hidden">
      <div class="panel">
        <h2 id="qTitle">Question</h2>
        <p id="qText"></p>
        <div class="choices" id="choicesContainer"></div>
        <div class="panel-footer">
          <span id="qFeedback"></span>
          <button id="qCloseBtn" class="primary-btn">Resume</button>
        </div>
      </div>
    </div>

    <div id="endOverlay" class="hidden">
      <div class="panel">
        <h2>Level Complete!</h2>
        <p id="endSummary"></p>
        <div class="panel-footer">
          <button id="replayBtn" class="primary-btn">Replay WWI</button>
          <button id="topicBtn" class="primary-btn">Choose Another Topic</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ======================================================
    // CONFIG: CUSTOM QUESTIONS (advanced – edit in code)
    // ======================================================
    // If you want to hard-code your own question set for this level,
    // fill this array with up to 20 questions in the same format as WWI_QUESTION_BANK.
    // Then toggle "useCustomQuestions" below or click the Custom button.
    const CUSTOM_QUESTIONS = [
      // Example:
      // {
      //   id: 1,
      //   text: "Your custom question here?",
      //   choices: ["A", "B", "C", "D"],
      //   correctIndex: 0

    let useCustomQuestions = false;

    // ======================================================
    // PRELOADED WWI QUESTION BANK (50 QUESTIONS)
    // ======================================================
    const WWI_QUESTION_BANK = [

      { id: 2, text: "What does the 'M' in MAIN causes of WWI stand for?", choices: [

      { id: 9, text: "The region of Europe known as the 'powder keg' because of tension was:", choices: [

      { id: 22, text: "Which country did the Zimmermann Telegram try to involve in war against the U.S.?", choices: [

      ], correctIndex: 1 },

      ], correctIndex: 1 },

      { id: 36, text: "Which organization was created after WWI to help prevent future wars?", choices: [
        "United Nations", "NATO", "League of Nations", "European Union"
      ], correctIndex: 2 },

      { id: 37, text: "Why did many Germans resent the Treaty of Versailles?", choices: [
        "It rewarded them too much",
        "It forced them to fight again",
        "They felt it was unfair and humiliating",
        "It gave them more colonies"
      ], correctIndex: 2 },

      { id: 38, text: "Which empire collapsed as a result of WWI?", choices: [
        "Japanese Empire", "Ottoman Empire", "British Empire", "United States"
      ], correctIndex: 1 },

      { id: 39, text: "Which of the following was a new nation created after WWI?", choices: [
        "Spain", "Portugal", "Poland", "Sweden"
      ], correctIndex: 2 },

      { id: 40, text: "What is one major human cost of WWI?", choices: [

      { id: 41, text: "What is meant by the 'Lost Generation'?", choices: [
        "Children who were evacuated",

      { id: 42, text: "How did WWI affect women in many countries?", choices: [

      ], correctIndex: 0 },

      { id: 48, text: "WWI helped set the stage for WWII mainly because:", choices: [

      ], correctIndex: 1 },

      { id: 49, text: "What was one economic effect of WWI on Europe?", choices: [
        "All countries became wealthy",

        "Trade completely stopped forever"

    function pickRandomQuestions(bank, count = 20) {
      const shuffled = [...bank].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    // ======================================================
    // CORE GAME STATE
    // ======================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const TILE_SIZE = 48;
    const WORLD_TILES = 80; // width in tiles
    const WORLD_WIDTH = WORLD_TILES * TILE_SIZE;
    const WORLD_HEIGHT = canvas.height;

    const player = {
      x: 80,
      y: 180,
      w: 28,
      h: 40,
      vx: 0,
      vy: 0,
      onGround: false
    };

    const GRAVITY = 1200;
    const PLAYER_SPEED = 240;
    const JUMP_STRENGTH = 540;

    let cameraX = 0;
    let lastTime = 0;
    let gamePaused = false;
    let inQuestion = false;
    let levelComplete = false;

    let score = 0;
    let firstTryCorrectCount = 0;
    let questionsAnsweredCount = 0;

    let currentQuestions = []; // 20 for this run
    let questionBlocks = [];   // positions + status
    let activeQuestionBlock = null;

    const pits = [
      { x: 900, width: 180 },
      { x: 1700, width: 160 },
      { x: 2500, width: 160 },
      { x: 3400, width: 200 }
    ];

    const endFlagX = WORLD_WIDTH - 160;

    const keys = { left: false, right: false, jump: false };

    // ======================================================
    // UI ELEMENTS
    // ======================================================
    const hudScore = document.getElementById('hudScore');
    const hudQuestions = document.getElementById('hudQuestions');
    const hudStatus = document.getElementById('hudStatus');

    const qOverlay = document.getElementById('questionOverlay');
    const qTitle = document.getElementById('qTitle');
    const qText = document.getElementById('qText');
    const qChoices = document.getElementById('choicesContainer');
    const qFeedback = document.getElementById('qFeedback');
    const qCloseBtn = document.getElementById('qCloseBtn');

    const endOverlay = document.getElementById('endOverlay');
    const endSummary = document.getElementById('endSummary');
    const replayBtn = document.getElementById('replayBtn');
    const topicBtn = document.getElementById('topicBtn');

    const modePreloadedBtn = document.getElementById('modePreloaded');
    const modeCustomBtn = document.getElementById('modeCustom');

    // Touch controls
    const leftBtn  = document.getElementById('btnLeft');
    const rightBtn = document.getElementById('btnRight');
    const jumpBtn  = document.getElementById('btnJump');

    // ======================================================
    // INPUT HANDLING
    // ======================================================
    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.jump = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.jump = false;
    });

    function bindControl(btn, onDown, onUp) {
      if (!btn) return;
      const start = (e) => { e.preventDefault(); onDown(); };
      const end = (e) => { e.preventDefault(); onUp(); };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    bindControl(leftBtn, () => { keys.left = true; },  () => { keys.left = false; });
    bindControl(rightBtn, () => { keys.right = true; }, () => { keys.right = false; });
    bindControl(jumpBtn, () => { keys.jump = true; },  () => { keys.jump = false; });

    // Mode buttons
    modePreloadedBtn.addEventListener('click', () => {
      useCustomQuestions = false;
      modePreloadedBtn.classList.add('active');
      modeCustomBtn.classList.remove('active');
      startNewRun();
    });

    modeCustomBtn.addEventListener('click', () => {
      useCustomQuestions = CUSTOM_QUESTIONS && CUSTOM_QUESTIONS.length > 0;
      modeCustomBtn.classList.add('active');
      modePreloadedBtn.classList.remove('active');
      startNewRun();
    });

    // ======================================================
    // QUESTION LOGIC
    // ======================================================
    function startNewRun() {
      // Reset player & stats
      player.x = 80;
      player.y = 180;
      player.vx = 0;
      player.vy = 0;
      cameraX = 0;
      score = 0;
      questionsAnsweredCount = 0;
      firstTryCorrectCount = 0;
      levelComplete = false;
      gamePaused = false;
      inQuestion = false;
      qOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');
      hudStatus.textContent = "Status: Running";

      // Select questions
      if (useCustomQuestions && CUSTOM_QUESTIONS.length > 0) {
        currentQuestions = CUSTOM_QUESTIONS.slice(0, 20);
      } else {
        currentQuestions = pickRandomQuestions(WWI_QUESTION_BANK, 20);
      }

      // Place 20 question blocks along level
      questionBlocks = [];
      const spacing = (WORLD_WIDTH - 400) / 20;
      for (let i = 0; i < 20; i++) {
        const qb = {
          id: i + 1,
          qIndex: i, // index into currentQuestions
          x: 200 + spacing * i,
          y: (i % 3 === 0) ? 160 : (i % 3 === 1 ? 220 : 120),
          completed: false,
          firstTry: true
        };
        questionBlocks.push(qb);
      }

      updateHud();
    }

    function openQuestion(block) {
      if (inQuestion || levelComplete) return;
      inQuestion = true;
      gamePaused = true;
      activeQuestionBlock = block;

      const q = currentQuestions[block.qIndex];
      qTitle.textContent = "Question " + block.id;
      qText.textContent = q.text;
      qFeedback.textContent = "";
      qChoices.innerHTML = "";

      q.choices.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = String.fromCharCode(65 + idx) + ") " + choice;
        btn.addEventListener('click', () => handleAnswer(block, q, idx, btn));
        qChoices.appendChild(btn);
      });

      qOverlay.classList.remove('hidden');
      hudStatus.textContent = "Status: Answering";
    }

    function handleAnswer(block, question, selectedIndex, btnEl) {
      const isCorrect = selectedIndex === question.correctIndex;
      if (isCorrect) {
        btnEl.classList.add('correct');
        qFeedback.textContent = "Correct!";
        // scoring
        if (block.firstTry) {
          score += 25;
          firstTryCorrectCount++;
        } else {
          score += 10;
        }
        block.completed = true;
        questionsAnsweredCount = questionBlocks.filter(b => b.completed).length;
        updateHud();

        setTimeout(() => {
          closeQuestion();
          checkLevelComplete();
        }, 500);
      } else {
        btnEl.classList.add('wrong');
        qFeedback.textContent = "Incorrect. Try again.";
        score -= 10;
        block.firstTry = false;
        updateHud();
      }
    }

    function closeQuestion() {
      qOverlay.classList.add('hidden');
      inQuestion = false;
      gamePaused = false;
      activeQuestionBlock = null;
      hudStatus.textContent = "Status: Running";
    }

    qCloseBtn.addEventListener('click', () => {
      // Only allow closing if question is completed
      if (activeQuestionBlock && activeQuestionBlock.completed) {
        closeQuestion();
      } else {
        qFeedback.textContent = "Answer correctly to continue.";
      }
    });

    function checkLevelComplete() {
      if (!levelComplete &&
          questionsAnsweredCount === 20 &&
          player.x + player.w > endFlagX) {
        triggerEndScreen();
      }
    }

    function triggerEndScreen() {
      levelComplete = true;
      gamePaused = true;
      inQuestion = false;
      hudStatus.textContent = "Status: Complete";

      const accuracy = (firstTryCorrectCount / 20) * 100;
      endSummary.textContent =
        `Score: ${score} points | Accuracy: ${firstTryCorrectCount}/20 (${accuracy.toFixed(0)}%)`;

      endOverlay.classList.remove('hidden');
    }

    replayBtn.addEventListener('click', () => {
      startNewRun();
    });

    topicBtn.addEventListener('click', () => {
      // For now, just reload. You can change this to window.location = '/games' etc.
      window.location.href = "/"; // or a Teach Arcade hub page
    });

    function updateHud() {
      hudScore.textContent = "Score: " + score;
      hudQuestions.textContent = "Questions: " + questionsAnsweredCount + " / 20";
    }

    // ======================================================
    // GAME LOOP & PHYSICS
    // ======================================================
    function update(dt) {
      if (gamePaused) return;

      // Horizontal control
      if (keys.left)      player.vx = -PLAYER_SPEED;
      else if (keys.right) player.vx = PLAYER_SPEED;
      else                player.vx = 0;

      // Jump
      if (keys.jump && player.onGround) {
        player.vy = -JUMP_STRENGTH;
        player.onGround = false;
      }

      player.vy += GRAVITY * dt;

      // Move horizontally
      player.x += player.vx * dt;
      // Simple bounds
      if (player.x < 0) player.x = 0;
      if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

      // "Ground" at fixed y with trenches/pits behavior
      player.y += player.vy * dt;
      const groundY = 280;
      if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      // Pit logic: if player over pit and below ground, respawn + penalty
      pits.forEach(pit => {
        const overPit = player.x + player.w > pit.x && player.x < pit.x + pit.width;
        if (overPit && player.y + player.h >= groundY + 2) {
          // Respawn just after pit
          player.x = pit.x + pit.width + 10;
          player.y = groundY - player.h;
          player.vy = 0;
          score -= 20;
          updateHud();
        }
      });

      // Check collision with question blocks
      for (const block of questionBlocks) {
        if (block.completed) continue;
        const box = { x: block.x, y: block.y, w: 32, h: 32 };
        if (rectIntersect(player, box)) {
          openQuestion(block);
          break;
        }
      }

      // Check if at end (but may need all questions)
      if (!levelComplete && player.x + player.w > endFlagX) {
        checkLevelComplete();
      }

      // Camera follows player
      const halfCanvas = canvas.width / 2;
      cameraX = player.x + player.w / 2 - halfCanvas;
      cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - canvas.width));
    }

    function rectIntersect(a, b) {
      return !(
        a.x + a.w <= b.x ||
        a.x >= b.x + b.w ||
        a.y + a.h <= b.y ||
        a.y >= b.y + b.h
      );
    }

    function drawBackground() {
      // Sky
      ctx.fillStyle = "#3b4c8b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Horizon strip
      ctx.fillStyle = "#1e2438";
      ctx.fillRect(0, canvas.height * 0.45, canvas.width, canvas.height * 0.3);

      // Distant artillery silhouettes
      ctx.fillStyle = "#111320";
      for (let x = -200; x < WORLD_WIDTH + 200; x += 260) {
        const sx = x - cameraX;
        if (sx > canvas.width || sx < -200) continue;
        ctx.fillRect(sx + 40, canvas.height * 0.5, 40, 40);
        ctx.fillRect(sx + 20, canvas.height * 0.54, 80, 10);
      }

      // Barbed wire line
      ctx.strokeStyle = "#9da2b1";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = -100; x < canvas.width + 100; x += 20) {
        const wiggle = Math.sin((x + cameraX) * 0.02) * 4;
        ctx.lineTo(x, 230 + wiggle);
      }
      ctx.stroke();
    }

    function drawTrenchesAndPits() {
      const groundY = 280;

      // Base ground
      ctx.fillStyle = "#463428";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // Simple repeating trench wood pattern
      const startWorldX = cameraX;
      const endWorldX = cameraX + canvas.width;
      const tileStart = Math.floor(startWorldX / TILE_SIZE);
      const tileEnd = Math.ceil(endWorldX / TILE_SIZE);

      for (let t = tileStart; t < tileEnd; t++) {
        const tileX = t * TILE_SIZE;
        const screenX = tileX - cameraX;

        // Skip if inside a pit
        const inPit = pits.some(p => tileX + TILE_SIZE > p.x && tileX < p.x + p.width);
        if (!inPit) {
          // Dirt body
          ctx.fillStyle = "#463428";
          ctx.fillRect(screenX, groundY, TILE_SIZE, canvas.height - groundY);
          // Wood planks
          ctx.fillStyle = "#7b5a38";
          ctx.fillRect(screenX, groundY - 12, TILE_SIZE, 12);
          ctx.fillRect(screenX, groundY + 10, TILE_SIZE, 6);
        } else {
          // Pit darkness
          ctx.fillStyle = "#17131b";
          ctx.fillRect(screenX, groundY, TILE_SIZE, canvas.height - groundY);
        }
      }
    }

    function drawQuestionBlocks() {
      ctx.font = "10px 'Press Start 2P', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      questionBlocks.forEach(block => {
        const sx = block.x - cameraX;
        const sy = block.y;

        // Box
        ctx.fillStyle = block.completed ? "#3b5a2a" : "#b8943b";
        ctx.fillRect(sx, sy, 32, 32);
        ctx.strokeStyle = "rgba(0,0,0,0.6)";
        ctx.strokeRect(sx + 0.5, sy + 0.5, 31, 31);

        // Question mark
        ctx.fillStyle = "#2b210f";
        ctx.fillText("?", sx + 16, sy + 10);

        // Number label above
        ctx.fillStyle = "#f9f9ff";
        ctx.fillText(block.id, sx + 16, sy - 10);
      });
    }

    function drawEndFlag() {
      const sx = endFlagX - cameraX;
      const baseY = 280;
      // Pole
      ctx.strokeStyle = "#f5f5f5";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx, baseY);
      ctx.lineTo(sx, baseY - 80);
      ctx.stroke();

      // Flag
      ctx.fillStyle = "#f5f5f5";
      ctx.fillRect(sx, baseY - 80, 30, 16);
      ctx.fillStyle = "#ff3657";
      ctx.fillRect(sx + 15, baseY - 80, 15, 16);
    }

    function drawPlayer() {
      const sx = player.x - cameraX;
      const sy = player.y;

      // Body
      ctx.fillStyle = "#f4c542";
      ctx.fillRect(sx, sy, player.w, player.h);
      // Helmet
      ctx.fillStyle = "#ffb300";
      ctx.fillRect(sx, sy - 6, player.w, 8);
      // Boots
      ctx.fillStyle = "#2a2016";
      ctx.fillRect(sx + 4, sy + player.h - 6, player.w - 8, 6);
      // Eyes
      ctx.fillStyle = "#1b1b1b";
      ctx.fillRect(sx + 6, sy + 12, 3, 3);
      ctx.fillRect(sx + 16, sy + 12, 3, 3);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background layers
      drawBackground();
      drawTrenchesAndPits();
      drawQuestionBlocks();
      drawEndFlag();
      drawPlayer();
    }

    function loop(timestamp) {
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    // Start
    startNewRun();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
