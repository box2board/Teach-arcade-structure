<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Treasure Garden • Teach Arcade experiment</title><style>
*{box-sizing:border-box}body{margin:0;background:#122b30;color:#fff;font:16px system-ui;overflow:hidden}button{font:inherit;cursor:pointer;border:0}#app{height:100dvh;display:flex;flex-direction:column;max-width:1300px;margin:auto}header{display:flex;align-items:center;gap:18px;padding:12px 20px;background:#173b40;border-bottom:3px solid #0b2428}header strong{color:#ffdc82;font-size:22px}header span{white-space:nowrap}#hud{margin-left:auto;display:flex;gap:18px;font-weight:800}#world{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#102c32e8;padding:10px 18px;border-radius:30px;pointer-events:none;text-align:center;white-space:nowrap}#touch{position:absolute;bottom:18px;left:18px;display:grid;grid-template-columns:44px 44px 44px;gap:4px}#touch button,#action{background:#fffde8e8;color:#173b40;border-radius:12px;font-weight:900;min-height:44px;touch-action:none}#action{position:absolute;right:18px;bottom:18px;padding:14px 22px;border-bottom:4px solid #b7934b}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b24288c;padding:18px}#card{background:#fffbea;color:#19383c;border:4px solid #163d42;border-radius:24px;box-shadow:0 12px 0 #09222666;padding:28px;width:min(560px,100%);max-height:95%;overflow:auto}h1{font-size:34px;margin:0 0 12px}h2{font-size:23px;line-height:1.3}p{line-height:1.5}.primary{background:#f2bc49;color:#253c37;padding:14px 22px;border-radius:12px;font-weight:850;border-bottom:4px solid #cb8c22;width:100%}.avatars{display:flex;gap:12px;margin:20px 0}.avatar{font-size:30px;padding:12px;border:3px solid transparent;border-radius:15px;background:#e1ece2}.avatar.selected{border-color:#2c8b8c;background:#b9e4d7}.answers{display:grid;gap:10px}.answers button{padding:13px;text-align:left;border:2px solid #c2cdbb;background:white;border-radius:12px;color:#173b40}.answers button:focus{outline:3px solid #dd9c28}.answers .correct{background:#bce8c2;border-color:#34895e}.answers .wrong{background:#f6c5b9;border-color:#b7634b}.small{font-size:14px;color:#50706c}#feedback{min-height:42px;font-weight:750;margin-top:12px}#bar{height:8px;background:#dce4ce;border-radius:8px;overflow:hidden}#bar i{display:block;height:100%;background:#398e7d}@media(max-width:650px){header{padding:8px;gap:8px}header strong{font-size:16px}#hud{gap:10px;font-size:14px}#hint{bottom:125px;font-size:14px;white-space:normal;width:85%}#card{padding:18px}h1{font-size:27px}}
</style><div id="app"><header><strong>Treasure Garden</strong><div id="hud"><span>⚡ <b id="juice">0</b></span><span>◆ <b id="score">0</b></span><span>◷ <b id="clock">2:00</b></span></div><button id="full" aria-label="Fullscreen">⛶</button></header><div id="world"><canvas id="canvas"></canvas><div id="hint"></div><div id="touch"><div></div><button data-dir="up">▲</button><div></div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button id="action">Interact / dig</button><div id="overlay"><div id="card"></div></div></div></div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),card=document.querySelector('#card'),overlay=document.querySelector('#overlay');
const questions=[['What event triggered the July Crisis in 1914?',['Assassination of Archduke Franz Ferdinand','Sinking of the Lusitania','Signing of the Treaty of Versailles','Russian Revolution'],0],['What does militarism mean?',['Building military strength and emphasizing military power','Avoiding international alliances','Granting colonies independence','Ending all military spending'],0],['Which countries formed the Triple Entente before WWI?',['Britain, France, and Russia','Germany, Austria-Hungary, and Italy','Britain, Germany, and Russia','France, Italy, and the Ottoman Empire'],0],['Why did trenches become common on the Western Front?',['Strong defenses made advances difficult','Armies had no rifles','All fighting happened at sea','Both sides agreed to stop fighting'],0],['Which region was known as Europe’s powder keg?',['The Balkans','Scandinavia','The Iberian Peninsula','The British Isles'],0],['Why did the United States enter WWI in 1917?',['German submarine warfare and the Zimmermann Telegram helped shift opinion','Germany invaded the United States','The Treaty of Versailles required it','Russia asked the United States to join the Central Powers'],0],['What was the Zimmermann Telegram?',['A German proposal for an alliance with Mexico against the United States','An agreement ending the war','A message announcing the assassination','A British declaration of war on France'],0],['What was the purpose of propaganda during WWI?',['Influence public opinion and support for the war','Guarantee neutral reporting','Replace military supplies','End conscription everywhere'],0],['What happened on November 11, 1918?',['An armistice ended fighting on the Western Front','The United States entered the war','The Treaty of Versailles was signed','The war began'],0],['What organization did Woodrow Wilson support to promote peace?',['The League of Nations','The European Union','NATO','The Warsaw Pact'],0],['Which country left the war after its 1917 revolutions?',['Russia','France','Britain','United States'],0],['What was total war?',['Mobilizing society and the economy for the war effort','Fighting only with professional soldiers','Avoiding civilian economic involvement','Limiting fighting to a single battle'],0],['Which weapon threatened merchant ships in the Atlantic?',['German U-boats','Tanks','Zeppelins only','Trench mortars'],0],['What was the Treaty of Versailles?',['The 1919 peace treaty with Germany','An alliance signed before WWI','An agreement between Russia and Japan','A plan for the invasion of Belgium'],0],['Which country did Germany invade in 1914 on its way toward France?',['Belgium','Spain','Sweden','Portugal'],0]];
let seed=7;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const W=1000,H=680,colors=['#54c4dc','#e97f74','#b38ade'];let avatar=0,player={x:500,y:550},keys={},state='start',juice=0,score=0,end=0,last=0,round=[],qi=0,right=0,activeChest=null,answered=0,correctTotal=0,dug=0,found=0,particles=[],toast='',toastUntil=0;
const plots=[];for(let y=0;y<4;y++)for(let x=0;x<7;x++)plots.push({x:260+x*72,y:202+y*74,ready:0});const chestSpots=[{x:165,y:225},{x:825,y:245},{x:520,y:535},{x:185,y:460},{x:835,y:490},{x:500,y:125},{x:350,y:540},{x:685,y:125}];let chests=[0,1,2].map((s,id)=>({...chestSpots[s],slot:s,id}));let trees=[{x:100,y:145,s:1.1},{x:890,y:130,s:1.25},{x:100,y:355,s:.9},{x:902,y:385,s:1},{x:115,y:600,s:.85},{x:875,y:600,s:1.1}];const flecks=Array.from({length:1600},()=>({x:rand()*W,y:rand()*H,r:rand()*2+.5}));
function say(t){toast=t;toastUntil=performance.now()+2300}function hud(){document.querySelector('#juice').textContent=juice;document.querySelector('#score').textContent=score;const sec=Math.max(0,Math.ceil((end-performance.now())/1000));document.querySelector('#clock').textContent=state==='start'?'2:00':Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function startScreen(){card.innerHTML='<div class="small">TEACH ARCADE • PLAYABLE EXPERIMENT</div><h1>A little digging.<br>A lot of discovery.</h1><p>Open chests. Answer five WWI questions to earn juice. Spend it digging for jewels before two minutes run out.</p><div class="avatars">'+colors.map((c,i)=>'<button class="avatar '+(i===avatar?'selected':'')+'" data-avatar="'+i+'" style="color:'+c+'">●</button>').join('')+'</div><p class="small">Move: WASD / arrows or touch buttons<br>Open / dig: E / Space or the action button<br>Each correct answer earns 12 juice. Each dig costs 4.<br>The timer keeps running during questions.</p><button class="primary" id="start">Play for 2 minutes</button>';card.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{avatar=+b.dataset.avatar;startScreen()});card.querySelector('#start').onclick=()=>{state='play';end=performance.now()+120000;overlay.style.display='none';last=performance.now()}}
function nearChest(){return chests.find(c=>Math.hypot(c.x-player.x,c.y-player.y)<65)}function nearPlot(){return plots.filter(p=>Math.hypot(p.x-player.x,p.y-player.y)<43).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0]}
function interact(){if(state!=='play')return;const c=nearChest();if(c){activeChest=c;round=[...questions].sort(()=>Math.random()-.5).slice(0,5);qi=0;right=0;state='quiz';keys={};overlay.style.display='flex';showQuestion();return}const p=nearPlot();if(!p){say('Step onto a soil patch to dig.');return}if(p.ready>performance.now()){say('This patch is growing back. Try another.');return}if(juice<4){say('Find a chest to earn more juice!');return}juice-=4;dug++;p.ready=performance.now()+6500;let roll=Math.random(),gem=roll<.035?{name:'Diamond',value:100,color:'#b3f6ff'}:roll<.13?{name:'Ruby',value:40,color:'#ff5e80'}:roll<.3?{name:'Emerald',value:20,color:'#5aeead'}:roll<.6?{name:'Amethyst',value:10,color:'#c997ff'}:null;p.gem=gem;if(gem){found++;score+=gem.value;say(gem.name+'! +'+gem.value+' treasure');for(let i=0;i<15;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*90,vy:-Math.random()*100-30,life:1,color:gem.color})}else say('Empty this time. Keep exploring!');hud()}
function showQuestion(){const q=round[qi],options=q[1].map((text,i)=>({text,correct:i===q[2]})).sort(()=>Math.random()-.5);card.innerHTML='<div class="small">WWI CHEST • QUESTION '+(qi+1)+' OF 5</div><div id="bar"><i style="width:'+qi*20+'%"></i></div><h2>'+q[0]+'</h2><div class="answers">'+options.map((o,i)=>'<button data-choice="'+i+'">'+(i+1)+'. '+o.text+'</button>').join('')+'</div><div id="feedback">'+right+' correct • '+right*12+' juice earned</div>';const buttons=[...card.querySelectorAll('[data-choice]')];buttons.forEach((b,i)=>b.onclick=()=>{if(buttons.some(b=>b.disabled))return;answered++;if(options[i].correct){right++;correctTotal++;juice+=12}buttons.forEach((b,j)=>{b.disabled=true;if(options[j].correct)b.classList.add('correct')});if(!options[i].correct)b.classList.add('wrong');document.querySelector('#feedback').textContent=options[i].correct?'Correct! +12 juice':'Correct answer: '+options.find(o=>o.correct).text;const next=document.createElement('button');next.className='primary';next.textContent=qi===4?'Collect & return to map':'Next question';next.onclick=()=>{if(state!=='quiz')return;qi++;if(qi<5)showQuestion();else{const free=chestSpots.map((p,i)=>i).filter(i=>!chests.some(c=>c.slot===i));const slot=free[Math.floor(Math.random()*free.length)];Object.assign(activeChest,chestSpots[slot],{slot});state='play';overlay.style.display='none';say(right*12+' juice earned. A new chest appeared!')}};card.append(next);next.focus();hud()});buttons[0].focus()}
function finish(){state='end';keys={};overlay.style.display='flex';card.innerHTML='<div class="small">EXPEDITION COMPLETE</div><h1>'+score+' treasure points</h1><p>'+found+' jewels discovered · '+dug+' patches dug<br>'+correctTotal+' / '+answered+' questions correct<br>'+juice+' juice remaining</p><p class="small">Amethyst 10 · Emerald 20 · Ruby 40 · Diamond 100</p><button class="primary" id="again">Play again</button>';card.querySelector('#again').onclick=()=>location.reload()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function shape(x,y,w,h,r,fill,stroke='#493d2e',lw=3){ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();if(stroke)ctx.stroke()}
function tree(t){const{x,y,s}=t;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,15,44,16,'#223d3440');shape(-10,-45,20,55,5,'#966447');shape(-7,-40,5,48,3,'#bb8858',null);ellipse(-24,-57,30,32,'#245c50');ellipse(26,-60,31,34,'#245c50');ellipse(0,-83,40,37,'#2b7560');ellipse(-14,-92,24,23,'#3c9570');ellipse(20,-77,25,23,'#398b65');ellipse(-23,-50,22,17,'#30765a');ctx.restore()}
function chest(c,t){ellipse(c.x,c.y+19,31,10,'#46352730');ctx.save();ctx.translate(c.x,c.y+Math.sin(t/400+c.id)*2);shape(-25,-10,50,32,5,'#a76a32');shape(-26,-22,52,25,8,'#db9b42');shape(-19,-20,7,39,2,'#f7d576');shape(12,-20,7,39,2,'#f7d576');shape(-6,-4,12,15,2,'#f9dc82');ellipse(0,2,2,3,'#544331');ctx.fillStyle='#fff0b5';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('?',0,-32);ctx.restore()}
function drawPlayer(t){const{x,y}=player;const moving=Object.values(keys).some(Boolean)&&state==='play',bob=moving?Math.sin(t/75)*2:Math.sin(t/400);ellipse(x,y+17,22,8,'#23382c45');ctx.save();ctx.translate(x,y+bob);shape(-16,3,13,19,5,'#254b63');shape(3,3,13,19,5,'#254b63');shape(-22,-21,44,34,15,colors[avatar],'#193c48',3);ellipse(-23,-4,7,9,colors[avatar]);ellipse(23,-4,7,9,colors[avatar]);shape(-23,-44,46,34,15,'#ffe1a6','#193c48',3);shape(-29,-48,58,13,6,'#f1c44c','#463d2e',3);ellipse(0,-49,22,14,'#f1c44c');shape(-7,-59,14,16,3,'#fff0a2','#9d7831',2);ellipse(-9,-28,2.5,4,'#263d44');ellipse(9,-28,2.5,4,'#263d44');ctx.strokeStyle='#ad754e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-24,6,0,Math.PI);ctx.stroke();ctx.restore()}
function draw(t){const dpr=Math.min(devicePixelRatio,2),vw=canvas.clientWidth,vh=canvas.clientHeight;if(canvas.width!==vw*dpr||canvas.height!==vh*dpr){canvas.width=vw*dpr;canvas.height=vh*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#143c40';ctx.fillRect(0,0,vw,vh);const scale=Math.min(vw/W,vh/H);ctx.translate((vw-W*scale)/2,(vh-H*scale)/2);ctx.scale(scale,scale);shape(10,10,980,660,44,'#84ab64','#244d42',8);shape(28,28,944,624,38,'#a8c879',null);shape(145,90,714,530,70,'#d8bb78','#ad985e',5);for(const f of flecks){ctx.fillStyle=f.x>145&&f.x<859&&f.y>90&&f.y<620?'#a2824330':'#54835435';ctx.fillRect(f.x,f.y,f.r*2,f.r)}shape(215,150,572,340,35,'#826443','#6b5238',5);shape(227,162,548,315,28,'#94704b',null);for(const p of plots){const open=p.ready>t;shape(p.x-29,p.y-29,58,58,15,open?'#674c33':'#b08a5c','#80623e',2);if(open){ellipse(p.x,p.y,19,13,'#382f29');ellipse(p.x,p.y+4,16,8,'#46382b');if(p.gem){const k=1+Math.sin(t/180)*.06;ctx.save();ctx.translate(p.x,p.y-6);ctx.scale(k,k);ctx.fillStyle=p.gem.color;ctx.strokeStyle='#fff8da';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(13,-4);ctx.lineTo(0,13);ctx.lineTo(-13,-4);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-13,-4);ctx.lineTo(13,-4);ctx.moveTo(0,-15);ctx.lineTo(0,13);ctx.stroke();ctx.restore()}ctx.fillStyle='#d9bc74';ctx.fillRect(p.x-18,p.y+23,36*Math.max(0,1-(p.ready-t)/6500),3)}else{ellipse(p.x,p.y,11,8,'#7a7c46');ctx.strokeStyle='#899953';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y+3);ctx.lineTo(p.x+3,p.y-7);ctx.stroke();for(let j=0;j<5;j++){ctx.fillStyle='#c5a170';ctx.fillRect(p.x-22+j*10,p.y-21+(j%2)*4,3,2)}}}ctx.fillStyle='#f5e4b0';ctx.font='bold 18px system-ui';ctx.textAlign='center';shape(387,46,226,38,9,'#315e50','#214236',3);ctx.fillStyle='#f5e4b0';ctx.fillText('THE TREASURE GARDEN',500,72);const objects=[...trees.map(o=>({y:o.y,fn:()=>tree(o)})),...chests.map(o=>({y:o.y,fn:()=>chest(o,t)})),{y:player.y,fn:()=>drawPlayer(t)}];objects.sort((a,b)=>a.y-b.y).forEach(o=>o.fn());for(const p of particles){ellipse(p.x,p.y,3,3,p.color)}if(state==='play'){const p=nearPlot();if(p){ctx.strokeStyle='#fff3b0';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(p.x-32,p.y-32,64,64,16);ctx.stroke()}}}
function tick(t){const dt=Math.min((t-last)/1000,.04);last=t;if((state==='play'||state==='quiz')&&t>=end)finish();if(state==='play'){let dx=(keys.right||keys.d||keys.arrowright?1:0)-(keys.left||keys.a||keys.arrowleft?1:0),dy=(keys.down||keys.s||keys.arrowdown?1:0)-(keys.up||keys.w||keys.arrowup?1:0);const len=Math.hypot(dx,dy)||1;player.x=Math.max(145,Math.min(860,player.x+dx/len*185*dt));player.y=Math.max(110,Math.min(590,player.y+dy/len*185*dt));const c=nearChest(),p=nearPlot();document.querySelector('#hint').textContent=t<toastUntil?toast:c?'E / Space · Open question chest':p?p.ready>t?'Ground restoring…':juice>=4?'E / Space · Dig (4 juice)':'Find a chest to earn juice':'Explore the garden · Find a chest or a soil patch';document.querySelector('#action').textContent=c?'Open chest':'Dig · 4 juice'}particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=110*dt;p.life-=dt;return p.life>0});draw(t);hud();requestAnimationFrame(tick)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','e'].includes(k))e.preventDefault();if(state==='quiz'){if(/^[1-4]$/.test(k))card.querySelectorAll('[data-choice]')[+k-1]?.click();return}keys[k]=true;if(!e.repeat&&(k==='e'||k===' '))interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.dir]=true};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.dir]=false});document.querySelector('#action').onclick=interact;document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.querySelector('#app').requestFullscreen?.()};startScreen();requestAnimationFrame(tick);
</script></html>
