<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Classroom Review Maze | Teach Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* --------------------------------------------------
   GLOBAL LAYOUT & THEME
-------------------------------------------------- */
:root {
  --bg-dark: #020617;
  --bg-mid: #111827;
  --text-light: #e5e7eb;
  --text-dim: #9ca3af;
  --accent-blue: #22d3ee;
  --accent-cyan: #38bdf8;
  --accent-green: #10b981;
  --accent-orange: #f97316;
  --accent-red: #f97373;
}

body {
  background: radial-gradient(circle at top, #111827 0, var(--bg-dark) 55%);
  color: var(--text-light);
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0;
  padding: 16px 8px 24px;
  text-align: center;
}

h1 {
  margin-top: 6px;
  font-size: 24px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent-cyan);
}

h1 span {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  letter-spacing: .15em;
  color: var(--text-dim);
}

/* --------------------------------------------------
   GAME CONTAINER
-------------------------------------------------- */
#gameContainer {
  position: relative;
  width: 560px;
  max-width: 100vw;
  height: 560px;
  background: var(--bg-dark);
  border-radius: 16px;
  border: 3px solid var(--accent-blue);
  margin-top: 14px;
  box-shadow: 0 18px 40px rgba(0,0,0,.8);
  overflow: hidden;
}

canvas {
  background: var(--bg-dark);
  width: 100%;
  height: 100%;
  display: block;
}

/* --------------------------------------------------
   HUD
-------------------------------------------------- */
#score {
  margin-top: 10px;
  font-size: 16px;
}

#score span {
  color: var(--accent-blue);
  font-weight: 600;
}

#hint {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-dim);
}

#feedback {
  margin-top: 4px;
  font-size: 13px;
  min-height: 1.4em;
}

#feedback.correct {
  color: var(--accent-green);
}

#feedback.incorrect {
  color: var(--accent-orange);
}

#winMessage {
  margin-top: 10px;
  font-size: 18px;
  color: #a7f3d0;
  display: none;
}

/* --------------------------------------------------
   QUIZ POPUP
-------------------------------------------------- */
#questionBox {
  position: absolute;
  width: 82%;
  max-width: 420px;
  min-height: 170px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-dark);
  border-radius: 12px;
  border: 1px solid #4b5563;
  padding: 14px;
  display: none;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 16px 32px rgba(0,0,0,.85);
}

#questionTitle {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--accent-blue);
}

#questionText {
  margin: 6px 0 10px 0;
  font-size: 14px;
}

/* Answer buttons */
#questionBox button {
  margin: 3px 0;
  padding: 7px 10px;
  border-radius: 999px;
  background: #0f172a;
  border: 1px solid #4b5563;
  color: var(--text-light);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: background .08s, border-color .08s, transform .08s;
}

#questionBox button:hover {
  background: #1e293b;
  border-color: var(--accent-blue);
  transform: translateY(-1px);
}

#questionNote {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-dim);
}

/* --------------------------------------------------
   TOUCH CONTROLS (iPad / mobile)
-------------------------------------------------- */
#controls {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  touch-action: manipulation;
}

.control-row {
  display: flex;
  gap: 8px;
}

.control-btn {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  border: 1px solid #4b5563;
  background: #020617;
  color: var(--text-light);
  font-size: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(0,0,0,.6);
  transition: background .1s, border-color .1s, transform .06s, box-shadow .06s;
}

.control-btn:active {
  background: #1e293b;
  border-color: var(--accent-blue);
  transform: translateY(1px);
  box-shadow: 0 2px 6px rgba(0,0,0,.6);
}

#controls-label {
  font-size: 11px;
  color: var(--text-dim);
}

/* Mobile square container */
@media (max-width: 640px) {
  #gameContainer { aspect-ratio: 1; height: auto; }
}
</style>
</head>

<body>
<h1>
  Classroom Review Maze
  <span>Science · Teach Arcade</span>
</h1>

<!-- GAME WRAPPER -->
<div id="gameContainer">
  <canvas id="gameCanvas" width="560" height="560"></canvas>

  <!-- QUIZ ORB POPUP -->
  <div id="questionBox">
    <div id="questionTitle">Quiz Orb · Science</div>
    <div id="questionText"></div>
    <button id="ans0"></button>
    <button id="ans1"></button>
    <button id="ans2"></button>
    <div id="questionNote">Tap the best answer. Correct = Power Mode + bonus points.</div>
  </div>
</div>

<div id="score">Score: <span id="scoreValue">0</span></div>
<div id="hint">Use arrow keys or tap the controls. Collect dots, hit Quiz Orbs, and tag squirrels in Power Mode.</div>
<div id="feedback"></div>
<div id="winMessage">🎉 You cleared all 10 Quiz Orbs! 🎉</div>

<!-- TOUCH / IPAD CONTROLS -->
<div id="controls">
  <div class="control-row">
    <button class="control-btn" data-dir="up">▲</button>
  </div>
  <div class="control-row">
    <button class="control-btn" data-dir="left">◀</button>
    <button class="control-btn" data-dir="down">▼</button>
    <button class="control-btn" data-dir="right">▶</button>
  </div>
  <div id="controls-label">Tap to move (iPad / touch friendly)</div>
</div>

<script>
/* --------------------------------------------------
   CONSTANTS & DOM CACHING
-------------------------------------------------- */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("scoreValue");
const questionBox = document.getElementById("questionBox");
const questionText = document.getElementById("questionText");
const ansBtns = [...Array(3)].map((_, i) => document.getElementById("ans" + i));
const winMessage = document.getElementById("winMessage");
const feedbackEl = document.getElementById("feedback");

const controls = document.getElementById("controls");
const controlButtons = controls.querySelectorAll(".control-btn");

const TILE = 40;

// Movement timing
const GHOST_STEP_DELAY = 16;   // squirrels
const PLAYER_STEP_DELAY = 6;   // student

/* --------------------------------------------------
   STATE
-------------------------------------------------- */
let score = 0;
let powerMode = false;
let powerTimer = 0;
let quizIndex = -1;
let quizAnswered = 0;

/* Player */
const player = { x: 1, y: 1, dx: 0, dy: 0 };
let playerStepCounter = 0;

/* Squirrels */
const ghosts = [
  { x: 12, y: 12, color: "#f97316" },
  { x: 12, y:  1, color: "#a855f7" },
  { x:  1, y: 12, color: "#22c55e" }
];

let ghostCounter = 0;

/* --------------------------------------------------
   MAZE LAYOUT
-------------------------------------------------- */
let maze = [
  "##############",
  "#o..........o#",
  "#.####..####.#",
  "#o....##....o#",
  "#.####..####.#",
  "#............#",
  "#.####.####..#",
  "#o....##....o#",
  "#.####..####.#",
  "#............#",
  "#o....##....o#",
  "#.####..####.#",
  "#o..........o#",
  "##############"
];

/* --------------------------------------------------
   QUESTIONS
-------------------------------------------------- */
const questions = [
  { q:"What is the first step of the scientific method?", a:["Analyze data","Ask a question","Form a conclusion"], correct:1 },
  { q:"A testable explanation for an observation is called a:", a:["Law","Hypothesis","Theory"], correct:1 },
  { q:"Which tool measures liquid volume?", a:["Graduated cylinder","Thermometer","Triple-beam balance"], correct:0 },
  { q:"What is the basic unit of life?", a:["Atom","Cell","Molecule"], correct:1 },
  { q:"Which state of matter has definite shape + volume?", a:["Solid","Liquid","Gas"], correct:0 },
  { q:"What gas do plants take in during photosynthesis?", a:["Oxygen","Carbon dioxide","Nitrogen"], correct:1 },
  { q:"The variable you change on purpose is the:", a:["Independent","Dependent","Controlled"], correct:0 },
  { q:"How many planets are in our solar system?", a:["7","8","9"], correct:1 },
  { q:"What force pulls objects toward Earth?", a:["Magnetism","Friction","Gravity"], correct:2 },
  { q:"Which part of a cell contains DNA?", a:["Membrane","Nucleus","Cytoplasm"], correct:1 }
];

/* --------------------------------------------------
   INPUT (KEYBOARD + TOUCH)
-------------------------------------------------- */
function setDirection(dir) {
  if (questionBox.style.display === "flex") return;
  switch (dir) {
    case "up":    player.dx = 0;  player.dy = -1; break;
    case "down":  player.dx = 0;  player.dy = 1;  break;
    case "left":  player.dx = -1; player.dy = 0;  break;
    case "right": player.dx = 1;  player.dy = 0;  break;
  }
}

document.addEventListener("keydown", e => {
  if (questionBox.style.display === "flex") return;
  if (e.key === "ArrowUp")    setDirection("up");
  if (e.key === "ArrowDown")  setDirection("down");
  if (e.key === "ArrowLeft")  setDirection("left");
  if (e.key === "ArrowRight") setDirection("right");
});

// Touch / click controls
controlButtons.forEach(btn => {
  const dir = btn.getAttribute("data-dir");
  btn.addEventListener("click", () => setDirection(dir));
  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    setDirection(dir);
  }, { passive: false });
});

/* --------------------------------------------------
   LOGIC HELPERS
-------------------------------------------------- */
// IMPORTANT: only walls (#) block movement.
// Dots (.) and Quiz Orbs (o) are passable for squirrels and player.
function isWall(x, y) {
  if (y < 0 || y >= maze.length) return true;
  const row = maze[y];
  if (x < 0 || x >= row.length) return true;
  return row[x] === "#";
}

function replaceChar(str, i, chr) {
  return str.slice(0,i) + chr + str.slice(i+1);
}

function clearFeedback() {
  feedbackEl.textContent = "";
  feedbackEl.classList.remove("correct", "incorrect");
}

function showQuestion() {
  quizIndex = quizAnswered;
  const q = questions[quizIndex];

  questionText.textContent = q.q;
  ansBtns.forEach((btn, i) =>
    btn.textContent = `${String.fromCharCode(65+i)}. ${q.a[i]}`
  );

  questionBox.style.display = "flex";
  player.dx = player.dy = 0; // freeze
}

// When student answers, show clear feedback, then resume game.
function answer(choice) {
  const q = questions[quizIndex];
  const correct = (choice === q.correct);

  if (correct) {
    score += 150;
    powerMode = true;
    powerTimer = 320;
    feedbackEl.textContent = "✅ Correct! Power Mode activated.";
    feedbackEl.classList.remove("incorrect");
    feedbackEl.classList.add("correct");
  } else {
    feedbackEl.textContent = "➜ Not quite. Keep exploring and try the next one!";
    feedbackEl.classList.remove("correct");
    feedbackEl.classList.add("incorrect");
  }

  quizAnswered++;
  // Hide the question box after a short delay so they can see feedback.
  setTimeout(() => {
    questionBox.style.display = "none";
  }, 450);
}

ansBtns.forEach((btn,i)=>btn.onclick=()=>answer(i));

/* --------------------------------------------------
   GAME LOOP
-------------------------------------------------- */
function update() {

  /* Pause movement while question is open */
  if (questionBox.style.display === "flex") {
    requestAnimationFrame(update);
    return;
  }

  /* Player movement (slowed with step delay) */
  playerStepCounter++;
  const movePlayer = playerStepCounter % PLAYER_STEP_DELAY === 0;

  if (movePlayer) {
    const nx = player.x + player.dx;
    const ny = player.y + player.dy;
    if (!isWall(nx, ny)) {
      player.x = nx;
      player.y = ny;
    }
  }

  const tile = maze[player.y][player.x];

  /* Eat dots */
  if (tile === ".") {
    score += 10;
    maze[player.y] = replaceChar(maze[player.y], player.x, " ");
  }

  /* Quiz Orb */
  if (tile === "o") {
    score += 25;
    maze[player.y] = replaceChar(maze[player.y], player.x, " ");
    clearFeedback();
    showQuestion();
  }

  /* Ghost (squirrel) movement */
  ghostCounter++;
  const moveGhosts = ghostCounter % GHOST_STEP_DELAY === 0;

  for (const g of ghosts) {
    if (moveGhosts) {
      const dirs = [
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
      ];
      const d = dirs[Math.floor(Math.random()*dirs.length)];
      const gx = g.x + d.x;
      const gy = g.y + d.y;

      // Squirrels can move over '.', 'o', and ' ' — only walls block them.
      if (!isWall(gx, gy)) {
        g.x = gx;
        g.y = gy;
      }
    }

    /* Player collision */
    if (g.x === player.x && g.y === player.y) {
      if (powerMode) {
        score += 150;
        g.x = 12; g.y = 12;
      } else {
        score = Math.max(0, score - 25);
      }
    }
  }

  /* Power mode timer */
  if (powerMode && --powerTimer <= 0) powerMode = false;

  /* Win condition */
  if (quizAnswered >= 10) winMessage.style.display = "block";

  scoreEl.textContent = score;

  draw();
  requestAnimationFrame(update);
}

/* --------------------------------------------------
   RENDERING
-------------------------------------------------- */
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* Maze tiles */
  for (let y=0; y<maze.length; y++) {
    for (let x=0; x<maze[y].length; x++) {
      const tile = maze[y][x];
      const px = x*TILE, py = y*TILE;

      if (tile === "#") {
        ctx.fillStyle = "#111827";
        ctx.fillRect(px,py,TILE,TILE);
        ctx.strokeStyle = "rgba(34,211,238,.45)";
        ctx.lineWidth = 2;
        ctx.strokeRect(px+3, py+3, TILE-6, TILE-6);
      }

      if (tile === ".") {
        ctx.fillStyle = "#f9fafb";
        ctx.beginPath();
        ctx.arc(px+20, py+20, 3, 0, Math.PI*2);
        ctx.fill();
      }

      if (tile === "o") {
        const pulse = 8 + 2*Math.sin(performance.now()/150);
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(px+20, py+20, pulse, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "rgba(34,211,238,.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px+20, py+20, pulse+4, 0, Math.PI*2);
        ctx.stroke();
      }
    }
  }

  /* Player sprite – centered pixel student */
  const cx = player.x*TILE + 20;
  const cy = player.y*TILE + 20;

  // legs
  ctx.fillStyle = "#1f2937"; // dark pants
  ctx.fillRect(cx-6, cy+6, 5, 8);
  ctx.fillRect(cx+1, cy+6, 5, 8);

  // torso
  ctx.fillStyle = "#3b82f6"; // blue shirt
  ctx.fillRect(cx-8, cy-2, 16, 10);

  // backpack
  ctx.fillStyle = "#10b981";
  ctx.fillRect(cx-11, cy-2, 4, 12);

  // head
  ctx.fillStyle = "#facc15"; // neutral skin
  ctx.fillRect(cx-6, cy-12, 12, 8);

  // hair
  ctx.fillStyle = "#111827";
  ctx.fillRect(cx-6, cy-14, 12, 4);

  // eyes
  ctx.fillStyle = "#111827";
  ctx.fillRect(cx-3, cy-10, 2, 2);
  ctx.fillRect(cx+1, cy-10, 2, 2);

  /* Ghosts – pixel squirrels with tiny bob animation */
  const bob = Math.sin(performance.now() / 250) * 1.5;

  for (const g of ghosts) {
    const gx = g.x*TILE + 20;
    const gy = g.y*TILE + 20 + bob; // bobbing

    const body = powerMode ? "#6b7280" : g.color;
    const tail = powerMode ? "#9ca3af" : g.color;

    // tail (to the right)
    ctx.fillStyle = tail;
    ctx.fillRect(gx+4, gy-4, 6, 10);
    ctx.fillRect(gx+2, gy-6, 6, 6);

    // body
    ctx.fillStyle = body;
    ctx.fillRect(gx-8, gy-4, 12, 10);
    ctx.fillRect(gx-8, gy-10, 10, 8);

    // ears
    ctx.fillRect(gx-8, gy-12, 3, 3);
    ctx.fillRect(gx-1, gy-12, 3, 3);

    // paws
    ctx.fillRect(gx-8, gy-2, 3, 4);
    ctx.fillRect(gx-1, gy-2, 3, 4);

    // eyes
    ctx.fillStyle = "#f9fafb";
    ctx.fillRect(gx-6, gy-8, 2, 2);
    ctx.fillRect(gx-2, gy-8, 2, 2);

    ctx.fillStyle = "#111827";
    ctx.fillRect(gx-6, gy-8, 1, 2);
    ctx.fillRect(gx-1, gy-8, 1, 2);
  }

  /* Footer */
  ctx.fillStyle = "rgba(148,163,184,.9)";
  ctx.font = "10px system-ui";
  ctx.fillText("Teach Arcade · Science Maze", 8, canvas.height - 8);
}

/* --------------------------------------------------
   START
-------------------------------------------------- */
update();
</script>
</body>
</html>
