<body>

<h1>WWI Trench Run</h1>
<p>
Run the trenches, dodge pits and rats, and answer <strong>20 randomized World War I questions</strong>.
Covers MAIN causes, trench warfare, alliances, U.S. entry, and peace treaties.
Perfect for classroom review and test prep.
</p>

<div id="gameContainer">
  <canvas id="gameCanvas" width="960" height="360"></canvas>

  <div id="hud">
    <span id="hudScore">Score: 0</span>
    <span id="hudQuestions">Questions: 0 / 20</span>
    <span id="hudStatus">Running</span>
  </div>
</div>

<div id="questionOverlay" class="hidden">
  <div class="panel">
    <h2 id="qText"></h2>
    <div id="choices"></div>
  </div>
</div>

<!-- QUESTIONS FILE -->
<script src="./questions.js"></script>

<script>
/* ===========================
   CANVAS + CORE
=========================== */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const player = { x:80, y:260, w:26, h:36, vx:0, vy:0, onGround:false };
const GRAVITY = 1200;
const SPEED = 260;
const JUMP = 520;
const GROUND_Y = 300;

let cameraX = 0;
let last = 0;
let score = 0;
let answered = 0;
let paused = false;

/* ===========================
   TILE ASSETS
=========================== */
const sky = new Image();
const trenchBack = new Image();
const trenchGround = new Image();

sky.src = "./tiles/sky-480x360.png";
trenchBack.src = "./tiles/trench-back-48.png";
trenchGround.src = "./tiles/trench-ground-48.png";

/* ===========================
   QUESTIONS
=========================== */
const questions = [...window.WWI_QUESTION_BANK].sort(()=>Math.random()-0.5).slice(0,20);
let activeQuestion = null;

/* ===========================
   INPUT
=========================== */
const keys = {};
document.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Space" && player.onGround){
    player.vy=-JUMP;
    player.onGround=false;
  }
});
document.addEventListener("keyup",e=>keys[e.code]=false);

/* ===========================
   LOOP
=========================== */
function update(dt){
  if(paused) return;

  player.vx = keys.ArrowRight?SPEED:keys.ArrowLeft?-SPEED:0;
  player.vy += GRAVITY*dt;

  player.x += player.vx*dt;
  player.y += player.vy*dt;

  if(player.y+player.h>=GROUND_Y){
    player.y=GROUND_Y-player.h;
    player.vy=0;
    player.onGround=true;
  }

  cameraX = Math.max(0, player.x-200);
}

function drawBackground(){
  for(let x=-480;x<canvas.width+480;x+=480){
    ctx.drawImage(sky, x-(cameraX%480), 0);
  }
}

function drawGround(){
  for(let x=-48;x<canvas.width+48;x+=48){
    ctx.drawImage(trenchGround, x-(cameraX%48), GROUND_Y);
  }
}

function drawPlayer(){
  ctx.fillStyle="#f4c542";
  ctx.fillRect(player.x-cameraX, player.y, player.w, player.h);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  drawGround();
  drawPlayer();
}

function loop(t){
  const dt=(t-last)/1000;
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
