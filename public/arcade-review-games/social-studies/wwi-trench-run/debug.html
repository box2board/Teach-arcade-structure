<body>

<canvas id="game" width="960" height="360"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ===== FORCE A DRAW EVERY FRAME ===== */
function loop(){
  ctx.clearRect(0,0,960,360);

  /* SKY */
  ctx.fillStyle = "#3b4c8b";
  ctx.fillRect(0,0,960,360);

  /* GROUND */
  ctx.fillStyle = "#463428";
  ctx.fillRect(0,280,960,80);

  /* PLAYER BOX */
  ctx.fillStyle = "lime";
  ctx.fillRect(120,240,30,40);

  /* DEBUG TEXT */
  ctx.fillStyle = "#fff";
  ctx.font = "16px monospace";
  ctx.fillText("CANVAS ACTIVE", 20, 30);

  requestAnimationFrame(loop);
}
loop();

/* ===== TILE TEST ===== */
const tiles = [
  "/assets/backgrounds/trenchA.png",
  "/assets/backgrounds/trenchB.png",
  "/assets/backgrounds/trenchC.png",
  "/assets/backgrounds/trenchD.png",
  "/assets/backgrounds/trenchE.png"
];

tiles.forEach((src,i)=>{
  const img = new Image();
  img.onload = () => {
    console.log("LOADED:", src);
    ctx.drawImage(img, i*192, 208, 192, 72);
  };
  img.onerror = () => {
    console.error("FAILED:", src);
  };
  img.src = src;
});
</script>

</body>
