<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- ===========================
       SEO-Optimized Title
  ============================ -->
  <title>Teach Arcade · Slope Street Sprint (Algebra Review Game)</title>

  <!-- ===========================
       Meta Description
  ============================ -->
  <meta name="description"
        content="Slope Street Sprint is a free algebra review game from Teach Arcade. Run up and down city slopes, avoid red hazard cones, and pass 20 question gates that review algebraic expressions, equations, and inequalities.">

  <!-- ===========================
       SEO Keywords (lightweight)
  ============================ -->
  <meta name="keywords"
        content="algebra review game, slope street sprint, math arcade game, expressions and equations practice, inequalities review, Teach Arcade games, classroom review">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --sky: #020617;
      --horizon: #020617;
      --ground: #020617;
      --slope-dark: #020617;
      --slope-mid: #0f172a;
      --slope-line: #1f2937;

      --gate-post: #e5e7eb;
      --gate-arch: #22c55e;
      --gate-fill: rgba(34,197,94,0.08);

      --hazard-base: #ef4444;
      --hazard-top: #f97316;
      --hazard-border: #b91c1c;
      --hazard-glow: rgba(248,113,113,0.65);

      --player: #38bdf8;
      --player-accent: #0ea5e9;
      --ui-bg: rgba(0, 0, 0, 0.7);
      --accent: #22c55e;
      --text: #f9fafb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #020617 0%, #000 65%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px;
      gap: 10px;
    }

    h1 {
      font-family: "Press Start 2P", system-ui, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #000;
      text-align: center;
    }

    .subtitle {
      font-size: 0.75rem;
      opacity: 0.9;
      text-align: center;
      max-width: 900px;
    }

    #modeBar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.75rem;
    }

    .pill-btn {
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.6);
      padding: 4px 10px;
      background: rgba(15,23,42,0.85);
      color: var(--text);
      cursor: pointer;
      font-size: 0.7rem;
      font-family: "Press Start 2P", system-ui, sans-serif;
      text-transform: uppercase;
    }

    .pill-btn.active {
      background: var(--accent);
      color: #020617;
    }

    #gameContainer {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      border: 2px solid rgba(148,163,184,0.4);
      background: #000;
    }

    canvas {
      display: block;
      background: var(--sky);
      image-rendering: pixelated;
    }

    #hud {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      background: var(--ui-bg);
      padding: 4px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(148,163,184,0.45);
      font-family: "Press Start 2P", system-ui, sans-serif;
      z-index: 5;
    }

    #hud span {
      white-space: nowrap;
    }

    #questionOverlay,
    #endOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(0,0,0,0.94), rgba(0,0,0,0.98));
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    .panel {
      background: #020617;
      border-radius: 14px;
      padding: 18px 18px 14px;
      max-width: 480px;
      width: 92%;
      border: 2px solid rgba(148,163,184,0.6);
      box-shadow: 0 16px 40px rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .panel h2 {
      font-family: "Press Start 2P", system-ui, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .choice-btn {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      background: #111827;
      color: var(--text);
      transition: background 0.08s, transform 0.08s, box-shadow 0.1s;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .choice-btn:hover {
      background: #1f2937;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.6);
    }

    .choice-btn.correct {
      background: #16a34a !important;
    }

    .choice-btn.wrong {
      background: #b91c1c !important;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .primary-btn {
      border-radius: 999px;
      border: none;
      padding: 6px 12px;
      background: var(--accent);
      color: #020617;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: "Press Start 2P", system-ui, sans-serif;
      text-transform: uppercase;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #touchControls {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      padding: 4px 10px;
      background: var(--ui-bg);
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      backdrop-filter: blur(8px);
      z-index: 6;
    }

    .ctrl-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(148,163,184,0.8);
      background: #020617;
      color: var(--text);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: "Press Start 2P", system-ui, sans-serif;
      transition: transform 0.08s, box-shadow 0.08s, background 0.08s;
    }

    .ctrl-btn:active {
      transform: translateY(1px);
      background: #0b1120;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6) inset;
    }

    @media (min-width: 900px) {
      #touchControls {
        display: none;
      }
    }

    @media (max-width: 900px) {
      canvas {
        width: 100vw;
        height: auto;
      }
      h1 {
        font-size: 0.8rem;
      }
      .subtitle {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <h1>Teach Arcade · Slope Street Sprint</h1>
  <p class="subtitle">
    Run up and down neon city slopes, avoid the red hazard cones, and pass through 20 math gates to
    answer algebra questions. Use ◀ ▶ / ▲ or on-screen buttons to move and jump.
  </p>

  <div id="modeBar">
    <span>Question Mode:</span>
    <button id="modePreloaded" class="pill-btn active">Preloaded Algebra Bank</button>
    <button id="modeCustom" class="pill-btn">Custom (if configured)</button>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="360"></canvas>

    <div id="hud">
      <span id="hudScore">Score: 0</span>
      <span id="hudQuestions">Questions: 0 / 20</span>
      <span id="hudStatus">Status: Running</span>
    </div>

    <div id="touchControls">
      <button id="btnLeft" class="ctrl-btn" aria-label="Move left">◀</button>
      <button id="btnJump" class="ctrl-btn" aria-label="Jump">▲</button>
      <button id="btnRight" class="ctrl-btn" aria-label="Move right">▶</button>
    </div>

    <div id="questionOverlay" class="hidden">
      <div class="panel">
        <h2 id="qTitle">Question</h2>
        <p id="qText"></p>
        <div class="choices" id="choicesContainer"></div>
        <div class="panel-footer">
          <span id="qFeedback"></span>
          <button id="qCloseBtn" class="primary-btn">Resume</button>
        </div>
      </div>
    </div>

    <div id="endOverlay" class="hidden">
      <div class="panel">
        <h2>Level Complete!</h2>
        <p id="endSummary"></p>
        <div class="panel-footer">
          <button id="replayBtn" class="primary-btn">Replay Sprint</button>
          <button id="topicBtn" class="primary-btn">Back to Arcade Hub</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ======================================================
    // CONFIG: CUSTOM QUESTIONS (back burner but wired)
    // ======================================================
    const CUSTOM_QUESTIONS = [];
    let useCustomQuestions = false;

    // ======================================================
    // PRELOADED ALGEBRA QUESTION BANK (20)
    // ======================================================
    const ALGEBRA_QUESTION_BANK = [
      { id: 1, text: "Simplify: 3x + 4x", choices: ["7", "12x", "7x", "x^7"], correctIndex: 2 },
      { id: 2, text: "Simplify: 5a - 2a", choices: ["3a", "7a", "a^3", "5a - 2"], correctIndex: 0 },
      { id: 3, text: "Evaluate: 2x + 5 when x = 3", choices: ["11", "7", "10", "1"], correctIndex: 0 },
      { id: 4, text: "Which is equivalent to 4(x + 2)?", choices: ["4x + 2", "4x + 8", "x + 6", "4x - 8"], correctIndex: 1 },
      { id: 5, text: "Combine like terms: 6y + 2 - 3y", choices: ["3y + 2", "9y + 2", "3y - 2", "6y - 3y - 2"], correctIndex: 0 },
      { id: 6, text: "Solve: x + 7 = 15", choices: ["x = 8", "x = 22", "x = 2", "x = -8"], correctIndex: 0 },
      { id: 7, text: "Solve: 3x = 18", choices: ["x = 6", "x = 15", "x = 21", "x = 3"], correctIndex: 0 },
      { id: 8, text: "Solve: 2x - 4 = 10", choices: ["x = 3", "x = 5", "x = 7", "x = 8"], correctIndex: 2 },
      { id: 9, text: "Solve: x/4 = 3", choices: ["x = 1.33", "x = 7", "x = 12", "x = 4/3"], correctIndex: 2 },
      { id: 10, text: "Which is a solution of x + 3 = 9?", choices: ["x = 3", "x = 6", "x = 9", "x = 12"], correctIndex: 1 },
      { id: 11, text: "Distribute: 5(2x - 1)", choices: ["10x - 5", "7x - 1", "10x - 1", "5x - 2"], correctIndex: 0 },
      { id: 12, text: "Distribute: -3(x + 4)", choices: ["-3x + 12", "-3x - 12", "3x - 12", "3x + 12"], correctIndex: 1 },
      { id: 13, text: "Simplify: 2x + 3x - x", choices: ["4x", "6x", "5x", "x"], correctIndex: 0 },
      { id: 14, text: "Solve: 4x + 2 = 18", choices: ["x = 4", "x = 5", "x = 3", "x = 2"], correctIndex: 0 },
      { id: 15, text: "Solve: 5x - 10 = 15", choices: ["x = 1", "x = 3", "x = 5", "x = 7"], correctIndex: 2 },
      { id: 16, text: "Which inequality matches “x is greater than or equal to 5”?", choices: ["x > 5","x ≥ 5","x ≤ 5","x < 5"], correctIndex: 1 },
      { id: 17, text: "What is the coefficient of x in 9x - 4?", choices: ["9", "x", "-4", "13"], correctIndex: 0 },
      { id: 18, text: "In 5y + 3, the number 3 is the:", choices: ["Coefficient","Variable","Constant","Exponent"], correctIndex: 2 },
      { id: 19, text: "Which expression represents “7 more than a number n”?", choices: ["7 - n","7n","n - 7","n + 7"], correctIndex: 3 },
      { id: 20, text: "Which expression represents “triple a number x”?", choices: ["x + 3","3x","x - 3","x/3"], correctIndex: 1 }
    ];

    function pickRandomQuestions(bank, count = 20) {
      const shuffled = [...bank].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    // ======================================================
    // CORE GAME STATE
    // ======================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WORLD_LENGTH = 22000; // world X length in pixels

    // terrain function (slopes)
    function groundYAt(x) {
      // basic rolling slopes: sine + gentle trend
      const base = 260;
      const wave = Math.sin(x / 800) * 40;
      const small = Math.sin(x / 300) * 15;
      return base + wave + small;
    }

    const player = {
      x: 100,
      y: 200,
      w: 28,
      h: 40,
      vx: 0,
      vy: 0,
      onGround: false
    };

    const GRAVITY = 1300;
    const PLAYER_SPEED = 260;
    const JUMP_STRENGTH = 520;

    let cameraX = 0;
    let lastTime = 0;
    let gamePaused = false;
    let inQuestion = false;
    let levelComplete = false;

    let score = 0;
    let firstTryCorrectCount = 0;
    let questionsAnsweredCount = 0;

    let currentQuestions = [];
    let gates = [];
    let obstacles = [];
    let activeGate = null;

    const keys = { left: false, right: false };
    let hitCooldown = 0;

    let toastText = "";
    let toastTimer = 0;
    let bannerText = "";
    let bannerTimer = 0;

    const endFlagX = WORLD_LENGTH - 300;

    // ======================================================
    // UI ELEMENTS
    // ======================================================
    const hudScore = document.getElementById('hudScore');
    const hudQuestions = document.getElementById('hudQuestions');
    const hudStatus = document.getElementById('hudStatus');

    const qOverlay = document.getElementById('questionOverlay');
    const qTitle = document.getElementById('qTitle');
    const qText = document.getElementById('qText');
    const qChoices = document.getElementById('choicesContainer');
    const qFeedback = document.getElementById('qFeedback');
    const qCloseBtn = document.getElementById('qCloseBtn');

    const endOverlay = document.getElementById('endOverlay');
    const endSummary = document.getElementById('endSummary');
    const replayBtn = document.getElementById('replayBtn');
    const topicBtn = document.getElementById('topicBtn');

    const modePreloadedBtn = document.getElementById('modePreloaded');
    const modeCustomBtn = document.getElementById('modeCustom');

    const leftBtn  = document.getElementById('btnLeft');
    const rightBtn = document.getElementById('btnRight');
    const jumpBtn  = document.getElementById('btnJump');

    // ======================================================
    // FEEDBACK HELPERS
    // ======================================================
    function showToast(text, duration = 1.1) {
      toastText = text;
      toastTimer = duration;
    }

    function showBanner(text, duration = 1.2) {
      bannerText = text;
      bannerTimer = duration;
    }

    // ======================================================
    // JUMP HELPER
    // ======================================================
    function tryJump() {
      if (player.onGround && !gamePaused && !inQuestion && !levelComplete) {
        player.vy = -JUMP_STRENGTH;
        player.onGround = false;
      }
    }

    // ======================================================
    // INPUT HANDLING
    // ======================================================
    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = true;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = true;
      }
      if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
        e.preventDefault();
        tryJump();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = false;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = false;
      }
    });

    function bindControl(btn, onDown, onUp) {
      if (!btn) return;
      const start = (e) => { e.preventDefault(); onDown(); };
      const end = (e) => { e.preventDefault(); onUp(); };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    bindControl(leftBtn, () => { keys.left = true; },  () => { keys.left = false; });
    bindControl(rightBtn, () => { keys.right = true; }, () => { keys.right = false; });

    if (jumpBtn) {
      const pressJump = (e) => {
        e.preventDefault();
        tryJump();
      };
      jumpBtn.addEventListener('touchstart', pressJump, { passive: false });
      jumpBtn.addEventListener('mousedown', pressJump);
    }

    // Mode buttons
    modePreloadedBtn.addEventListener('click', () => {
      useCustomQuestions = false;
      modePreloadedBtn.classList.add('active');
      modeCustomBtn.classList.remove('active');
      startNewRun();
    });

    modeCustomBtn.addEventListener('click', () => {
      useCustomQuestions = CUSTOM_QUESTIONS && CUSTOM_QUESTIONS.length > 0;
      modeCustomBtn.classList.add('active');
      modePreloadedBtn.classList.remove('active');
      startNewRun();
    });

    // ======================================================
    // QUESTION / LEVEL SETUP
    // ======================================================
    function startNewRun() {
      player.x = 100;
      player.y = groundYAt(100) - player.h;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      cameraX = 0;

      score = 0;
      questionsAnsweredCount = 0;
      firstTryCorrectCount = 0;
      levelComplete = false;
      gamePaused = false;
      inQuestion = false;
      hitCooldown = 0;

      toastText = "";
      toastTimer = 0;
      bannerText = "";
      bannerTimer = 0;

      qOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');
      hudStatus.textContent = "Status: Running";

      if (useCustomQuestions && CUSTOM_QUESTIONS.length > 0) {
        currentQuestions = CUSTOM_QUESTIONS.slice(0, 20);
      } else {
        currentQuestions = pickRandomQuestions(ALGEBRA_QUESTION_BANK, 20);
      }

      // Gates spaced along the course
      gates = [];
      const firstGateX = 800;
      const gateSpacing = 900; // distance between gates
      for (let i = 0; i < 20; i++) {
        const gx = firstGateX + i * gateSpacing;
        gates.push({
          id: i + 1,
          qIndex: i,
          x: gx,
          completed: false
        });
      }

      // Obstacles placed BETWEEN gates so they never overlap gates
      obstacles = [];
      for (let i = 0; i < gates.length - 1; i++) {
        const gx = (gates[i].x + gates[i + 1].x) / 2;
        const gy = groundYAt(gx);
        obstacles.push({
          x: gx,
          y: gy,
          w: 36,
          h: 28
        });
      }

      updateHud();
    }

    function openQuestion(gate) {
      if (inQuestion || levelComplete) return;
      inQuestion = true;
      gamePaused = true;
      activeGate = gate;

      const q = currentQuestions[gate.qIndex];
      qTitle.textContent = "Gate " + gate.id;
      qText.textContent = q.text;
      qFeedback.textContent = "";
      qChoices.innerHTML = "";

      q.choices.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = String.fromCharCode(65 + idx) + ") " + choice;
        btn.addEventListener('click', () => handleAnswer(gate, q, idx, btn));
        qChoices.appendChild(btn);
      });

      qOverlay.classList.remove('hidden');
      hudStatus.textContent = "Status: Answering";
    }

    function handleAnswer(gate, question, selectedIndex, btnEl) {
      const isCorrect = selectedIndex === question.correctIndex;
      if (isCorrect) {
        btnEl.classList.add('correct');
        qFeedback.textContent = "Correct!";
        if (!gate.firstMiss) {
          score += 25;
          firstTryCorrectCount++;
          showToast("+25 | First try!");
        } else {
          score += 10;
          showToast("+10 | Got it!");
        }
        gate.completed = true;
        questionsAnsweredCount = gates.filter(g => g.completed).length;
        updateHud();
        showBanner(`Gate ${questionsAnsweredCount} / 20 cleared`);

        setTimeout(() => {
          closeQuestion();
          checkLevelComplete();
        }, 500);
      } else {
        btnEl.classList.add('wrong');
        qFeedback.textContent = "Incorrect. Try again.";
        score -= 10;
        showToast("-10 | Recheck your work");
        gate.firstMiss = true;
        updateHud();
      }
    }

    function closeQuestion() {
      qOverlay.classList.add('hidden');
      inQuestion = false;
      gamePaused = false;
      activeGate = null;
      hudStatus.textContent = "Status: Running";
    }

    qCloseBtn.addEventListener('click', () => {
      if (activeGate && activeGate.completed) {
        closeQuestion();
      } else {
        qFeedback.textContent = "Answer correctly to continue.";
      }
    });

    function checkLevelComplete() {
      if (!levelComplete &&
          questionsAnsweredCount === 20 &&
          player.x + player.w > endFlagX) {
        triggerEndScreen();
      }
    }

    function triggerEndScreen() {
      levelComplete = true;
      gamePaused = true;
      inQuestion = false;
      hudStatus.textContent = "Status: Complete";

      const accuracy = (firstTryCorrectCount / 20) * 100;
      endSummary.textContent =
        `Score: ${score} points | Accuracy: ${firstTryCorrectCount}/20 (${accuracy.toFixed(0)}%)`;
      endOverlay.classList.remove('hidden');
    }

    replayBtn.addEventListener('click', () => {
      startNewRun();
    });

    topicBtn.addEventListener('click', () => {
      window.location.href = "/arcade-review-games/";
    });

    function updateHud() {
      hudScore.textContent = "Score: " + score;
      hudQuestions.textContent = "Gates: " + questionsAnsweredCount + " / 20";
    }

    // ======================================================
    // GAME LOOP & PHYSICS
    // ======================================================
    function update(dt) {
      if (gamePaused) return;

      if (hitCooldown > 0) {
        hitCooldown -= dt;
        if (hitCooldown < 0) hitCooldown = 0;
      }

      if (toastTimer > 0) {
        toastTimer -= dt;
        if (toastTimer < 0) toastTimer = 0;
      }
      if (bannerTimer > 0) {
        bannerTimer -= dt;
        if (bannerTimer < 0) bannerTimer = 0;
      }

      if (keys.left)      player.vx = -PLAYER_SPEED;
      else if (keys.right) player.vx = PLAYER_SPEED;
      else                player.vx = 0;

      player.vy += GRAVITY * dt;

      const prevY = player.y;
      const prevX = player.x;

      player.x += player.vx * dt;
      if (player.x < 0) player.x = 0;
      if (player.x + player.w > WORLD_LENGTH) player.x = WORLD_LENGTH - player.w;

      player.y += player.vy * dt;
      player.onGround = false;

      // Ground collision with slope
      const groundUnder = groundYAt(player.x + player.w / 2);
      if (player.y + player.h >= groundUnder) {
        player.y = groundUnder - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      // Hazard obstacle collisions
      for (const ob of obstacles) {
        const obTop = ob.y - ob.h; // cone height
        const obRect = { x: ob.x - 18, y: obTop, w: ob.w, h: ob.h };
        if (rectIntersect(player, obRect)) {
          if (hitCooldown === 0) {
            hitCooldown = 0.8;
            score -= 15;
            hudStatus.textContent = "Status: Hit a hazard cone (-15)";
            showToast("-15 | Avoid red cones!");
            updateHud();
            // tiny knockback
            player.x = prevX - 10;
          }
        }
      }

      // Gate trigger (open when centered on gate and not completed)
      for (const gate of gates) {
        if (!gate.completed) {
          const dist = Math.abs((player.x + player.w / 2) - gate.x);
          if (dist < 24) {
            openQuestion(gate);
            break;
          }
        }
      }

      // End flag
      if (!levelComplete && player.x + player.w > endFlagX) {
        checkLevelComplete();
      }

      // Camera follows
      const halfCanvas = canvas.width / 2;
      const targetCameraX = player.x + player.w / 2 - halfCanvas;
      const maxCam = WORLD_LENGTH - canvas.width;
      const clampedTarget = Math.max(0, Math.min(targetCameraX, maxCam));
      const SMOOTH = 0.12;
      cameraX += (clampedTarget - cameraX) * SMOOTH;
    }

    function rectIntersect(a, b) {
      return !(
        a.x + a.w <= b.x ||
        a.x >= b.x + b.w ||
        a.y + a.h <= b.y ||
        a.y >= b.y + b.h
      );
    }

    // ======================================================
    // DRAWING
    // ======================================================
    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#020617");
      grad.addColorStop(0.4, "#020617");
      grad.addColorStop(1, "#020617");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // distant skyline blocks
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, canvas.height * 0.45, canvas.width, canvas.height * 0.55);

      ctx.fillStyle = "#0b1120";
      for (let x = -200; x < WORLD_LENGTH + 200; x += 220) {
        const sx = x - cameraX;
        if (sx > canvas.width || sx < -220) continue;
        const bHeight = 70 + (x % 5) * 10;
        ctx.fillRect(sx + 40, canvas.height * 0.45 - bHeight, 60, bHeight);

        // windows
        ctx.fillStyle = "#22c55e";
        for (let wy = canvas.height * 0.45 - bHeight + 10; wy < canvas.height * 0.45 - 10; wy += 12) {
          ctx.fillRect(sx + 46, wy, 6, 4);
          ctx.fillRect(sx + 66, wy, 6, 4);
        }
        ctx.fillStyle = "#0b1120";
      }
    }

    function drawSlopes() {
      ctx.beginPath();
      const startX = cameraX;
      const endX = cameraX + canvas.width;

      const step = 8;
      ctx.moveTo(0, canvas.height);
      for (let sx = 0; sx <= canvas.width + step; sx += step) {
        const worldX = startX + sx;
        const gy = groundYAt(worldX);
        ctx.lineTo(sx, gy);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();

      ctx.fillStyle = "#020617";
      ctx.fill();
      ctx.strokeStyle = "#1f2937";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawGates() {
      ctx.font = "9px 'Press Start 2P', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      gates.forEach(g => {
        const sx = g.x - cameraX;
        if (sx < -40 || sx > canvas.width + 40) return;

        const gy = groundYAt(g.x);

        // posts
        ctx.strokeStyle = g.completed ? "#22c55e" : "#e5e7eb";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(sx - 20, gy);
        ctx.lineTo(sx - 20, gy - 60);
        ctx.moveTo(sx + 20, gy);
        ctx.lineTo(sx + 20, gy - 60);
        ctx.stroke();

        // arch
        ctx.strokeStyle = g.completed ? "#22c55e" : "#22c55e";
        ctx.beginPath();
        ctx.moveTo(sx - 20, gy - 60);
        ctx.quadraticCurveTo(sx, gy - 80, sx + 20, gy - 60);
        ctx.stroke();

        // faint fill zone (for clarity — where question triggers)
        ctx.fillStyle = "rgba(34,197,94,0.08)";
        ctx.fillRect(sx - 20, gy - 60, 40, 60);

        // label
        ctx.fillStyle = g.completed ? "#bbf7d0" : "#22c55e";
        ctx.fillText(g.id, sx, gy - 70);
      });
    }

    function drawObstacles() {
      ctx.font = "8px 'Press Start 2P', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      obstacles.forEach(ob => {
        const sx = ob.x - cameraX;
        if (sx < -60 || sx > canvas.width + 60) return;

        const baseY = groundYAt(ob.x);

        // glow
        ctx.fillStyle = "rgba(248,113,113,0.25)";
        ctx.beginPath();
        ctx.ellipse(sx, baseY - 4, 26, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // cone base
        ctx.fillStyle = "#ef4444";
        ctx.strokeStyle = "#b91c1c";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx - 16, baseY);
        ctx.lineTo(sx + 16, baseY);
        ctx.lineTo(sx, baseY - ob.h);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // top highlight
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.moveTo(sx - 6, baseY - ob.h + 10);
        ctx.lineTo(sx + 6, baseY - ob.h + 10);
        ctx.lineTo(sx, baseY - ob.h + 2);
        ctx.closePath();
        ctx.fill();

        // warning symbol
        ctx.fillStyle = "#111827";
        ctx.fillText("⚠", sx, baseY - ob.h + 14);
      });
    }

    function drawEndFlag() {
      const sx = endFlagX - cameraX;
      const baseY = groundYAt(endFlagX);

      // pole
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx, baseY);
      ctx.lineTo(sx, baseY - 80);
      ctx.stroke();

      // sign
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(sx, baseY - 80, 64, 24);
      ctx.strokeStyle = "#22c55e";
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, baseY - 80, 64, 24);

      ctx.font = "8px 'Press Start 2P', system-ui, sans-serif";
      ctx.fillStyle = "#bbf7d0";
      ctx.textAlign = "center";
      ctx.fillText("FINISH", sx + 32, baseY - 72);
    }

    function drawPlayer() {
      const sx = player.x - cameraX;
      const sy = player.y;

      // legs
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(sx + 4, sy + player.h - 10, 8, 10);
      ctx.fillRect(sx + player.w - 12, sy + player.h - 10, 8, 10);

      // body
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(sx + 4, sy + 10, player.w - 8, 22);

      // backpack / tablet
      ctx.fillStyle = "#0ea5e9";
      ctx.fillRect(sx + player.w - 6, sy + 12, 4, 16);

      // hood
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(sx + 2, sy, player.w - 4, 10);
      ctx.fillStyle = "#16a34a";
      ctx.fillRect(sx + 2, sy + 8, player.w - 4, 2);

      // arms
      ctx.fillStyle = "#0ea5e9";
      ctx.fillRect(sx, sy + 14, 4, 10);
      ctx.fillRect(sx + player.w - 4, sy + 14, 4, 10);

      // eyes
      ctx.fillStyle = "#020617";
      ctx.fillRect(sx + 7, sy + 6, 2, 2);
      ctx.fillRect(sx + 17, sy + 6, 2, 2);
    }

    function drawOverlays() {
      if (bannerTimer > 0 && bannerText) {
        ctx.font = "10px 'Press Start 2P', system-ui, sans-serif";
        ctx.textAlign = "center";
        const w = 340;
        const h = 24;
        const x = canvas.width / 2 - w / 2;
        const y = 34;
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#22c55e";
        ctx.fillText(bannerText, canvas.width / 2, y + 8);
      }

      if (toastTimer > 0 && toastText) {
        ctx.font = "10px 'Press Start 2P', system-ui, sans-serif";
        ctx.textAlign = "center";
        const w = 340;
        const h = 24;
        const x = canvas.width / 2 - w / 2;
        const y = canvas.height - 34;
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#22c55e";
        ctx.fillText(toastText, canvas.width / 2, y + 8);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawSlopes();
      drawGates();
      drawObstacles();
      drawEndFlag();
      drawPlayer();
      drawOverlays();
    }

    function loop(timestamp) {
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    // Start
    startNewRun();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
