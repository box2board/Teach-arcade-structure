<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cross roads and rivers, answer Scientific Method questions, and earn shields in Crossing Quest, a free Teach Arcade review game.">
  <meta name="robots" content="noindex">
  <title>Crossing Quest · Scientific Method · Teach Arcade</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="game.js"></script>
</head>
<body>
  <header class="sitebar"><a href="/" class="brand"><img src="/assets/images/teach-arcade-logo.png" alt="" width="34" height="34">Teach Arcade</a><a href="/arcade-review-games/">All review games</a></header>
  <main id="game-shell">
    <div class="heading"><div><p class="eyebrow">SCIENTIFIC METHOD</p><h1>Crossing Quest</h1></div><div class="actions"><button id="pause" disabled>Pause</button><button id="restart" disabled>Restart</button><button id="fullscreen" aria-label="Toggle full screen">Full screen</button></div></div>
    <div class="dashboard" aria-label="Game status"><div><span class="label">CROSSING</span><strong id="stage">1 / 3</strong></div><div><span class="label">HEARTS</span><strong id="lives">♥ ♥ ♥ ♥</strong></div><div><span class="label">SHIELD</span><strong id="shield">Ready</strong></div><div><span class="label">REVIEW</span><strong id="accuracy">0 / 12</strong></div><button id="slow" disabled><span>Slow time</span><small id="charges">0 charges · Space</small></button></div>
    <div class="playfield"><canvas id="board" width="896" height="576" tabindex="0" aria-label="Crossing game. Use arrow keys or W A S D to move. Reach the island and finish to answer questions. Press Space to slow hazards, and Escape to pause."></canvas><div id="announcement" role="status" aria-live="polite"></div></div>
    <div class="underboard"><p id="route">Cross the road. Stop at the island. Ride the river platforms.</p><p class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> / WASD <span>·</span> <kbd>Space</kbd> slow time</p></div>
    <div class="touch-controls" aria-label="Movement controls"><button data-direction="up" aria-label="Move up">↑</button><div><button data-direction="left" aria-label="Move left">←</button><button data-direction="down" aria-label="Move down">↓</button><button data-direction="right" aria-label="Move right">→</button></div></div>
    <p class="access-note">Questions pause the action. Choose an answer with 1–4 or arrow keys and Enter.</p>
  </main>
  <dialog id="panel" aria-labelledby="panel-title"><div id="panel-content"></div></dialog>
  <noscript>This game needs JavaScript enabled.</noscript>
</body>
</html>
