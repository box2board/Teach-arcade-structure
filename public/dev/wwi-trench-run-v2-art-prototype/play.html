<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WWI Trench Run v2 — Improved Prototype</title>
<link rel="stylesheet" href="play.css">
<style>
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.game{overflow:hidden;isolation:isolate;background:#87939b}
.side-scene{display:block;width:100%;height:100%;object-fit:fill}
</style>
</head>
<body>
<header class="topbar">
  <div><strong>Teach Arcade</strong> · WWI Trench Run v2</div>
  <div class="prototype-badge">PROTOTYPE — live game unchanged</div>
</header>
<main>
  <section class="intro">
    <div><h1>Improved Trench Run Prototype</h1><p>Side-scroll across the trench. Hold ◀ / ▶ to move and jump over hazards.</p></div>
  <div class="actions"><button type="button" id="startBtn">Start Run</button><button type="button" id="pauseBtn" class="secondary">Pause</button></div>
  </section>

  <section class="hud" aria-label="Game status">
    <div>Distance <b id="distance">0</b>m</div>
    <div>Score <b id="score">0</b></div>
    <div>Stamina <b id="stamina">3</b></div>
    <div>Accuracy <b id="accuracy">100%</b></div>
    <div>Streak <b id="streak">0</b></div>
  </section>

  <section id="game" class="game phase-1" aria-label="WWI side-scrolling trench runner prototype">
    <canvas id="scene" class="side-scene" width="960" height="420" aria-label="Side-scrolling illustrated trench game"></canvas>
    <div id="toast" class="toast"></div>
  </section>

  <div class="controls" aria-label="Touch controls">
    <button type="button" id="leftBtn" aria-label="Move left">◀</button><button type="button" id="jumpBtn" aria-label="Jump">JUMP</button><button type="button" id="rightBtn" aria-label="Move right">▶</button>
  </div>
</main>

<div id="questionModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card"><h2>Trench Checkpoint</h2><p id="questionText"></p><div id="choices" class="choices"></div><p id="explanation" class="explanation"></p></div>
</div>
<div id="forkModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card"><h2>Fork in the Trench</h2><p>Choose your next route.</p><div class="fork-grid"><button id="safeFork"><b>Safer Route</b><span>Fewer obstacles · normal scoring</span></button><button id="riskFork"><b>Risk Route</b><span>More obstacles · higher scoring</span></button></div></div>
</div>
<script defer src="play.js"></script>
</body>
</html>
