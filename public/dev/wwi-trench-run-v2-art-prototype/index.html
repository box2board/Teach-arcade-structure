<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WWI Trench Run v2 — Art Prototype</title>
<style>
:root{--ink:#2d2a26;--cream:#efe3c7;--panel:#f8f0df;--slate:#44515c}
*{box-sizing:border-box}body{margin:0;background:#d4c7ad;color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
header{padding:18px 22px;background:var(--slate);color:white}header b{color:#f4c65a}.note{font-size:13px;opacity:.85}
main{max-width:1180px;margin:auto;padding:18px}.scene{position:relative;aspect-ratio:16/7;overflow:hidden;border:6px solid #312d28;border-radius:18px;background:#aebdcc}
.layer{position:absolute;inset:0;width:100%;height:100%}.layer svg{width:100%;height:100%}.asset{position:absolute}.runner{left:23%;bottom:9%;width:15%}.barrier{left:48%;bottom:7%;width:13%}.crater{left:64%;bottom:2%;width:17%}.wire{right:2%;bottom:7%;width:16%}.checkpoint{right:16%;bottom:16%;width:10%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}.card{background:var(--panel);border:2px solid #82745f;border-radius:12px;padding:10px;text-align:center}.card svg{width:100%;aspect-ratio:1;max-height:145px}.card.wide svg{aspect-ratio:4/1}.card code{font-size:11px;word-break:break-all}.group{margin-top:26px}h2{margin:0 0 10px}.hud{position:absolute;left:2%;right:2%;top:3%;display:flex;gap:1.2%;height:12%}.hud svg{height:100%;flex:1}
</style>
</head>
<body>
<header><h1>WWI Trench Run v2 — <b>Art Prototype</b></h1><div class="note">Prototype branch only. The original live game is unchanged.</div></header>
<main>
<h2>Composed scene test</h2>
<div class="scene">
  <svg class="layer" viewBox="0 0 1024 256"><use href="assets/asset-library.svg#bg-sky-clouds"/></svg>
  <svg class="layer" viewBox="0 0 1024 256"><use href="assets/asset-library.svg#bg-distant-battlefield"/></svg>
  <svg class="layer" viewBox="0 0 1024 256"><use href="assets/asset-library.svg#bg-ruined-trees-craters"/></svg>
  <svg class="layer" style="top:28%" viewBox="0 0 1024 256"><use href="assets/asset-library.svg#bg-trench-silhouettes"/></svg>
  <div class="hud">
    <svg viewBox="0 0 256 96"><use href="assets/asset-library.svg#hud-distance"/></svg>
    <svg viewBox="0 0 256 96"><use href="assets/asset-library.svg#hud-score"/></svg>
    <svg viewBox="0 0 256 96"><use href="assets/asset-library.svg#hud-stamina"/></svg>
  </div>
  <svg class="asset runner" viewBox="0 0 256 256"><use href="assets/asset-library.svg#soldier-run-1"/></svg>
  <svg class="asset barrier" viewBox="0 0 256 256"><use href="assets/asset-library.svg#low-barrier"/></svg>
  <svg class="asset crater" viewBox="0 0 256 256"><use href="assets/asset-library.svg#crater-small"/></svg>
  <svg class="asset wire" viewBox="0 0 256 256"><use href="assets/asset-library.svg#barbed-wire"/></svg>
  <svg class="asset checkpoint" viewBox="0 0 256 256"><use href="assets/asset-library.svg#checkpoint-base"/></svg>
</div>
<div id="catalogue"></div>
</main>
<script type="module">
const manifest=await fetch('assets/manifest.json').then(r=>r.json());
const root=document.querySelector('#catalogue');
for(const [group,ids] of Object.entries(manifest.groups)){
  const section=document.createElement('section');section.className='group';section.innerHTML=`<h2>${group.replaceAll('_',' ')}</h2><div class="grid"></div>`;
  const grid=section.querySelector('.grid');
  for(const id of ids){
    const card=document.createElement('div');card.className='card'+(id.startsWith('bg-')?' wide':'');
    const vb=id.startsWith('bg-')?'0 0 1024 256':id.startsWith('hud-')?'0 0 256 96':'0 0 256 256';
    card.innerHTML=`<svg viewBox="${vb}" aria-label="${id}"><use href="assets/asset-library.svg#${id}"/></svg><code>${id}</code>`;
    grid.append(card);
  }root.append(section);
}
</script>
</body></html>
