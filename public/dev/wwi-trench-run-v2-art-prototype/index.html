<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WWI Trench Run v2 — Art Prototype</title>
<style>
:root{--ink:#2d2a26;--cream:#efe3c7;--panel:#f8f0df;--slate:#44515c}
*{box-sizing:border-box}body{margin:0;background:#d4c7ad;color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
header{padding:18px 22px;background:var(--slate);color:white}header b{color:#f4c65a}.note{font-size:13px;opacity:.85}
main{max-width:1180px;margin:auto;padding:18px}.scene{position:relative;aspect-ratio:16/7;overflow:hidden;border:6px solid #312d28;border-radius:18px;background:#aebdcc}
.asset{position:absolute;object-fit:contain}.bg{inset:0;width:100%;height:100%;object-fit:fill}.runner{left:23%;bottom:9%;width:15%}.barrier{left:48%;bottom:7%;width:13%}.crater{left:64%;bottom:2%;width:17%}.wire{right:2%;bottom:7%;width:16%}.checkpoint{right:16%;bottom:16%;width:10%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}.card{background:var(--panel);border:2px solid #82745f;border-radius:12px;padding:10px;text-align:center}.card img{width:100%;aspect-ratio:1;object-fit:contain;max-height:145px}.card.wide img{aspect-ratio:4/1}.card code{font-size:11px;word-break:break-all}.group{margin-top:26px}h2{margin:0 0 10px}.hud{position:absolute;left:2%;right:2%;top:3%;display:flex;gap:1.2%;height:12%}.hud img{height:100%;flex:1;object-fit:contain}.status{margin:12px 0;padding:10px 12px;border-radius:10px;background:#f8f0df;border:2px solid #82745f}
</style>
</head>
<body>
<header><h1>WWI Trench Run v2 — <b>Art Prototype</b></h1><div class="note">Isolated prototype only. The original live game is unchanged.</div></header>
<main>
<div class="status"><strong>Asset mode:</strong> individual game files. This page intentionally does not draw directly from the catalogue sheet or master symbol library.</div>
<h2>Composed scene test</h2>
<div class="scene">
  <img class="asset bg" src="assets/individual/backgrounds/bg-sky-clouds.svg" alt="">
  <img class="asset bg" src="assets/individual/backgrounds/bg-distant-battlefield.svg" alt="">
  <img class="asset bg" src="assets/individual/backgrounds/bg-ruined-trees-craters.svg" alt="">
  <img class="asset bg" style="top:28%" src="assets/individual/backgrounds/bg-trench-silhouettes.svg" alt="">
  <div class="hud">
    <img src="assets/individual/effects-ui/hud-distance.svg" alt="Distance HUD">
    <img src="assets/individual/effects-ui/hud-score.svg" alt="Score HUD">
    <img src="assets/individual/effects-ui/hud-stamina.svg" alt="Stamina HUD">
  </div>
  <img class="asset runner" src="assets/individual/character/soldier-run-1.svg" alt="Running soldier">
  <img class="asset barrier" src="assets/individual/obstacles-props/low-barrier.svg" alt="Low barrier">
  <img class="asset crater" src="assets/individual/obstacles-props/crater-small.svg" alt="Shell crater">
  <img class="asset wire" src="assets/individual/obstacles-props/barbed-wire.svg" alt="Barbed wire">
  <img class="asset checkpoint" src="assets/individual/terrain/checkpoint-base.svg" alt="Checkpoint">
</div>
<div id="catalogue"></div>
</main>
<script type="module">
const manifest=await fetch('assets/manifest.json').then(r=>r.json());
const root=document.querySelector('#catalogue');
for(const [group,ids] of Object.entries(manifest.groups)){
  const section=document.createElement('section');section.className='group';section.innerHTML=`<h2>${group.replaceAll('_',' ')}</h2><div class="grid"></div>`;
  const grid=section.querySelector('.grid');const dir=manifest.directories[group];
  for(const id of ids){
    const card=document.createElement('div');card.className='card'+(id.startsWith('bg-')?' wide':'');
    const path=`assets/${dir}/${id}.svg`;
    card.innerHTML=`<img src="${path}" loading="lazy" alt="${id}"><code>${path}</code>`;
    grid.append(card);
  }root.append(section);
}
</script>
</body></html>
