<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WWI Trench Run v2 — Art Prototype</title>
<style>
:root{--ink:#2d2a26;--cream:#efe3c7;--panel:#f8f0df;--slate:#44515c}
*{box-sizing:border-box}body{margin:0;background:#d4c7ad;color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
header{padding:18px 22px;background:var(--slate);color:white}header b{color:#f4c65a}.note{font-size:13px;opacity:.85}
main{max-width:1180px;margin:auto;padding:18px}.launch{display:inline-block;margin:12px 0 18px;padding:12px 18px;border-radius:10px;background:#e3ad42;color:#211d17;font-weight:800;text-decoration:none}.scene{position:relative;aspect-ratio:16/7;overflow:hidden;border:6px solid #312d28;border-radius:18px;background:#aebdcc}.asset{position:absolute;border:0;pointer-events:none}.bg{inset:0;width:100%;height:100%}.runner{left:23%;bottom:9%;width:15%;height:45%}.barrier{left:48%;bottom:7%;width:13%;height:34%}.crater{left:64%;bottom:2%;width:17%;height:38%}.wire{right:2%;bottom:7%;width:16%;height:38%}.checkpoint{right:16%;bottom:16%;width:10%;height:38%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}.card{background:var(--panel);border:2px solid #82745f;border-radius:12px;padding:10px;text-align:center}.card object{width:100%;height:145px;border:0}.card.wide object{height:90px}.card code{font-size:11px;word-break:break-all}.group{margin-top:26px}h2{margin:0 0 10px}.hud{position:absolute;left:2%;right:2%;top:3%;display:flex;gap:1.2%;height:15%}.hud object{height:100%;flex:1;border:0}.status{margin:12px 0;padding:10px 12px;border-radius:10px;background:#f8f0df;border:2px solid #82745f}
</style>
</head>
<body>
<header><h1>WWI Trench Run v2 — <b>Art Prototype</b></h1><div class="note">Isolated prototype only. The original live game is unchanged.</div></header>
<main>
<div class="status"><strong>Asset mode:</strong> stable individual files. Production art can replace each asset in place without changing gameplay references.</div>
<a class="launch" href="play.html">▶ Play the improved Trench Run prototype</a>
<h2>Composed scene test</h2>
<div class="scene">
  <object class="asset bg" data="assets/individual/backgrounds/bg-sky-clouds.svg" type="image/svg+xml"></object>
  <object class="asset bg" data="assets/individual/backgrounds/bg-distant-battlefield.svg" type="image/svg+xml"></object>
  <object class="asset bg" data="assets/individual/backgrounds/bg-ruined-trees-craters.svg" type="image/svg+xml"></object>
  <object class="asset bg" style="top:28%" data="assets/individual/backgrounds/bg-trench-silhouettes.svg" type="image/svg+xml"></object>
  <div class="hud"><object data="assets/individual/effects-ui/hud-distance.svg" type="image/svg+xml"></object><object data="assets/individual/effects-ui/hud-score.svg" type="image/svg+xml"></object><object data="assets/individual/effects-ui/hud-stamina.svg" type="image/svg+xml"></object></div>
  <object class="asset runner" data="assets/individual/character/soldier-run-1.svg" type="image/svg+xml"></object><object class="asset barrier" data="assets/individual/obstacles-props/low-barrier.svg" type="image/svg+xml"></object><object class="asset crater" data="assets/individual/obstacles-props/crater-small.svg" type="image/svg+xml"></object><object class="asset wire" data="assets/individual/obstacles-props/barbed-wire.svg" type="image/svg+xml"></object><object class="asset checkpoint" data="assets/individual/terrain/checkpoint-base.svg" type="image/svg+xml"></object>
</div>
<div id="catalogue"></div>
</main>
<script type="module">
const manifest=await fetch('assets/manifest.json').then(r=>r.json());const root=document.querySelector('#catalogue');for(const [group,ids] of Object.entries(manifest.groups)){const section=document.createElement('section');section.className='group';section.innerHTML=`<h2>${group.replaceAll('_',' ')}</h2><div class="grid"></div>`;const grid=section.querySelector('.grid');const dir=manifest.directories[group];for(const id of ids){const card=document.createElement('div');card.className='card'+(id.startsWith('bg-')?' wide':'');const path=`assets/${dir}/${id}.svg`;card.innerHTML=`<object data="${path}" type="image/svg+xml" aria-label="${id}"></object><code>${path}</code>`;grid.append(card)}root.append(section)}
</script>
</body></html>
