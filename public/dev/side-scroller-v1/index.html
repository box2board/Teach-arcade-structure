<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Side-Scroller Engine V1 Test | Teach Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#fff;font-family:system-ui;min-height:100vh}.wrap{width:min(100%,1040px);margin:auto;padding:14px}header{display:flex;align-items:end;justify-content:space-between;gap:12px}h1{font-size:1.25rem;margin:.2rem 0}.notice{color:#94a3b8;font-size:.82rem;margin:.2rem 0 10px}.hud{display:flex;gap:10px;justify-content:space-between;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:.88rem}canvas{display:block;width:100%;height:auto;border:2px solid #334155;border-radius:14px;background:#111}.controls{display:flex;justify-content:center;gap:12px;margin-top:12px}.controls button,#question-choices button{font:inherit;font-weight:800;padding:14px 22px;border:0;border-radius:12px}.controls button{touch-action:none;min-width:78px;background:#e2e8f0;color:#0f172a}.theme-switch{display:flex;gap:7px;flex-wrap:wrap}.theme-switch button{border:1px solid #475569;border-radius:999px;padding:8px 12px;background:#0f172a;color:#fff;font-weight:750}.theme-switch button.active{background:#e2e8f0;color:#0f172a}.debug-panel{margin-top:10px;padding:10px 12px;border:1px solid #334155;border-radius:10px;background:#0f172a;font-size:.82rem;color:#cbd5e1}.debug-panel strong{color:#fff}.legend{text-align:center;color:#94a3b8;font-size:.78rem;margin-top:8px}.key{display:inline-block;padding:2px 7px;border-radius:999px;margin:0 3px;font-weight:700}.q{background:#a855f7}.cp{background:#22c55e}.hz{background:#ef4444}dialog{border:0;border-radius:18px;max-width:520px;width:90%;padding:22px;box-shadow:0 24px 70px #0008}#question-choices{display:grid;gap:9px}#question-choices button{text-align:left;background:#e2e8f0}#question-feedback{font-weight:800;min-height:1.4em}#question-modal[hidden]{display:none}@media(max-width:650px){header{display:block}.hud{display:block}.hud span{display:block;margin:3px 0}.wrap{padding:8px}.controls button{padding:16px 18px}}</style></head><body><main class="wrap"><header><div><h1>Teach Arcade · Side-Scroller Engine V1</h1><p class="notice">Same engine. Two completely different theme packages.</p></div><div class="theme-switch"><button id="wwi-theme">WWI Frontline</button><button id="egypt-theme">Ancient Egypt</button></div></header><div class="hud"><span id="status">Run the course and reach the gold flag.</span><span>← → / A D · Jump ↑ W Space</span></div><canvas id="game" width="960" height="480"></canvas><div class="controls"><button data-control="arrowleft">◀ LEFT</button><button data-control=" ">JUMP</button><button data-control="arrowright">RIGHT ▶</button></div><div id="level-debug" class="debug-panel"></div><div class="legend"><span class="key q">?</span> question &nbsp; <span class="key cp">⚑</span> checkpoint &nbsp; <span class="key hz">▲</span> hazard</div></main><div id="question-modal" hidden><dialog open><h2>Review Checkpoint</h2><p id="question-text"></p><div id="question-choices"></div><p id="question-feedback"></p></dialog></div><script src="data.js"></script><script src="themes.js"></script><script src="theme-renderer.js"></script><script src="level-validator.js"></script><script src="core.js"></script><script>let game;function launch(id){if(game){game.state="paused";game.clearInput()}const theme=TA_THEMES[id],level=TA_LEVELS[id],physics=TA_PHYSICS_PRESETS.earth;game=new TASideScroller.Engine({canvas:document.getElementById("game"),config:{player:physics},level,theme,questions:TA_SIDE_SCROLLER_QUESTIONS,themeId:id});game.validation=TASideScroller.LevelValidator.validate(level,physics);game.debugLevel=true;game.start();const v=game.validation,m=v.metrics;document.getElementById("status").textContent=theme.name+" — reach the finish flag.";document.getElementById("level-debug").innerHTML="<strong>Level Debug:</strong> "+v.issues.length+" unreachable platform section(s) · safe jump ≈ "+m.safeTilesY.toFixed(1)+" tiles high / "+m.safeTilesX.toFixed(1)+" tiles across. <span style=\"color:#86efac\">Green</span> = reachable, <span style=\"color:#fca5a5\">red</span> = unreachable.";document.querySelectorAll(".theme-switch button").forEach(b=>b.classList.remove("active"));document.getElementById(id+"-theme").classList.add("active")}document.getElementById("wwi-theme").onclick=()=>location.reload();document.getElementById("egypt-theme").onclick=()=>{if(game)game.state="paused";location.hash="egypt";location.reload()};launch(location.hash==="#egypt"?"egypt":"wwi");</script></body></html>
