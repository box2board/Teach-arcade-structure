<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#020617" />

  <!-- Subtle grid -->
  <g stroke="#0f172a" stroke-width="1">
    <!-- vertical lines -->
    <g>
      <line x1="0" y1="0" x2="0" y2="800" />
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="200" y1="0" x2="200" y2="800" />
      <line x1="300" y1="0" x2="300" y2="800" />
      <line x1="400" y1="0" x2="400" y2="800" />
      <line x1="500" y1="0" x2="500" y2="800" />
      <line x1="600" y1="0" x2="600" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="800" y1="0" x2="800" y2="800" />
      <line x1="900" y1="0" x2="900" y2="800" />
      <line x1="1000" y1="0" x2="1000" y2="800" />
      <line x1="1100" y1="0" x2="1100" y2="800" />
    </g>
    <!-- horizontal lines -->
    <g>
      <line x1="0" y1="0" x2="1200" y2="0" />
      <line x1="0" y1="80" x2="1200" y2="80" />
      <line x1="0" y1="160" x2="1200" y2="160" />
      <line x1="0" y1="240" x2="1200" y2="240" />
      <line x1="0" y1="320" x2="1200" y2="320" />
      <line x1="0" y1="400" x2="1200" y2="400" />
      <line x1="0" y1="480" x2="1200" y2="480" />
      <line x1="0" y1="560" x2="1200" y2="560" />
      <line x1="0" y1="640" x2="1200" y2="640" />
      <line x1="0" y1="720" x2="1200" y2="720" />
      <line x1="0" y1="800" x2="1200" y2="800" />
    </g>
  </g>

  <!-- Countries as simple shapes (stylized blobs, not to scale) -->
  <!-- France -->
  <path d="M260 450 L340 380 L420 380 L460 420 L440 500 L360 540 L280 520 Z"
        fill="#020617" stroke="#56E6FF" stroke-width="2" />
  <!-- Belgium -->
  <path d="M330 340 L370 320 L410 330 L400 360 L360 370 Z"
        fill="#020617" stroke="#56E6FF" stroke-width="2" />
  <!-- Germany -->
  <path d="M420 300 L520 260 L600 280 L620 340 L610 400 L560 430 L480 420 L440 380 Z"
        fill="#020617" stroke="#56E6FF" stroke-width="2" />
  <!-- United Kingdom (simplified) -->
  <path d="M180 260 L220 220 L240 260 L230 300 L190 300 Z"
        fill="#020617" stroke="#56E6FF" stroke-width="2" />
  <!-- Italy -->
  <path d="M460 480 L500 500 L520 540 L520 580 L500 600 L480 580 L470 540 Z"
        fill="#020617" stroke="#56E6FF" stroke-width="2" />
  <!-- Austria-Hungary -->
  <path d="M560 420 L640 400 L710 410 L740 450 L720 490 L650 510 L580 490 Z"
        fill="#020617" stroke="#56E6FF" stroke-width="2" />
  <!-- Russia -->
  <path d="M620 260 L760 220 L900 240 L940 320 L920 420 L820 430 L740 410 L640 400 L620 340 Z"
        fill="#020617" stroke="#56E6FF" stroke-width="2" />
  <!-- Ottoman Empire (simplified) -->
  <path d="M720 520 L820 520 L880 540 L860 580 L800 600 L730 580 Z"
        fill="#020617" stroke="#56E6FF" stroke-width="2" />

  <!-- Labels -->
  <g fill="#56E6FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="20">
    <text x="310" y="460">FRANCE</text>
    <text x="350" y="345">BELGIUM</text>
    <text x="480" y="310">GERMANY</text>
    <text x="180" y="220">U.K.</text>
    <text x="470" y="575">ITALY</text>
    <text x="600" y="440">AUSTRIA-HUNGARY</text>
    <text x="720" y="320">RUSSIA</text>
    <text x="740" y="570">OTTOMAN EMPIRE</text>
  </g>

  <!-- Title / frame -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#1f2937" stroke-width="2" />
  <text x="60" y="80" fill="#56E6FF"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Mono', monospace"
        font-size="24">
    WWI EUROPE – BLUEPRINT VIEW
  </text>
</svg>
