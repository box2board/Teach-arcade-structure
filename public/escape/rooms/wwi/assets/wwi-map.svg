<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 450"
  role="img"
  aria-labelledby="title desc">
  <title id="title">WWI Europe – Operation Map</title>
  <desc id="desc">
    Stylized blueprint map of Europe with a recognizable outline of the
    continent and key WWI regions.
  </desc>

  <defs>
    <!-- Blueprint grid pattern -->
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0b1220" stroke-width="1"/>
    </pattern>

    <style>
      .coast {
        fill:#020617;
        stroke:#38bdf8;
        stroke-width:2;
      }
      .island {
        fill:#020617;
        stroke:#38bdf8;
        stroke-width:1.8;
      }
      .label {
        fill:#38bdf8;
        font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        font-size:10px;
        letter-spacing:0.08em;
        text-transform:uppercase;
        opacity:.85;
      }
      .hint-box {
        fill:none;
        stroke:#38bdf8;
        stroke-width:1;
        stroke-dasharray:6 6;
        opacity:.18;
      }
    </style>
  </defs>

  <!-- Background & grid frame -->
  <rect x="0" y="0" width="800" height="450" fill="#020617" />
  <rect x="40" y="40" width="720" height="370" fill="url(#grid)" stroke="#020617" stroke-width="2"/>

  <text class="label" x="70" y="70">WWI EUROPE – OPERATION MAP</text>

  <!-- Mainland Europe silhouette (recognizable Europe-ish outline) -->
  <path class="coast" d="
    M 180 260
    L 185 275 190 285 200 295 220 300 240 305 260 310 280 320 295 330
    L 305 345 315 360 320 375 325 390 340 395 355 390 360 375 350 360
    L 345 345 350 330 360 320 380 320 390 310 400 320 410 340 420 360
    L 430 375 445 380 460 375 470 360 480 340 490 330 500 335 520 340
    L 540 345 560 340 580 330 590 310 600 290 620 280 640 270 650 250
    L 640 230 620 210 590 190 560 170 530 160 540 140 545 110 540 80
    L 520 70 500 80 485 100 475 115 470 130 450 140 430 145 410 147
    L 390 148 370 150 350 155 330 160 310 165 295 170 270 180 250 190
    L 230 200 210 205 185 210 160 220 145 235 140 250 145 260 160 270
    Z" />

  <!-- Iberian peninsula (Spain/Portugal protrusion) -->
  <path class="coast" d="
    M 160 270
    L 145 260 140 250 135 265 130 280 135 300 155 315 180 320 190 315
    L 185 300 175 290 Z" />

  <!-- Italian peninsula (boot) -->
  <path class="coast" d="
    M 295 330
    L 290 345 295 360 305 375 300 388 285 393 270 390 268 378
    L 270 365 265 350 255 338 Z" />

  <!-- Balkans / Greece -->
  <path class="coast" d="
    M 420 360
    L 410 355 400 350 395 360 392 372 398 385 410 395 425 397
    L 435 392 438 382 432 370 Z" />

  <!-- British Isles -->
  <path class="island" d="
    M 250 155
    L 240 145 238 130 245 115 260 110 275 115 280 130 275 145 268 155 Z" />
  <path class="island" d="
    M 232 165
    L 224 170 225 182 235 188 245 184 246 175 240 170 Z" />

  <!-- Southern Scandinavia (Norway/Sweden bottom) -->
  <path class="island" d="
    M 430 115
    L 445 100 465 92 485 95 495 110 498 130 492 145 480 155 465 160 450 157 Z" />

  <!-- Faint hint boxes for fronts (these line up roughly with your hotspots) -->
  <!-- Western Front zone (France/Belgium) -->
  <rect x="255" y="210" width="130" height="110" class="hint-box" />
  <!-- Eastern Front zone (toward Russia) -->
  <rect x="410" y="205" width="160" height="125" class="hint-box" />
  <!-- Southern Front zone (Italy/Balkans) -->
  <rect x="300" y="290" width="170" height="90" class="hint-box" />

  <!-- Simple region labels (not too bright) -->
  <text class="label" x="250" y="230">FRANCE</text>
  <text class="label" x="305" y="210">GERMANY</text>
  <text class="label" x="445" y="215">RUSSIA</text>
  <text class="label" x="280" y="350">ITALY</text>
  <text class="label" x="215" y="175">U.K.</text>
</svg>
