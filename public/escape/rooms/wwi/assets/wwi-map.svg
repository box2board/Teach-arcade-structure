<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 450"
  role="img"
  aria-labelledby="title desc">
  <title id="title">WWI Europe – Operation Map</title>
  <desc id="desc">
    Stylized blueprint map of Europe with faint internal borders for major
    powers during World War I.
  </desc>

  <defs>
    <!-- Blueprint grid pattern -->
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0b1220" stroke-width="1"/>
    </pattern>

    <!-- Stroke styles -->
    <style>
      .outline   { fill:none; stroke:#38bdf8; stroke-width:2; }
      .boundary  { fill:none; stroke:#1d4ed8; stroke-width:1.2; stroke-dasharray:4 4; opacity:.75; }
      .coast     { fill:rgba(15,23,42,0.9); stroke:#38bdf8; stroke-width:2; }
      .label     { fill:#38bdf8; font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                   font-size:10px; letter-spacing:0.08em; text-transform:uppercase; opacity:.8; }
    </style>
  </defs>

  <!-- Background + grid -->
  <rect x="0" y="0" width="800" height="450" fill="#020617" />
  <rect x="40" y="40" width="720" height="370" fill="url(#grid)" stroke="#020617" stroke-width="2"/>

  <!-- MAIN CONTINENT MASS (simplified but recognizable Europe) -->
  <!-- Mainland Europe silhouette (Spain, France, Germany, Balkans, western Russia) -->
  <path class="coast" d="
    M 140 290
    L 120 260 125 235 140 220 170 210 200 205
    L 225 200 250 190 270 180 295 170
    L 320 165 340 160 360 158 385 158
    L 410 160 435 165 460 172 485 180
    L 515 190 540 205 565 220 585 240
    L 600 260 610 280 615 300 610 320
    L 595 335 575 345 550 352 520 357
    L 490 360 460 362 430 362
    L 400 360 375 354 350 345
    L 330 337 310 330 290 322
    L 270 315 250 308 230 302
    L 210 298 190 295 170 293
    Z" />

  <!-- Iberian peninsula bump -->
  <path class="coast" d="
    M 140 290
    L 115 305 110 325 125 345 150 355 185 358
    L 205 355 210 340 200 325 175 310 160 300
    Z" />

  <!-- Italian peninsula (boot) -->
  <path class="coast" d="
    M 290 322
    L 300 340 305 365 295 380 305 392 325 392
    L 340 388 345 378 338 365 335 345 320 335
    Z" />

  <!-- Balkans / Greece extension -->
  <path class="coast" d="
    M 410 362
    L 430 378 440 392 455 400 470 397 478 385 472 370 460 352
    Z" />

  <!-- British Isles -->
  <path class="coast" d="
    M 210 150
    L 200 138 198 120 205 105 220 100 235 105 240 120 235 135 230 145 Z" />
  <path class="coast" d="
    M 225 160
    L 215 170 218 185 230 192 242 188 245 176 238 166 Z" />

  <!-- Scandinavia (stylized southern portion) -->
  <path class="coast" d="
    M 410 160
    L 420 135 435 120 455 110 475 115 485 130 487 150 480 165 460 172 Z" />

  <!-- ====== INTERNAL BOUNDARIES (dashed, faint) ====== -->

  <!-- France / Spain border -->
  <path class="boundary" d="
    M 185 358
    L 190 335 185 320 170 310 150 300" />

  <!-- France / Germany -->
  <path class="boundary" d="
    M 250 308
    L 252 285 260 265 275 245 295 230 310 220" />

  <!-- Germany / Eastern Europe (toward Poland/Russia) -->
  <path class="boundary" d="
    M 310 220
    L 335 210 360 205 388 205 415 210 440 220" />

  <!-- Eastern Europe / Russia bulk -->
  <path class="boundary" d="
    M 440 220
    L 468 230 495 242 520 258 545 278 565 300" />

  <!-- Alps / Italy boundary -->
  <path class="boundary" d="
    M 295 230
    L 305 245 310 260 305 280 295 300" />

  <!-- Balkans separation -->
  <path class="boundary" d="
    M 360 345
    L 380 340 400 338 420 340 440 352" />

  <!-- Southern Europe / Ottoman area (very stylized) -->
  <path class="boundary" d="
    M 440 352
    L 455 360 470 370 485 380" />

  <!-- ====== REGION TITLE (small, non-intrusive) ====== -->
  <text class="label" x="80" y="70">WWI EUROPE – OPERATION MAP</text>

  <!-- Faint region hints (optional, very subtle rectangles where your hotspots roughly are) -->
  <rect x="255" y="215" width="130" height="110"
        fill="none" stroke="#38bdf8" stroke-width="1"
        stroke-dasharray="6 6" opacity="0.2"/>
  <rect x="410" y="205" width="150" height="120"
        fill="none" stroke="#38bdf8" stroke-width="1"
        stroke-dasharray="6 6" opacity="0.18"/>
  <rect x="320" y="285" width="160" height="90"
        fill="none" stroke="#38bdf8" stroke-width="1"
        stroke-dasharray="6 6" opacity="0.14"/>
</svg>
