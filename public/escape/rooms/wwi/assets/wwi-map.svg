<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark blueprint background -->
  <rect x="0" y="0" width="1200" height="800" fill="#020617"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="720"
        fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Subtle grid -->
  <g stroke="#0f172a" stroke-width="1">
    <!-- vertical lines -->
    <g>
      <line x1="80" y1="40" x2="80" y2="760"/>
      <line x1="160" y1="40" x2="160" y2="760"/>
      <line x1="240" y1="40" x2="240" y2="760"/>
      <line x1="320" y1="40" x2="320" y2="760"/>
      <line x1="400" y1="40" x2="400" y2="760"/>
      <line x1="480" y1="40" x2="480" y2="760"/>
      <line x1="560" y1="40" x2="560" y2="760"/>
      <line x1="640" y1="40" x2="640" y2="760"/>
      <line x1="720" y1="40" x2="720" y2="760"/>
      <line x1="800" y1="40" x2="800" y2="760"/>
      <line x1="880" y1="40" x2="880" y2="760"/>
      <line x1="960" y1="40" x2="960" y2="760"/>
      <line x1="1040" y1="40" x2="1040" y2="760"/>
      <line x1="1120" y1="40" x2="1120" y2="760"/>
    </g>
    <!-- horizontal lines -->
    <g>
      <line x1="40" y1="80" x2="1160" y2="80"/>
      <line x1="40" y1="140" x2="1160" y2="140"/>
      <line x1="40" y1="200" x2="1160" y2="200"/>
      <line x1="40" y1="260" x2="1160" y2="260"/>
      <line x1="40" y1="320" x2="1160" y2="320"/>
      <line x1="40" y1="380" x2="1160" y2="380"/>
      <line x1="40" y1="440" x2="1160" y2="440"/>
      <line x1="40" y1="500" x2="1160" y2="500"/>
      <line x1="40" y1="560" x2="1160" y2="560"/>
      <line x1="40" y1="620" x2="1160" y2="620"/>
      <line x1="40" y1="680" x2="1160" y2="680"/>
      <line x1="40" y1="740" x2="1160" y2="740"/>
    </g>
  </g>

  <!-- Title -->
  <text x="64" y="88" fill="#38bdf8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="24">
    WWI EUROPE – OPERATION MAP
  </text>

  <!-- Stylized Europe outline (very simplified, but recognizable) -->
  <path d="
      M 220 210
      L 260 190 L 320 170 L 380 175 L 430 190
      L 470 210 L 510 220 L 540 250 L 580 260
      L 640 260 L 690 270 L 730 290 L 760 320
      L 780 360 L 800 400 L 810 440 L 800 470
      L 770 500 L 730 520 L 690 540 L 650 550
      L 610 560 L 560 570 L 520 570 L 480 560
      L 440 540 L 410 520 L 380 500 L 350 490
      L 310 470 L 280 450 L 250 430 L 230 410
      L 220 380 L 210 340 L 210 300 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"/>

  <!-- U.K. island -->
  <path d="
      M 180 220
      L 200 210 L 220 220 L 225 240
      L 215 260 L 195 265 L 180 250 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"/>

  <!-- Italy peninsula -->
  <path d="
      M 430 520
      L 445 540 L 455 560 L 450 580
      L 440 595 L 430 585 L 420 560 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"/>

  <!-- Ottoman / Balkans chunk -->
  <path d="
      M 560 560
      L 610 570 L 660 580 L 690 600
      L 700 630 L 680 650 L 640 655
      L 600 650 L 570 630 L 555 600 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"/>

  <!-- Labels for key countries (light, blueprint-style) -->
  <text x="300" y="260" fill="#94a3b8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="16">FRANCE</text>

  <text x="370" y="235" fill="#94a3b8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="16">BELGIUM</text>

  <text x="430" y="250" fill="#94a3b8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="16">GERMANY</text>

  <text x="540" y="260" fill="#94a3b8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="16">AUSTRIA-HUNGARY</text>

  <text x="640" y="300" fill="#94a3b8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="16">RUSSIA</text>

  <text x="175" y="205" fill="#94a3b8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="16">U.K.</text>

  <text x="445" y="610" fill="#94a3b8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="16">ITALY</text>

  <text x="585" y="645" fill="#94a3b8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="16">OTTOMAN EMPIRE</text>

  <!-- Front zones (used conceptually; hotspots sit on top) -->
  <!-- Western Front area -->
  <rect x="290" y="260" width="180" height="120"
        fill="rgba(56,189,248,0.04)"
        stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="300" y="290" fill="#38bdf8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="14">WESTERN FRONT</text>

  <!-- Eastern Front area -->
  <rect x="560" y="270" width="220" height="130"
        fill="rgba(56,189,248,0.04)"
        stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="570" y="300" fill="#38bdf8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="14">EASTERN FRONT</text>

  <!-- Southern / Balkan Front area -->
  <rect x="470" y="500" width="220" height="120"
        fill="rgba(56,189,248,0.04)"
        stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="480" y="530" fill="#38bdf8"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'SF Mono',monospace"
        font-size="14">SOUTHERN FRONT</text>
</svg>
