<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spin the Wheel (Random Picker) | Teach Arcade</title>

  <link rel="stylesheet" href="/assets/styles.css?v=1" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/images/teach-arcade-logo.png" />

  <style>
    .hero { text-align:center; padding:40px 0 10px; }
    .hero h1 { font:700 30px/1.2 Poppins, sans-serif; margin:0 0 10px; }
    textarea { width:100%; height:180px; border:1px solid #cbd5e1; border-radius:8px; padding:10px; font:400 15px Nunito,sans-serif; }
    .controls { margin-top:10px; display:flex; flex-wrap:wrap; gap:10px; }
    button { font:600 14px Poppins,sans-serif; padding:8px 14px; border:none; border-radius:8px; cursor:pointer; }
    button.primary { background:#2563eb; color:white; }
    button.danger { background:#ef4444; color:white; }
    canvas { display:block; margin:20px auto; }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <script src="/assets/scripts/nav.js" defer></script>

  <main class="container">
    <nav class="breadcrumbs">
      <a href="/">Home</a> › <a href="/teacher-tools.html">Teacher Tools</a> › Spin the Wheel
    </nav>

    <section class="hero">
      <h1>🎯 Spin the Wheel (Random Picker)</h1>
      <p>Enter your items, then spin the wheel to choose one at random!</p>
    </section>

    <section>
      <label for="items"><strong>Your List</strong></label>
      <textarea id="items" placeholder="Type one item per line (names, choices, etc.)"></textarea>
      <div class="controls">
        <button id="spin" class="primary">Spin</button>
        <button id="clear" class="danger">Clear</button>
        <button id="shuffle">Shuffle</button>
      </div>
    </section>

    <canvas id="wheelCanvas" width="400" height="400"></canvas>

    <p id="result" style="text-align:center;font:700 20px Poppins,sans-serif;color:#2563eb;"></p>
  </main>

  <footer>
    © <script>document.write(new Date().getFullYear())</script> Teach Arcade •
    <a href="/privacy.html">Privacy</a> • <a href="/terms.html">Terms</a>
  </footer>

  <script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const result = document.getElementById('result');
    const spinBtn = document.getElementById('spin');
    const clearBtn = document.getElementById('clear');
    const shuffleBtn = document.getElementById('shuffle');
    const textarea = document.getElementById('items');
    let items = [];
    let startAngle = 0;
    let arc = 0;
    let spinTimeout = null;

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (items.length === 0) return;
      arc = Math.PI * 2 / items.length;
      for (let i = 0; i < items.length; i++) {
        const angle = startAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = `hsl(${(i * 360 / items.length)}, 80%, 60%)`;
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 200, angle, angle + arc);
        ctx.lineTo(200, 200);
        ctx.fill();
        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(angle + arc / 2);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px Nunito";
        ctx.fillText(items[i], 100, 5);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.moveTo(200, 0);
      ctx.lineTo(190, 20);
      ctx.lineTo(210, 20);
      ctx.closePath();
      ctx.fillStyle = "red";
      ctx.fill();
    }

    function rotateWheel() {
      startAngle += Math.PI / 30;
      drawWheel();
    }

    function spinWheel() {
      if (items.length === 0) return alert('Enter at least one item!');
      let spinAngle = Math.random() * 10 + 10;
      let spinTime = 0;
      const spinTimeTotal = Math.random() * 3000 + 4000;

      function rotate() {
        spinTime += 30;
        if (spinTime >= spinTimeTotal) stopRotateWheel();
        else {
          const spinAngleDelta = easeOut(spinTime, 0, spinAngle, spinTimeTotal);
          startAngle += (spinAngleDelta * Math.PI / 180);
          drawWheel();
          spinTimeout = setTimeout(rotate, 30);
        }
      }
      rotate();
    }

    function stopRotateWheel() {
      clearTimeout(spinTimeout);
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = arc * 180 / Math.PI;
      const index = Math.floor((360 - (degrees % 360)) / arcd) % items.length;
      result.textContent = `🎉 Result: ${items[index]}!`;
    }

    function easeOut(t, b, c, d) {
      t /= d;
      t--;
      return c * (t * t * t + 1) + b;
    }

    spinBtn.onclick = spinWheel;
    clearBtn.onclick = () => { textarea.value = ''; items = []; drawWheel(); result.textContent = ''; };
    shuffleBtn.onclick = () => {
      items = items.sort(() => Math.random() - 0.5);
      drawWheel();
    };
    textarea.oninput = () => {
      items = textarea.value.split('\n').filter(i => i.trim() !== '');
      drawWheel();
    };
  </script>
</body>
</html>
